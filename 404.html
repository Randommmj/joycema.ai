<script>
(function(){
  var b=document.querySelector('.totop'), bar=document.querySelector('.progress i');
  function f(){
    var y=window.scrollY, h=document.documentElement.scrollHeight-window.innerHeight;
    if(b) b.classList.toggle('on', y>700);
    if(bar) bar.style.transform='scaleX('+(h>0?Math.min(1,y/h):0)+')';
  }
  window.addEventListener('scroll', f, {passive:true}); f();
  if(b) b.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
  var k=document.querySelector('[data-back]');
  if(k) k.addEventListener('click', function(e){
    try {
      if(document.referrer && new URL(document.referrer).origin===location.origin && history.length>1){
        e.preventDefault(); history.back();
      }
    } catch(_){}
  });
  // 复制链接；手机上调起系统分享
  Array.prototype.forEach.call(document.querySelectorAll('[data-share]'), function(btn){
    btn.addEventListener('click', function(){
      var u=location.href.split('#')[0].split('?')[0], sp=btn.querySelector('span'), old=sp.textContent;
      function done(){ sp.textContent=btn.getAttribute('data-done'); btn.classList.add('ok');
        setTimeout(function(){ sp.textContent=old; btn.classList.remove('ok'); }, 2200); }
      function fallback(){ var a=document.createElement('textarea'); a.value=u; a.setAttribute('readonly','');
        a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select();
        try{ document.execCommand('copy'); done(); }catch(_){} document.body.removeChild(a); }
      if(navigator.share && window.matchMedia && matchMedia('(pointer:coarse)').matches){
        navigator.share({title:document.title, url:u}).catch(function(){}); return; }
      if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(u).then(done, fallback); } else fallback();
    });
  });
  // 「公众号版」入口只给 Joyce 自己：任意页面加 ?wx 打开一次即开启，?wx=off 关闭
  try{
    var wq=new URLSearchParams(location.search).get('wx');
    if(wq!==null) localStorage.setItem('jm_wx', wq==='off'?'':'1');
    var wa=document.querySelector('[data-wx]'); if(wa && localStorage.getItem('jm_wx')) wa.hidden=false;
  }catch(_){}
  // 按 / 键去搜索
  document.addEventListener('keydown', function(e){
    var t=e.target.tagName;
    if(e.key==='/' && !e.metaKey && !e.ctrlKey && t!=='INPUT' && t!=='TEXTAREA' && !document.getElementById('q')){
      var s=document.querySelector('.searchlink'); if(s){ e.preventDefault(); location.href=s.href; }
    }
  });
})();
</script>
