<div class="phone"><div class="wxhead"><h1>哈佛笔记｜Building Competitive Advantage through Operations</h1><p>Joyce Ma<span>2025-09-02</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>故事梗概Toyota Production System 太有名了，感兴趣的伙伴可以自己查询。本质上就是在讲一件事情：如何赋能普通人，一起做成非凡的事情。Enabling “Ordinary People”(like all of us) to do Extraordinary WorkThe reason any organization exists is to enable this, things that I could not do alone.我们在一起是为了做成一些 我们自己独自做不了的事情 —— 我自己也做不了。</p>
<p>It is easier to get to your destination, if you tell people where you want to go.</p>
<p>执行很重要例如在哈佛商学院或者咨询公司，PPT好看就是很重要！</p>
<p>Operational Execution</p>
<p>Excellent Execution and Mediocre Strategy</p>
<p>will beat</p>
<p>Mediocre Execution and Excellent Strategy</p>
<p>Empathy and InnovationBuild Customers Empathy?BUILD EMPLOYEE EMPATHY FIRST!</p>
<p>What is really about TPSStandardizationset ruleshow do we do each taskhow do we follow rulesVisibilityCleanlinesMake problem as visible as possibleGuide the team leadersSpecific locationContinuous ImprovementFeedback from al employeesSafe to highlight a problem —— Sending a message also : we care about QUALITYAttend to the little things军事培训中，不仅是训练枪械，还要擦鞋、衣冠整洁 —— 这些事情都需要破窗效应Message to employeesI care about it透明制度 背后，是caring about it very much在TPS系统中有一个绳子，人们可以拉绳子来提出问题但有绳子就可能提升了吗？ —— 人们不会轻易拉绳子为什么？ —— 整体是文化好像拉绳子是麻烦别人 —— 是不是有个专人，会好一点。</p>
<p>Country Culture vs Company Culture</p>
<p>What went wrong with Toyota?Toyota has, for the past few years, been expanding its business rapidly. Quite frankly, I fear the pace at which we have grown may have been too quick.I would like to point out here that Toyota's priority has traditionally been the following: First; Safety, Second; Quality, and Third Volume. These priorities became confused, and we were not able to stop, think, and make improvements as much as we were able to before, and our basic stance to listen to customers' voices to make better products has weakened somewhat.We pursued growth over the speedat which we were able to develop our people and our organization, and we should sincerely be mindful of that.I regret that this has resulted in the safety issues described in the recalls we face today, and I am deeply sorry for any accidents that Toyota drivers have experienced.很明显，CEO是知道的 —— 但他太自信不会出事！Over confident！</p>
<p>我们的组织，也有一天可能发展得太快， 而没有更注重风险。</p>
<p>TPS needs to be Reinforced ConstantlyInterview with Katsuaki Watanabe, President of Toyota in HBR (July-August 2007)."I realize that our systems may be overstretched....We must make that issue visible.""If a time comes at Toyota when I need to put my foot on the brake pedal rather than on the accelerator, I won't hesitate to do so.""It's my job to pull the Andon cord."</p>
<p>Andon Cord —— 管理者要对拉灯的人say thank you！！</p>
<p>“Andon cord”（中文常译为“安灯绳”）是源自丰田生产方式（Toyota Production System, TPS）的核心工具之一，属于“即时生产（JIT）”和“自动化（Jidoka，自働化）”理念的关键实践，核心作用是让生产线上的任何人在发现问题时，都能快速暂停生产、暴露问题并推动解决，从而避免缺陷流转、提升生产效率和产品质量。</p>
<ol>
<li>
<p>核心定义与起源本质：一条物理拉绳（或按钮、电子触发装置），通常沿生产线布置（如每台设备旁、工位上方），生产线上的任何员工（无论职位高低）只要发现以下问题，都有权拉动：产品存在质量缺陷（如零件安装错误、外观瑕疵）；设备异常（如故障、精度偏差）；物料短缺（如零件未及时送达）；安全隐患（如操作风险、环境异常）；流程卡顿（如工序衔接不畅、节拍紊乱）。起源：20世纪50年代丰田汽车工厂，丰田创始人丰田喜一郎和工程师大野耐一为解决“批量生产中缺陷隐藏”的问题设计——传统生产中，员工常因担心“停工影响效率”而隐瞒问题，导致缺陷产品累积；安灯绳则通过“允许停工、鼓励暴露问题”，从根源减少浪费（TPS中的“七大浪费”之一“不良品浪费”）。</p>
</li>
<li>
<p>工作流程：从“拉动”到“解决”的闭环</p>
</li>
</ol>
<p>安灯绳的运作遵循严格的流程，确保问题不被搁置，形成“发现-响应-解决-复盘”的闭环：触发（Pull）：员工发现问题后，拉动所在工位的安灯绳（或按下按钮）；警示（Alert）：拉绳后，生产线对应的“安灯看板”（Andon Board，通常是电子屏或信号灯）会亮起对应工位的指示灯（如红色=紧急停工，黄色=需要协助），同时可能伴随蜂鸣提示；响应（Respond）班组长、技术员或支持人员（如设备维护、物料员）需在规定时间内（如30秒内）赶到触发工位；若问题在短时间内（如2分钟内）无法解决，班组长会升级响应，甚至暂停整条生产线；解决（Resolve）：团队现场分析问题根源（如用“5Why分析法”），快速修复（如更换零件、调整设备、补充物料）；复位与复盘（Reset &amp; Review）：问题解决后，由授权人员复位安灯系统，恢复生产；事后需记录问题原因、解决方案，纳入培训或流程优化，避免同类问题重复发生。6. 核心价值：不止是“停工工具”</p>
<p>安灯绳的意义远超“暂停生产”，其核心价值体现在丰田生产方式的底层逻辑：赋权员工，打破层级壁垒无论新员工还是老员工，都有权“叫停”生产，体现“尊重人性”的管理理念——员工最贴近生产现场，最易发现问题，赋权能激发其主动性和责任感。即时暴露问题，避免“隐性浪费”传统生产中，“带缺陷生产”会导致后续工序返工、物料浪费、客户投诉；安灯绳通过“即时停工”，将问题扼杀在萌芽阶段，降低后续成本。推动“持续改善（Kaizen）”每次拉绳都是一次“问题信号”，大量拉绳数据可汇总分析（如某工位频繁因设备故障触发），成为流程优化、设备升级、员工培训的依据，推动生产系统持续迭代。保障质量与安全从源头阻断缺陷流转，同时快速消除安全隐患，符合“质量第一、安全优先”的生产原则。7. 应用场景：从制造业到跨行业延伸核心场景汽车制造（如丰田、宝马、大众等车企的总装线、冲压线）、电子制造（如手机、家电生产线）、机械加工等离散制造业——这类行业工序多、工位密集，问题易流转，安灯绳的“即时响应”价值显著。延伸场景服务业：部分餐饮连锁（如后厨出餐卡顿）、物流仓库（如分拣错误）引入类似机制，通过“呼叫按钮”快速响应问题；医疗领域：部分医院手术室、病房用“紧急呼叫绳”（虽功能侧重急救，但逻辑类似“即时触发-快速响应”）。</p>
<p>关于公司的培训</p>
<p>如果把人送出去培训，他们回来就没有环境了；</p>
<p>如果邀请人进来培训， 那么整个公司是同步骤进行的；</p></div></template>
<script>

function wxConvert(root, heroSrc, date, url){
  var C='#333333', B='#385EA1';
  var P='margin:0 0 22px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var H2='margin:44px 0 18px 0;font-size:20px;line-height:1.5;letter-spacing:1px;font-weight:700;color:'+B+';';
  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

(function(){
  var src=document.getElementById('src').content, box=document.getElementById('light'), btn=document.getElementById('copy');
  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
