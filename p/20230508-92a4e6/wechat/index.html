<div class="phone"><div class="wxhead"><h1>2023年巴菲特年会｜流水账</h1><p>Joyce Ma<span>2023-05-08</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>今年，巴菲特92岁，芒格99岁了。‍‍‍‍</p>
<p>和绅士的申申和一众朋友们一起到奥马哈，带着朝拜的心情，把一个粉丝能干的事儿都干了一遍。</p>
<p>读书和身临其境，真是感触不同。‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍</p>
<p>Day One</p>
<p>巴菲特住了30多年的房子。‍</p>
<p>从地上拾起一片片花瓣，夹在笔记本里带走。我也想像巴老爷子一样，活得毫不为物质所累。‍‍</p>
<p>跳着踢踏舞去上班的麦当劳和办公室。一路遇到很多人，都说认识巴菲特，他就像在镇子上人人都认识，都能打招呼的乡绅。‍‍‍‍</p>
<p>常去吃的牛排店里，放着一比一的纸牌人物像，专门拿到各个餐桌上供人拍照。 这么小的一个城市，巴菲特带来多少经济效益，I think his city and community is very proud of him, and he is very happy to do the contribution too.</p>
<p>股东折扣卖场，一个超大场馆中很多个摊位，就像促销展会一样。一美元的DQ随便吃，想起当年对DQ的投资，搞得我糖戒都破了。‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍</p>
<p>Day Two</p>
<p>最卷队伍不是盖的，凌晨四点就到门口排队。还战略研究了一下应该去哪个区域，最后敲定了122/106区，目标相当明确。（凌晨四点，已经有不少人在排队了）。‍‍‍‍‍‍‍</p>
<p>这世界还是奖励勤奋的人的，坐到了非常好的位置。‍‍‍</p>
<p>几乎能看清楚两位老先生脸上的表情，看到个比尔.盖茨也不是问题。</p>
<p>把自己乱七八糟的笔记贴上来。</p>
<p>我没有整理和编辑，因为需要花费大量时间，可能会让我最终发不出去这篇文章。所以，就这样，说错了不负责：‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍</p>
<p>价值投资是个信仰有人来许愿、有人来还愿有人第1次来，有人第5次来，有人第35次来。有位连续来了5年的年轻投资人，他说，知易行难，所以来增强自己的信心。需要不断来汲取能量，才能保持住初心。现场感受价值投资</p>
<p>在A股做价值投资：20%很艰难，70%极度艰难， 只有10%是爽的。股东折扣日在一个超大型体育场里，一个个摊位。从DQ冰淇凌到墙漆涂料、平价靴子、衣服、床具、保险到游艇和私人飞机。</p>
<p>不性感，就像一个城市居民的大卖场，让我看到了乘着「美国梦」起飞的一代企业。生活简单的人也可以做不简单的事</p>
<p>奥马哈城市中的酒店，感觉比其他地方要多得多，走进巴菲特家旁边的麦当劳，从收银的服务员到吃早餐的老爷爷都认识巴菲特，一起打过桥牌或。一个人可以在取得如此卓越事业成就后，仍如此是多么不容易。更不容易的是，他就是以这样的姿态成功的。诚信最为重要-  摘自2002/2004年，巴菲特代表soloman出席听证会时所讲的话</p>
<ul>
<li>如果有一天他们所作所为在他们local报纸上被刊登出来，是否还可以。 如果他们可以go through这个test，他们不需要我的评估和管理。Community- Shareholders of Berkshire is like a community- 很多股东都是退休的中产阶级，相信巴菲特而投资伯克希尔</li>
</ul>
<p>Fairness</p>
<ul>
<li>Just like buy a farm, regards shareholder as partners. Nothing Sure</li>
</ul>
<p>Nothing sure today, tomorrow, nothing sure anytime.AI impact on the market negative or positive?</p>
<p>巴菲特皮了一下： thank you for asking Charlie that question</p>
<ul>
<li>BYD factory in china we gonna see a lot of robotics</li>
</ul>
<p>I think old fashion works pretty well</p>
<ul>
<li>
<p>Won’t be anything irreplacable</p>
</li>
<li>
<p>If something can do all kinds of things, I am worried</p>
</li>
<li>
<p>AI will change everything expect the way the man will behaveValue investment will be harder after AI</p>
</li>
<li>
<p>My suggestion to value investors is to be prepared to earn less （by Muger）</p>
</li>
<li>
<p>The world changing all the time, what gives you opportunists is other people doing dumb things. They do big dumb things , why they do , is they can take money from other people so easily in the beginning. </p>
</li>
</ul>
<p>遗嘱｜家庭教育｜后代继承</p>
<ul>
<li>
<p>in my family i do not sign the will until my children are aware and make suggestion</p>
</li>
<li>
<p>Depends on the business, on how they feel about each other , and depends on thousands things. People run into all kinds of things, some people use the will depending on their will . They made a lot of mistakes.</p>
</li>
<li>
<p>芒格: Berkshire has a simple answer — just hold the god damn stock!</p>
</li>
<li>
<p>It’s important that you want your children to have certain values it’s important to live them. </p>
</li>
<li>
<p>Once a year, you should get your children together and have a dinner, giving them blank signed check wouldn't work.</p>
</li>
<li>
<p>There are a lot of things that I don't like, but most of time I just keep silence</p>
</li>
</ul>
<p>TTI创始人的选择</p>
<ul>
<li>
<p>He has got the money way more than he and his family needs.</p>
</li>
<li>
<p>But if I sell the company, they gonna fire my people and leave their people, 所以最后他将公司卖给巴菲特。</p>
</li>
</ul>
<p>How owners of companies give up their benefit to Berkshire Hathaway</p>
<ul>
<li>
<p>I had five bosses in my life, i love working for them.</p>
</li>
<li>
<p>But there is NOTHING like working for yourself, working for Berkshire Hathaway is probably the closest thing to it.‍</p>
</li>
</ul>
<p>Doing what we do is a huge pleasant thing</p>
<ul>
<li>
<p>We gonna follow our own principles</p>
</li>
<li>
<p>We don’t want to be any other big companies' CEO</p>
</li>
<li>
<p>If you play golf everyday and you know you gonna hit the hole, nobody will play golf</p>
</li>
<li>
<p>We are in the game just for us</p>
</li>
<li>
<p>We had a lot of fun</p>
</li>
</ul>
<p>btw，奥马哈有很多Vintage店，值得一逛。我淘到了芒格签名的第二版《穷查理宝典》！</p>
<p>这一趟旅行真是收获满满，just could not ask for more.</p></div></template>
<script>

function wxConvert(root, heroSrc, date, url){
  var C='#333333', B='#385EA1';
  var P='margin:0 0 22px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var H2='margin:44px 0 18px 0;font-size:20px;line-height:1.5;letter-spacing:1px;font-weight:700;color:'+B+';';
  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

(function(){
  var src=document.getElementById('src').content, box=document.getElementById('light'), btn=document.getElementById('copy');
  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
