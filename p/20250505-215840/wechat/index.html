<div class="phone"><div class="wxhead"><h1>梵高：每个人心中都有一团火，路过的人只看到烟</h1><p>Joyce Ma<span>2025-05-05</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>波士顿 ｜ 梵高展The Roulin Family Portraits</p>
<p>每个人的心里都有一团火，路过的人只看到烟。 但是总有一个人，总有那么一个人能看到这团火，然后走过来，陪我一起。 </p>
<p>我在人群中，看到了他的火，然后快步走过去， 生怕慢一点他就会被淹没在岁月的尘埃里。 </p>
<p>我带着我的热情，我的冷漠，我的狂暴，我的温和， 以及对爱情毫无理由的相信，走的上气不接下气。 我结结巴巴的对他说：你叫什么名字。</p>
<p>从你叫什么名字开始，后来，有了一切。</p>
<p>—— 《亲爱的提奥》梵高</p>
<p>4月7日，一个阴雨绵绵的午后，我们匆匆赶到波士顿 Museum of Fine Art。</p>
<p>这次展览汇聚了23件梵高作品，其中包括14幅描绘邮差约瑟夫·鲁林一家成员的肖像画。</p>
<p>这是梵高在1888年至1889年间于法国阿尔勒创作的肖像。</p>
<p>这次展览还涵盖了梵高早期受荷兰古典肖像画影响的作品，以及他从日本浮世绘中汲取的艺术灵感，帮助观众全面理解梵高的艺术视野和创作背景。</p>
<p>梵高当时的生活与创作状态1888年至1889年，梵高在阿尔勒度过了艺术创作的黄金时期，创作了近300幅作品，风格更加成熟鲜明，色彩浓烈且充满生命力。</p>
<p>像我这般饱受痛苦折磨之人，若没有比我自身更为伟大的事物相伴，那便是我的生命，以及创作的力量，我便无法活下去。</p>
<p>要是身体上没办法创作了，我们就试着去创造思想，而不是生育子女。这样的话，我们也还是人类的一部分。</p>
<p>啊，那幅肖像画 —— 就是那种能体现模特的想法和灵魂的肖像画 —— 在我看来，它肯定会画出来的。</p>
<p>——1888 年 9 月 3 日，梵高写给西奥・梵高</p>
<p>阿尔勒的阳光明媚，光线强烈，激发了梵高对色彩的热情，他希望通过作品捕捉这种独特的光影效果。</p>
<p>鲁林一家与梵高的关系当时梵高生活较为孤独，与当地居民交流有限。</p>
<p>鲁林一家是梵高在阿尔勒的邻居，邮差约瑟夫·鲁林及其妻子奥古斯丁和三个孩子成为他创作肖像的重要对象，但他在鲁林一家也找到了情感的寄托和家庭般的温暖。</p>
<p>这家人不仅为梵高提供了精神上的支持，也成为他探索现代肖像艺术的灵感源泉。</p>
<p>1888年10月，画家保罗·高更来到阿尔勒，带来了短暂的艺术合作与希望，但两人性格及艺术理念差异较大，最终未能长久合作。</p>
<p>这一系列作品在梵高艺术中的地位</p>
<p>鲁林家族肖像是梵高对“现代肖像”热情的体现，代表了他在肖像绘画领域的重要突破。</p>
<p>这些作品以其鲜明的色彩、强烈的笔触和对人物内心世界的深刻表现，成为梵高晚期艺术的代表作之一。</p>
<p>在梵高约2100幅作品中，这一系列肖像不仅丰富了他的艺术题材，也深化了他对人物情感和个性的刻画，是理解梵高艺术生涯不可或缺的部分。</p>
<p>我想画出触动人心的素描，我想透过人物或风景所表达的，不是伤感的忧郁，而是真挚的悲伤。 —— 《亲爱的提奥》梵高</p>
<p>梵高是第一个让我看到流泪的画家，看到他的笔触我就会哽咽。</p>
<p>当我读到《亲爱的提奥》这本书时，我才明白了为什么 —— </p>
<p>因为他有一颗纯净纯粹的灵魂。</p>
<p>我画太阳时，要画得让人们感觉到它以可怕的速度在旋转。它发射出力量无穷的光波和热波。</p>
<p>我画麦田时，要人们感觉到谷粒中的原子在生长、爆裂。</p>
<p>我画苹果时，要人们感觉到苹果中的液汁溅到皮肤上，果核中的种籽在往外钻向开花结果！</p>
<p>当我画一个男人，我就要画出他滔滔的一生。 ----《渴望生活》</p></div></template>

function wxConvert(root, heroSrc, date, url){

  function inl(n){

      if(c.nodeType===3){ h+=esc(c.textContent); return; }

  function blocks(root, ps){

      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;

        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
