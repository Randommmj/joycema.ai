<div class="phone"><div class="wxhead"><h1>哈佛笔记｜领导力案例 - C&amp;S自我管理团队的启示</h1><p>Joyce Ma<span>2025-09-24</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>故事梗概</p>
<p>C&amp;S Wholesale Grocers 是一家成立 70 年的杂货批发商，1988 年他们接到 A&amp;P 超市的大订单，销售额从 4.5 亿美元跃升至 6.5 亿美元。但随之而来的是仓库拥堵、事故增多、员工流失严重（仓库工人年流失率接近 90%），生产效率和质量都下降。</p>
<p>CEO Rick Cohen 发现传统“分工制 + 层层监督”的仓库运作方式效率低，责任模糊，成本高。他尝试“自我管理团队（self-managed teams）”：小团队负责整个订单（拣货、装载、检查、签字），团队自选成员，自我监督，团队整体为绩效负责。实验结果显示生产效率提升、质量更好，员工也更有成就感。但 Cohen 面临决策：是否全面推广？要怎么实施？现在是不是时机合适？</p>
<p>故事线（Timeline）1918：Israel Cohen 创办 C&amp;S。1958：拿下 Big D 连锁超市订单，开始大幅成长。1975：工会罢工，几乎破产 → 迁往佛蒙特州 Brattleboro，成为无工会公司。1981：新仓库启用，年销售额 9800 万美元，目标 3 亿，最终在 1986 达到 4 亿。1987：Cohen 出任 CEO。1988：签下 A&amp;P，销售额跳到 6.5 亿，但仓库超负荷、事故和流失率高。1988 夏季：Cohen 测试“自我管理团队”，结果积极。1988 秋季：Cohen 考虑是否大规模推行团队制。</p>
<p>课堂笔记</p>
<ol>
<li>Make sure there is accountability！</li>
</ol>
<p>No AccountabilityLow motivationNo link to role</p>
<ol start="2">

</li>

</li>
<li>

</li>

</ol>
<p>Employees： OverworkedMore movement of stockTiredTraffic chaos - pallets in corridorstress — especially accidents happenRight after HIRINGOn the job trainingSupervisorsWhat i really want?MarginsEfficiency - on time, accurate</p>
<ol start="6">
<li>
<p>这个公司如何开始用self management？LeversAsk workersBetter TrainingContingenciesEmployees ready to have control?Self-managed TeamsAdvantagesPride in ownershipMotivated to improve systemShawn的案例 ：1992年3个17岁的小男孩是全镇最高效的装卸工人，因为他爸爸给每个人14美金装卸西瓜。 他们从一开始4小时工作，降低到2小时KPIs - incentivesClear Goals - own pallets - start to finish</p>
</li>
<li>
<p>Planning top-down vs Execution bottom-up</p>
</li>
<li>
<p>Downsides of self managementNot right for everyone，每个小组的表现力都会很不一样There are so many things that we can standardize</p>
</li>
<li>
<p>It is much easier to start it THAN to keep it.The leaders team has to push hard for to keep the momentumThere are people who really want to change their lives, but there are people who do not.Need to ATTRACT people.</p>
</li>
<li>
<p>Be careful about the assumptions about why they people in your organization are like this.They are just like that, their nature. That is the people who they are？OR...What they act, is part of the production of the organization — MotivationBecause there is NO ROOM to doing so.There are room to get WAY MORE than you get from your employeesChange it and the employees are so better off.There are so many dissatisfied employees in the world</p>
</li>
<li>
<p>Culture is important, so is compensation!Everybody wants to be proud of something！If they do not find it here at your company, then they will find it somewhere else.</p>
</li>
<li>
<p>Get the influencer, getting them on boardWhen you try to do the organization change, get those people on board.Get the people with Right Amount of Ego! 需要有拼劲，但不能是想要霸占credit的人</p>
</li>
<li>
<p>小组里面会有培训因为培训新人也会影响团队的产出。</p>
</li>
<li>
<p>反馈机制需要非常迅速每天都知道每个人做了多少箱 Measurable output is crucial</p>
</li>
<li>
<p>How to do real [Self management team] instead of just saying it?让人们真的做到自我驱动？不要step in 太多</p>
</li>
<li>
<p>Get the people early on, Listen to them！they can improve a lot40% 人员减少- 30%是质量掌控People do their job , it is their world</p>
</li>
</ol>
<p>总结起来是这样看似是仓库拣货的流程问题，其实背后触及了领导者的心态、员工的动力、组织的文化。</p>
<ol>
<li>Accountability：责任必须有人承担</li>
</ol>
<p>最大的关键词是 Accountability（责任追溯）。</p>
<p>传统模式下，订单被拆给不同工人，出错了没人负责。自我管理团队的逻辑是：从头到尾一个小组负责，钱一起赚，错了也一起担。</p>
<p>但这里有一个前提：领导者必须愿意放手。</p>
<p>如果老板死盯着每一个细节，员工永远只是“执行者”，而不会成为“主人翁”。</p>
<ol start="2">
<li>高承诺实践：让员工像主人一样思考</li>
</ol>
<p>课堂上提到一个例子：沃尔玛会给店长公司股票，让他们既关心门店业绩，也关心公司整体表现。</p>
<p>这其实是高承诺实践（High Commitment Practices）：把“我的工作”转变成“我的事业”。</p>
<p>在仓库里，当工人们知道：</p>
<p>今天我拣了多少箱 → 当天就能算出钱；</p>
<p>出错了 → 团队一起承担；</p>
<p>他们的身份感就不同了。</p>
<p>Pride in ownership（主人翁的骄傲），是最强的动力。</p>
<ol start="3">
<li>原有问题：效率低、流失高、没有责任</li>
</ol>
<p>在 C&amp;S 推行改革前，仓库充满问题：</p>
<p>员工超负荷，疲惫，事故频发。</p>
<p>拣货通道堵塞，托盘乱放，压力大。</p>
<p>流失率极高，一年换掉大半人。</p>
<p>没有责任归属 → 动力低，工作像例行公事。</p>
<p>这和很多企业的痛点很像：忙、乱、出错，最后大家都不开心。</p>
<ol start="4">
<li>自我管理团队：优点与风险</li>
</ol>
<p>优点：</p>
<p>员工有主人翁精神，更愿意优化流程。</p>
<p>KPI 与激励挂钩，目标清晰（比如9,000箱/班）。</p>
<p>“从头到尾”负责一单 → 质量明显提升。</p>
<p>反馈机制快 → 每天知道自己赚了多少。</p>
<p>课堂里的小故事：</p>
<p>1992年，美国一个小镇上，三个17岁少年是全镇最高效的装卸工。他们原本需要4小时才能干完的活，在父亲设计了<strong>“每人14美元装卸一车西瓜”</strong>的激励后，几个孩子只用2小时完成。</p>
<p>激励和责任，真的能把人的潜力逼出来。</p>
<p>风险：</p>
<p>并不是每个人都适合团队自治。</p>
<p>开始容易，维持难，领导层需要不断“加油打气”。</p>
<p>团队里需要合适的人：有拼劲，但不是争功抢名的人。</p>
<p>新人培训也要算进团队成本，否则会影响产出。</p>
<ol start="5">
<li>组织变革的关键要点</li>
</ol>
<p>上层定方向，执行交给一线：Planning top-down，Execution bottom-up。</p>
<p>快速反馈：每天都有数字反馈，让员工感受到因果。</p>
<p>文化 + 薪酬双轮驱动：没有文化支撑，再好的激励也会变形。</p>
<p>吸引合适的人：找到有合适 ego 的人——想赢，但不是只想要 credit。</p>
<p>带动关键意见领袖（Influencers）：组织变革要先争取这些人。</p>
<p>每个人都渴望骄傲：如果他们在你这里找不到骄傲感，就会去别的地方找。</p>
<ol start="6">
<li>我的感悟</li>
</ol>
<p>老师提醒我们要小心对“人性”的假设。员工的表现，并不完全是“人的天性”，而是组织环境塑造出来的。</p>
<p>很多时候员工“不积极”，不是因为他们懒，而是因为组织没有给他们空间。</p>
<p>如果设计出对的机制，人的潜能远远超出我们想象。</p>
<p>这堂课让我想到一句话：</p>
<p>“每个人都想为某件事骄傲。如果公司不给机会，他们就会在别处寻找。”</p>
<p>自我管理团队的本质，不只是仓库里的一个试验，而是一种管理哲学：</p>
<p>给员工空间</p>
<p>建立责任</p>
<p>用反馈驱动</p>
<p>用文化和激励双轮推进</p>
<p>这不只是适用于拣货工人，也适用于我们的创业团队。</p></div></template>
<script>

function wxConvert(root, heroSrc, date, url){
  var C='#333333', B='#385EA1';
  var P='margin:0 0 22px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var H2='margin:44px 0 18px 0;font-size:20px;line-height:1.5;letter-spacing:1px;font-weight:700;color:'+B+';';
  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

  var src=document.getElementById('src').content, box=document.getElementById('light'), btn=document.getElementById('copy');
  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
