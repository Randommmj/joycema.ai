<div class="phone"><div class="wxhead"><h1>云南和大山里的人们</h1><p>Joyce Ma<span>2022-08-10</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>如何在三天之内爱上一个曾经来过的地方？—— 与一个真正热爱这片土地的人同行。</p>
<p>云南这个地方来过很多次，在我心目中，这里有海拔三千的玉龙雪山、有香格里拉的布达拉宫、有略商业化过度的古城们、有丽江小倩的歌声、有腾冲的温泉、有苍山洱海旁文艺的民宿。</p>
<p>以前的云南很美，但不是精神的故乡，更像是精神的远方。</p>
<p>但是过去一周的云南，是不一样的。我在这里看到听到很多故事，让中国西南角这个边境的省份，一个拥有中国将近一半少数民族的异乡，与我的灵魂产生了共鸣。在这里我去石屏的博物馆看中华文明的延续、在崇山峻岭的土路上看着车子带起的烟土扬起、听边境走私贩毒的故事、听一个大山里面走出的男人从流血打架艰难生存到成为茶痴、看老人淳朴真诚的问候。这里仍然四季如春，但它不再只有鲜花，它还有那些穷苦的、淳朴的、血腥的、浪漫的、野蛮的、原生的、悠长的、轻快的故事们。</p>
<p>石屏县</p>
<p>从昆明出发，向南开两小时，进入红河哈尼族彝族自治州，距离首府蒙自一百多公里的地方有个县城叫石屏，是我们进山看望孤寡老人们之前的落脚点。</p>
<p>这是个有点神奇的县城，3042平方公里的面积中95%是山区，建筑却很有南方徽派建筑特色。</p>
<p>（这不是文化建筑，就是村里保留完好的建筑）</p>
<p>（小小的镇子里，有魁梧的城楼、相当规模的孔庙和许多书院。）</p>
<p>这里的明清建筑保留得如此集中和完整，让我恍惚，这怎么是滇南的边陲小镇呢？后来听说明清两代石屏出过638个举人、77个进士、15个翰林和云南唯一的状元袁嘉谷，故有“五步三进士，对门两翰林”之说。甚至现在石屏的学校在省内仍然排名靠前，与它的地理位置和经济地位及不匹配。当地的朋友告诉我，他很惊奇，其他地方的孩子在小升初的时候，竟然是不考毛笔字的。在当地，所有学子都要练习毛笔字，这个传统至今仍保留着。</p>
<p>大山里的老人们</p>
<p>从石屏县出发，开车4个多小时，进到连绵不绝的大山里，不知不觉已不见柏油马路。前后碾过的地方尘土飞扬，左右是原始的山壁悬崖和一望无际的山山相连。这里的村子人口已经很少了，少则四五户，最多也就十几户。从一个村到另一个村，是从一个山头儿到另一个山头儿，仿佛能看到对面的炊烟袅袅，但驾车却要四五个小时。</p>
<p>有个村子的名字很可爱，叫弥勒村。这里住着一位姓徐大叔（思前想后，公众号属于公域，就不放任何人的照片了），他三岁时失去了双眼，四十多岁时在一场矿难中失去了他唯一儿子，随后又失去了自己的伴侣……所以现在78岁的他独居着。可是他有着很灿烂的笑容和一项“特异功能”——他一摸就能知道纸钞的面额，你绝对无法用50元当100元蒙混过关。他自己洗衣做饭收拾屋子，屋后还养了一头猪。</p>
<p>（去的时候，厨房里生着火，煮着一大锅的菜，那是徐大叔为猪准备的吃食。）</p>
<p>徐大叔甚至自学了二胡，他说，想起自己的老婆孩子还是会苦闷，这时候就拉一首悲伤的曲子排解一下……他还说：“你们很好，你们都学了习主席的思想。”</p>
<p>还一个村子叫仁寿村（这里的村名都好洋气，例如沙咀村，很Hongkong），住着一位从小失去双腿的老人王大叔，他住在垃圾堆一样的帐篷里，垃圾堆里竟然有些宝贝。</p>
<p>（王大叔的画作1）</p>
<p>（王大叔的画作2）</p>
<p>照顾老人家的亲戚说，老人平时什么都不干，不与人交流，也没出过村子，就是在破纸壳上画画，没有人能看得懂他在画什么。在我看来，这些画很有art deco的风格，而且还带着点儿神秘。</p>
<p>在大山里，我学会了一句本地话“不xiao了不xiao了”，大概意思是“不用了、别客气”。这句话真的很有用，因为这里你遇到的每个老人都会热情的邀请你留在家里吃饭，无论是早上8点还是下午3点😂。还有一个老人非要抓家里的鸡给我们带走，尽管他家徒四壁、失去了大部分的视力、是个接受资助的老人，而那几只鸡可能是他为数不多的资产。</p>
<p>令人惊叹的高大哥</p>
<p>我们对老人的资助没有借助慈善组织，而是通过一位当地的朋友，且叫他高大哥。高大哥是石屏本地人，当初是他通过身边的朋友介绍帮我们一点点找到需要帮助的老人们，然后每年两次开车进山为老人们送去资金和生活物资。要把所有的老人们都走一遍，需要四五天的时间，每天早上7点出发晚上12点到家。</p>
<p>高大哥是个皮肤黝黑的大汉，但他也是个长途开车要听《易经》的茶痴，还是个出口成金句的哲学家。</p>
<p>看望老人那几天网上正在疯传“二舅治愈了我的精神内耗”，看到徐大叔和许许多多老人们的乐观，我感慨这是现实版的三舅们，生活将这些老人们抛到谷底，可他们仍然乐观生活。高大哥沉默地听着我的感慨，轻轻地说了一句“这是他们唯一的活法”。——这句话让我感到很深的羞愧，也一下子击穿了我幼稚的悲春伤秋。</p>
<p>看到王大叔的画作，他会说：“没有疯子不疯子，只有理解不理解。”</p>
<p>谈起那些已经去世的老人们，高大哥说每次他都会开几小时的车去给老人们送丧葬费，我说你转账给村里其他的人呀，就不用那么辛苦。他说，除了要确保钱被好好的使用了，他也想去为那些无儿无女的老人们磕几个头。他说：“当你看过了很多生死，就会更珍惜遇到的人们，更尊重生命。”</p>
<p>一路上他会谈起自己的外公，当年走茶马古道一趟要带18双鞋子，他说今天子孙后代的生活都是他们这样走出来的，为红河州开辟了那么多城市和矿。</p>
<p>通过他讲的那些故事，我明白了是什么让他愿意花时间、花精力地帮助我们去资助老人们。他说，刚进入社会时，妈妈告诉他“路边看到香蕉皮要捡起来，因为你不摔倒不代表别人不会摔倒”。他说，小时候看着家里长辈如何做事——那时他们住在山脚下，是所有村民上山砍柴的必经之路，因此很多人会坐在他家门口的石墩上歇脚，外婆就会吩咐舅舅把石墩旁的水缸挑满水，让大家能喝上一口水。他说，他不想辜负先辈的精神。</p>
<p>他说疫情结束后，一定要带自己三年级的儿子多去看看世界，可当我问到他最喜欢的城市是哪里，他还是选择了家乡。说起他现在所住的普洱，他说：“那里的人们皮肤虽然很黑但都很干净，笑容很治愈，人心很淳朴，没有勾心斗角。与他们喝酒，没有人会劝酒，但你就想沉醉在那一刻。”</p>
<p>看着有如此多生命觉知、对他人有那么多爱和感恩的高大哥，我很难想象他小学时不太有鞋子穿，初二就辍学，是个曾经为了生存每周要因为打架进出派出所三四次的人。生活在他身上一定曾经划出过许多伤痕，可此时此刻他却以如此平和、温润的样子存在着。比尔盖茨、洛克菲勒这些在人类公益慈善历史上留下不朽声名的人们固然值得学习和钦佩，但是就像蚂蚁能扛起比自己重5000倍的物品，与高大哥的相遇让我看到了在世界无数角落中，那些财富并不丰盛，却已经在不断给予的人们。</p>
<p>回到城市一周了，还常常想起彩云之南，那里透彻的蓝天、那些人、那些故事。这些故事像血液流入心脏，在我心灵的某个角落筑起一个山寨，带着云南大山里浪漫又原始的气质，改变了我对那片土地那群人的情感，也顺便改变了我的心灵一丢丢。</p></div></template>

function wxConvert(root, heroSrc, date, url){

  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){

          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
