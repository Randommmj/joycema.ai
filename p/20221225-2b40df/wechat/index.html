<div class="phone"><div class="wxhead"><h1>外婆感染新冠的应对措施（2）</h1><p>Joyce Ma<span>2022-12-25</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>感谢持续关心的朋友们，你们太暖了。汇报一下，请大家别担心：外婆现在体征平稳，血压138/83，心跳88，血氧94%，体温37.0，有食欲，吃了白粥，在安睡。</p>
<p>我们都有信心她能平安度过。🙏🙏🙏</p>
<p>今天的进展：</p>
<p>上午医生会诊后决定服用的是「默沙东的莫匹拉韦Molnupiravir」。‍‍‍‍‍</p>
<p>今天血氧一度低至88%，吸氧之后回到94%，最高回到99%。</p>
<p>当时有几个选择：救护车、私立医院急诊、公立医院住院。 最后，因为自身和香港医疗政策的原因，没有住院，也没有拍到肺部CT（详情见下文）。</p>
<p>现在的措施是：居家监测与护理、做好急救预案。</p>
<p>‍</p>
<p>‍</p>
<p>为了方便大家使用，我把每天收集到、自觉有用的信息整理在一起，更新的内容用蓝色表达，希望对大家有用。再次强调，它们都是针对外婆86岁高龄、有二十年高血压的个体情况的，不代表医学意见，只是朋友们经验的分享。如要采用，请务必咨询医生和专业人士。以下：</p>
<p>一、综合篇</p>
<p>外婆是外出打流感疫苗时感染的，所以第一要务还是避免感染，尽量减少外出。</p>
<p>战略上藐视敌人，战术上重视敌人：要比平常更重视监测老人的体征，但也不要慌张。保持镇定，给老人轻松的环境，减少焦虑紧张情绪，平和的心态有助于病情恢复。</p>
<p>体弱的老人可能根本不发烧。发烧是人体的免疫功能反应，是生命的自我保护机制。当一个人身体状况极差的时候，也许练这个报警信号都没了。所以很多离世老人的情况都很类似：血压不高、体温正常、没有发烧。</p>
<p>慎重就医：去医院很折腾，也会增加老人暴露在病毒中的风险，非必要可以不用去医院； </p>
<p>做好预案：如果要去医院，去哪里？是否叫救护车？多久能到？去了能马上就医吗？有呼吸机和人工肺吗？</p>
<p>鼓励老人，TA的心态、信心、求生意志都很重要。我们统一口径是：外婆的生命体征很好，达不到住院标准，所以医院才不接收的。（而不是住不上院😢）。据说，求生意志对身体状况影响很大。老人太过紧张，也对康复有碍。</p>
<p>一定要备「家用制氧机」和「便携氧气瓶」！一定要备家用制氧机和便携氧气瓶！一定要备家用制氧机和便携氧气瓶！自行去医院的路上，家用制氧机是用不上的，便携氧气瓶是能用上的。</p>
<p>‍</p>
<p>二、用药篇</p>
<p>扑热息痛（复方对乙酰氨基酚）：和高血压药可能更不冲突。‍</p>
<p>布洛芬类：对高血压的可能有影响。</p>
<p>慎用莲花清瘟：副作用大，若一定要吃，老年人和小孩子要减半。</p>
<p>慎用止咳药：有些止咳药升血压或诱发心绞痛，一定要认真阅读说明书，有麻黄碱类成分的慎用。</p>
<p>如果有痰粘稠不易咳出，可以考虑使用木舒坦（氨溴索）。</p>
<p>基础病的药量或要调整：在发烧时，如果喝水多、排尿多， 血压可能变低，血压药或要适量减少，以免血压过低造成伤害或误诊。</p>
<p>新冠特效药Paxlovid能否使用？</p>
<p>很重要的一条——但实话讲，我不知道。</p>
<p>‍已知的信息是：</p>
<p>60岁以上的老年人可以用，但是！有许多限制。</p>
<p>特殊人群，尤其是肾损伤患者慎用。</p>
<p>有很多基础病的药物是有冲突的。例如我外婆降胆固醇的药物。但是，抗病毒如果是重点，可以停药服用Paxlovid。这件事情要在医生的指导下完成，我们没有实践经验。明天预约了医生会诊，随后更新。</p>
<p>在医生的指导下，我们使用了「默沙东的莫匹拉韦Molnupiravir」。</p>
<p>‍注意事项是：一个疗程要吃满五天。因为它是防病毒复制，有时症状不明显，但病毒还在复制，所以说吃完是最好的选择。据说，他们做临床的时候，跟安慰剂比较，它毒性不会超过安慰剂。</p>
<p>点击查看：Molnupiravir药品说明书 以及 上海市药学会的介绍</p>
<p>‍</p>
<p>找到一个很好的工具：用来检测新冠用药与其他用药是否冲突的CHECKER，可以在服药之前自行检查。‍‍</p>
<p>网址：https://www.covid19-druginteractions.org/checker</p>
<p>三、监测篇</p>
<p>要监测体温、脉搏、血氧、血压，综合评估身体状况，不要不要不要只看一个指标。</p>
<p>阳性第二天是病情比较重的，一定要更密集地监测。每1-2小时要评估体温、脉搏、血氧和血压。夹指头的血氧仪可以一直佩戴。‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍</p>
<p>血氧：很重要的指标，持续下降在93%以内，须要就医。</p>
<p>心跳：不发烧时，心率老年人在80跳/分；体温增长1度，脉搏增长10跳/分；如不发烧且心率超过90跳/分，考虑用点利尿药。</p>
<p>体温：老年人平时体温可能只有36度，所以37度已经算升高了。心跳在88跳/分是在可接受的范围内。</p>
<p>肺部CT是个重要指标。病毒性肺炎刚刚肺实变时，听诊器有时听不到阳性体征，只有到出现水泡音时才能听到，可能已经晚了。因此，老人身体、医疗条件允许时，做一下可以排除很多不确定因素。‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍</p>
<p>血压：持续监测与平日进行对比。</p>
<p>要观测出入水量，即排尿量与摄入水分的量。</p>
<p>这里有个反常识的新知识：老年人不要喝太大量的水。</p>
<p>适当喝、热一点的水，能出汗就行。 喝水多了，没及时排出来，会增加心脏负担、增加肺的血容量、增加肺的负担。</p>
<p>要观察老人的精神状态、吃饭量。不仅是生命体征，如果老人吃得很少或者持续不清醒，也要警惕！</p>
<p>‍</p>
<p>四、护理篇</p>
<p>喝水：喝温热的水，但要少量多次。再次强调，要关注出入水量。喝粥、喝水、吃药的入水量都要算；排尿、出汗的出水量也都要算。‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍</p>
<p>吃饭：少量多餐；要有点营养，提供足够的抵抗力，但警惕增痰的食物；如果出汗多，饭菜口味可以多一点点盐，因为出汗会丢盐，但是前提是一定是出汗了，否则盐多了增加心脏负担。‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍</p>
<p>家用制氧机的强度要控制得当。需要让血氧在95%以上，太低了氧流量不够，太高了老人会不舒服。我们使用的Vision Aire 5第二格能达到27%的浓度，但每台机器不同，请自行斟酌。</p>
<p>有湿化瓶的制氧机，勤换蒸馏水，保持干净。如果可以，让水温在37度左右，这个小tips可以让氧气雾化，使呼吸道不干燥，更舒服。37度和手温差不多。</p>
<p>老人的配合很重要。要告诉她，吃饭、喝温水、吸氧、吃药，这四项是同等重要的治疗。‍‍‍‍‍</p>
<p>‍‍</p>
<p>五、须要送医的症状</p>
<p>胸痛、胸闷、气短、心绞痛‍</p>
<p>脉搏增加‍</p>
<p>血氧持续下降在93%以内‍</p>
<p>呼吸频率大于30次/分‍</p>
<p>服用退烧药后仍超过38.5度，持续2天‍</p>
<p>体温35度以下</p>
<p>胸部感到持续疼痛或持续压迫感</p>
<p>头晕、无法醒来或保持清醒</p>
<p>皮肤、嘴唇或指甲苍白、灰色或发青</p>
<p>虚弱或脚步不稳</p>
<p>抽搐</p>
<p>持续不能饮食，或腹泻、呕吐超过2天</p>
<p>原有基础疾病明显加重</p>
<p>六、求医篇</p>
<p>香港的「私立医院」不收治阳性病人入院。现在香港的医疗政策是：所有的新冠阳性都去公立，即使病人已经入住私立医院，但不幸感染新冠也要用救护车拉到公立医院去住院。  偶有几家私人医院的急诊可以收治阳性病人，但不会接受入院，之后会用救护车送到公立医院。</p>
<p>按照香港卫生总署发布的「私家医院为2019冠状病毒病检测呈阳性人士提供的医疗服务」清单上，逐个打电话过去问，截止2022年12月25日，明确可以接受阳性急诊的医院是：</p>
<p>‍香港仁安医院 +85226083388</p>
<p>‍香港港安医院-荃湾 +85222756688</p>
<p>「养和医院」是我能找到的唯一一家能够接受阳性病人住院的私立医院，但是一床难求，各种渠道，就是不行。</p>
<p>有些私人医院不给阳性病人拍肺部CT。因为是阳性病人，养和医院没有给外婆拍肺部CT，所以如果不是急诊，去私人医院之前，一定打电话问清楚。</p>
<p>遇到紧急情况，叫救护车是最有效的方法。因为救护车上是有设备的，所以流程和预案一定要了解清楚，打什么电话，怎么做，最近的公立急诊室在哪里。</p>
<p>‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍‍</p>
<p>以下附上更多信息：‍</p>
<p>今天12月25日圣诞节，刚好是外婆的生日。‍‍</p>

function wxConvert(root, heroSrc, date, url){

  var H2='margin:44px 0 18px 0;font-size:20px;line-height:1.5;letter-spacing:1px;font-weight:700;color:'+B+';';
  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }

  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';

    });

  }
  function blocks(root, ps){

      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }

      var t=c.tagName, imgs=c.querySelectorAll('img');

      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';

        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'

    } else done(viaSelection());
  });
})();
</script>
