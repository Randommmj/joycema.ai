<div class="phone"><div class="wxhead"><h1>伯克希尔哈撒韦 致股东信 —— 安静的巴菲特</h1><p>Joyce Ma<span>2025-11-11</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>一封有点特别的信</p>
<p>“安静的巴菲特”</p>
<p>2025年11月10日，95岁的沃伦·巴菲特在奥马哈发布了这份特别的信。</p>
<p>这封信不同于以往的年度股东信——它更像是一封告别信、一封感恩信，也是一封写给时间与生命的书信。</p>
<p>他宣布将不再亲笔撰写伯克希尔·哈撒韦的年度报告，也不再在股东大会上滔滔不绝，而是以英国式的幽默说道：“我将‘安静下来’——某种程度上。”</p>
<p>在信中，巴菲特回望了自己九十五年的人生：从1938年那场差点夺走性命的阑尾炎，到与查理·芒格的六十四年知交；从奥马哈小镇的童年故事，到财富、家族、命运与善意的终极反思。</p>
<p>这是一位世纪老人给所有“股东”的最后一次长谈。</p>
<p>但他谈的不仅是金钱，而是人生的分配方式——</p>
<p>他谈时间、爱与幸运的再分配。</p>
<p>他谈运气、命运、衰老、继承、善意与选择英雄的勇气。</p>
<p>这封信既是一个世纪投资者的回望，也是一个时代的告别。在这份看似私人的书信里，我们看到的，不只是巴菲特的人生，也是资本与人性和解的艺术。</p>
<p>Arcus42选择全文发布这封信——不是为了致敬财富，而是为了致敬那种在漫长时间里保持清醒、节制、和幽默的智慧。</p>
<p>以下是</p>
<p>原文的翻译稿，enjoy：</p>
<p>伯克希尔·哈撒韦公司</p>
<p>新闻稿</p>
<p>即时发布</p>
<p>2025年11月10日</p>
<p>内布拉斯加州奥马哈（BRK.A；BRK.B）</p>
<p>今天，沃伦·E·巴菲特将1,800股A类股票转换为2,700,000股B类股票，以便将这些B股捐赠给四家家族基金会：</p>
<p>向苏珊·汤普森·巴菲特基金会（The Susan Thompson Buffett Foundation）捐赠1,500,000股；</p>
<p>向舍伍德基金会（The Sherwood Foundation）、霍华德·G·巴菲特基金会（The Howard G. Buffett Foundation）和NoVo基金会各捐赠400,000股。</p>
<p>这些捐赠已于今日交付完成。</p>
<p>巴菲特先生致股东的信：</p>
<p>致我的股东们：</p>
<p>从今年起，我将不再撰写伯克希尔的年度报告，也不会在股东大会上滔滔不绝。正如英国人所说，我要“安静下来”了。</p>
<p>——当然，只是“某种程度上的安静”。</p>
<p>在今年年底，格雷格·阿贝尔（Greg Abel）将接任公司的掌舵人。他是一位杰出的管理者、勤奋的工作者、真诚的沟通者。请祝愿他任期长久。</p>
<p>我仍会通过每年的“感恩节信”与大家以及我的子女们谈论伯克希尔。伯克希尔的个人股东是一群非常特别的人，他们慷慨地与他人分享自己的收益。我喜欢这种保持联系的机会。请容我今年先稍作回忆，然后再谈谈我的股份分配计划，最后，我会分享一些关于事业与人生的思考。</p>
<p>一、回忆</p>
<p>随着感恩节临近，我对自己能在95岁高龄仍然健在感到惊讶与感恩。年轻时，这可不是一个看起来会赢的赌注。事实上，我差点早早离世。</p>
<p>那是1938年，当时奥马哈的医院被自然地分为“天主教医院”和“新教医院”，这是当地人司空见惯的分类。</p>
<p>我们家的医生哈利·霍兹（Harley Hotz）是一位亲切的天主教徒，总是拎着黑色医药包上门出诊。他叫我“小船长（Skipper）”，每次收费都不高。</p>
<p>那一年，我得了严重的腹痛。霍兹医生上门检查后告诉我：“明早就会好了。”他回家吃了晚饭，打了会桥牌。</p>
<p>可他总觉得哪里不对，半夜时决定把我送到圣凯瑟琳医院（St. Catherine’s Hospital）做急诊阑尾手术。接下来的三周，我住在修女环绕的病房里，倒也很快适应，还挺享受当个“小讲台上的人”。我喜欢讲话——没错，那时就喜欢——修女们也乐意听我说。</p>
<p>更令我兴奋的是，我三年级的老师玛德森小姐让班上三十个同学每人写一封信给我。我大概把男孩的信都扔了，但女孩们的信我反复读。住院竟也有收获。</p>
<p>在康复的过程中——其实第一周相当危险——最让我高兴的是我姑妈艾迪送我的礼物：一套专业的指纹采集工具。我马上给所有护理我的修女都采了指纹。（我大概是她们见到的第一个新教徒小孩，她们也不知道该期待什么。）</p>
<p>我那时有个荒唐的理论：总有一天某个修女会误入歧途，而FBI会发现他们竟然从未给修女采过指纹。上世纪30年代的美国人崇拜FBI和胡佛局长（J. Edgar Hoover），我幻想他会亲自来奥马哈，检视我这份“珍贵档案”，然后我们一起破案，名扬全国。</p>
<p>当然，幻想从未成真。讽刺的是，若干年后，事实证明我该采集的是胡佛本人的指纹——他最终因滥用职权而声名狼藉。</p>
<p>那就是1930年代的奥马哈。那时我和伙伴们梦寐以求的宝物是：雪橇、自行车、棒球手套和电动火车。</p>
<p>现在让我们看看那一代在奥马哈成长、却当时我并不认识、但后来深刻影响了我的几位人物。</p>
<p>我先从查理·芒格说起——我的挚友，至今六十四年。</p>
<p>上世纪30年代，查理就住在我1958年购入、至今仍居住的那栋房子一个街区之外。</p>
<p>我们差点早早成为朋友，只差一点。1940年夏天，查理在我祖父的杂货店打工，每天工作10小时赚2美元（节俭是巴菲特家族的传统）。一年后，我也在那里干过类似的活儿，但我们直到1959年才相遇——那年他35岁，我28岁。</p>
<p>查理二战服役后从哈佛法学院毕业，定居加州。但他常说自己在奥马哈的早年经历最具塑造性。六十多年来，他对我影响深远，是最好的导师与兄长。我们有分歧，但从未争吵过。他的字典里没有“我早就告诉你了”这句话。</p>
<p>1958年，我买下了人生第一套、也是唯一一套房子。自然是在奥马哈，距离我成长的地方约两英里，离岳父母家不到两个街区，离巴菲特杂货店六个街区，离我已工作64年的办公室开车仅六七分钟。</p>
<p>再说另一位奥马哈人——斯坦·利普西（Stan Lipsey）。1968年，他将《奥马哈太阳报》卖给伯克希尔。十年后，应我邀请，他搬去了布法罗。那时伯克希尔旗下的《布法罗晚报》正与晨报竞争，并且节节败退。</p>
<p>斯坦最终打造出我们新的周日报，曾让这家原本亏损的报纸在早期几年取得年化100%以上（税前）的收益——对当时的伯克希尔而言，这是一笔极其重要的资金。</p>
<p>斯坦的家离我家仅五个街区。他的邻居之一是沃尔特·斯科特（Walter Scott Jr.）。你们或许记得，他在1999年将中美能源公司（MidAmerican Energy）带入伯克希尔，并一直担任董事直到2021年去世。他是内布拉斯加的慈善领袖，奥马哈与全州都留下了他的印记。</p>
<p>沃尔特就读本森高中（Benson High School），我本来也该在那里上学——直到1942年我父亲意外击败连任四届的国会议员。当时的生活，充满惊喜。</p>
<p>还有呢。</p>
<p>1959年，唐·基奥（Don Keough）一家住在我家对面，距芒格家旧址不过百米。那时他是一名咖啡推销员，却注定成为可口可乐的总裁，也是伯克希尔的忠实董事。</p>
<p>初识时，他年薪1.2万美元，和妻子米奇育有五个孩子，全送进了学费不菲的天主教学校。</p>
<p>我们两家成了好朋友。唐出身于爱荷华西北部农场，毕业于奥马哈的克瑞顿大学（Creighton University）。他早早与奥马哈女孩米奇结婚。加入可口可乐后，他成为全球传奇。</p>
<p>1985年，可口可乐推出了失败的“新可乐”。唐发表著名演讲，向公众道歉并重启“经典可乐”。</p>
<p>当时他解释说，寄给“至高蠢蛋”（Supreme Idiot）的信都会被直接送到他桌上。他那次“撤回演讲”堪称经典，可在YouTube上找到。唐坦率承认：“可口可乐真正属于公众，而不是公司。”此后销量飙升。</p>
<p>在CharlieRose.com上可以看到他精彩的访谈（汤姆·墨菲和凯·格雷厄姆的几期也极佳）。像查理一样，唐始终是个充满热情、友善、纯粹的中西部男孩。</p>
<p>最后是阿吉特·贾因（Ajit Jain）和格雷格·阿贝尔（Greg Abel）——一个来自印度，一个来自加拿大——他们都曾在20世纪末期于奥马哈生活过几年。事实上，90年代时，格雷格住在我家不远的法南街（Farnam Street），当时我们还未相识。</p>
<p>难道奥马哈的水里真的有某种魔力？</p>
<p>我少年时期曾在华盛顿特区生活（那时父亲在国会任职），1954年我在纽约曼哈顿找到一份看似永久的工作。</p>
<p>在那儿，我得到了本·格雷厄姆（Ben Graham）与杰瑞·纽曼（Jerry Newman）的悉心指导，并结识了一生挚友。纽约独具魅力——至今依然如此。</p>
<p>然而仅一年半后，我于1956年返回奥马哈，从此不再漂泊。</p>
<p>此后，我的三个孩子以及部分孙辈都在奥马哈长大。</p>
<p>我的孩子都就读公立学校——与我父亲（1921届）、第一任妻子苏茜（1950届）、查理、斯坦·利普西、布鲁姆金兄弟（他们壮大了内布拉斯加家具商场）、以及国家赔偿公司创始人杰克·林沃特（1923届）同校。</p>
<p>国家赔偿公司于1967年卖给伯克希尔，成为我们庞大保险业务的基石。</p>
<p>美国有许多伟大的公司、学校与医院，各有其独特优势与人才。但我很幸运：结交了终身朋友，遇见了两任妻子，在公立教育中打下良好基础，年轻时结识了许多友善的奥马哈人，还在内布拉斯加国民警卫队里收获广泛友谊。</p>
<p>总之，内布拉斯加是我的家。</p>
<p>回顾一生，我认为伯克希尔和我之所以成功，与我们扎根奥马哈密不可分。美国的地理中心，是个极好的出生地、成家地、创业地。纯属运气，我生来就抽到了一根“荒唐地长的签”。</p>
<p>二、谈年岁</p>
<p>现在让我们谈谈我的高龄。</p>
<p>我的基因并不算帮得上忙——在我之前，家族最长寿的记录是92岁（而且越往上查家谱，这类记录越模糊）。但我很幸运，从霍兹医生开始，到今天为止，我一直被聪明、友善、敬业的奥马哈医生照顾。我的生命至少三次被他们救回，而他们的诊所距离我家都不到几英里。（不过我早已放弃给护士采指纹。到了95岁，你还可以保持一些古怪，但凡事都有界限。）</p>
<p>能活到老年，需要大量好运：每天都得躲开香蕉皮、天灾、醉酒或分心的司机、闪电、你能想到的一切。</p>
<p>但“幸运女神”是多变的——没有比“反复无常与不公”更贴切的形容。许多领袖与富人获得的好运远远超出他们应得的份额，而他们往往不愿承认这一点。那些生而富贵的继承人，一出生就获得终身的财务独立；而另一些人，却在地狱般的环境中挣扎，甚至被身体或心理的疾病剥夺了我视为理所当然的一切。</p>
<p>如果我生在世界上许多其他人口稠密的地方，人生大概率会是悲惨的，而我的姐妹的命运还要更糟。</p>
<p>我1930年出生，健康、聪明、是个白人男性，还生在美国。</p>
<p>哇！谢谢你，幸运女神。</p>
<p>我的两个姐妹同样聪慧、性格更好，但她们面对的机会却截然不同。幸运女神在我一生中频频造访，但到了九十多岁，她也该忙别的去了——幸运总有极限。</p>
<p>相反，“时间之父”（Father Time）对我愈发感兴趣。</p>
<p>而他从未败过——在他的记分板上，每个人最终都标为“胜利”。</p>
<p>当平衡、视力、听力、记忆都开始持续下滑时，你就知道他已在附近。我成“老”得算晚的——衰老的到来时间因人而异——但一旦到来，无法否认。</p>
<p>让我惊讶的是，我总体感觉不错。虽然行动缓慢、阅读困难，但我仍每周在办公室工作五天，与出色的团队共事。偶尔我还能想到有用的主意，或遇到一些否则不会来的机会。</p>
<p>由于伯克希尔的体量与市场状况，这样的点子越来越少——但仍然不为零。</p>
<p>三、财富分配与家族传承</p>
<p>我的超常长寿，带来了不可避免的重要后果——既关乎家庭，也关乎慈善目标的实现。</p>
<p>让我们来谈谈这些。</p>
<p>下一步计划</p>
<p>我的三个孩子都已超过常规退休年龄——他们现在分别是72岁、70岁与67岁。</p>
<p>若指望他们都能像我这样延缓衰老，那是个错误。为了提高他们在继任受托人接手前完成我遗产分配的可能性，我需要加快生前赠与节奏，将更多伯克希尔股票捐入他们各自的基金会。</p>
<p>他们如今在经验与智慧上都处于巅峰，但尚未真正进入老年。这个“蜜月期”不会永远持续。</p>
<p>幸运的是，这个“方向修正”很容易执行。不过还有一件事要考虑：我希望保留相当数量的A类股票，直到伯克希尔股东对格雷格（Greg）产生与查理和我相似的信任感。那一天不会太远。我的孩子和伯克希尔董事们已百分之百支持格雷格。</p>
<p>我的孩子们如今具备了处理巨额财富的成熟度、智慧、活力与本能。他们在我离世后还会活着，若有必要，可以灵活应对未来的税制变化或慈善政策调整。世界在不断变化，他们也必须适应。</p>
<p>“墓中统治”历来效果不佳，我也从没想那么做。</p>
<p>幸运的是，三个孩子都从母亲那里继承了主导基因。</p>
<p>这些年来，我也成了他们更好的榜样——尽管永远比不上他们的母亲。</p>
<p>为防不测，我指定了三位备用受托人，万一孩子早逝或失能，他们可替代履职。备用人选之间无级别差异，也不绑定某个孩子。他们都是优秀且世故的人，没有利益冲突。</p>
<p>我已向孩子们保证，他们不需创造奇迹，也不必惧怕失败或失望。这些都是人生的一部分，我自己就犯过不少错。</p>
<p>他们只需比政府项目或传统慈善的平均水平略胜一筹即可——毕竟那两种财富再分配方式也并不完美。</p>
<p>早年，我曾构想过各种宏大的慈善计划。但这些都不现实。多年来，我也目睹过不少政治投机者、家族继承人、乃至古怪慈善家的失败尝试。</p>
<p>如果我的孩子们能把事情做得“还不错”，那我和他们的母亲就会欣慰。</p>
<p>他们的判断力很好，已多年通过逐步增量的方式练习如何分配资金——从早期的小额到如今每年超5亿美元。</p>
<p>他们都热衷长时间工作，帮助他人——各自以不同方式。</p>
<p>四、关于伯克希尔与管理</p>
<p>我加快赠与节奏，并不意味着我对伯克希尔前景的看法有所改变。</p>
<p>格雷格·阿贝尔完全达到了我当初对他作为继任CEO的高期待。他对公司业务与团队的理解远超我如今所能掌握，而且学习极快，常常能洞察一般CEO根本不会关注的问题。</p>
<p>我想不出有哪位CEO、管理顾问、学者或政府官员，比他更适合管理你我的储蓄。</p>
<p>例如，他比多数资深保险业高管更深刻地理解伯克希尔财产与意外保险业务的潜力与风险。</p>
<p>我希望他能健康长寿。若好运持续，伯克希尔在未来百年只需更换五六位CEO。</p>
<p>我们尤其应避免选择那些一心想65岁退休、炫富、或建立家族王朝的CEO。</p>
<p>现实中，也会遇到令人痛心的情况：</p>
<p>某位忠诚优秀的CEO——无论是集团或子公司负责人——可能罹患痴呆、阿尔茨海默症或其他长期病症。</p>
<p>查理和我都曾遇到过这种情况，却没有及时采取行动。这可能是重大错误。董事会必须保持警惕；CEO也应对下属公司保持警惕。说易行难，但我的建议是——保持敏感，勇于发声。</p>
<p>过去，监管者曾试图通过要求披露“CEO薪酬与普通员工平均薪酬比”来羞辱企业高管。</p>
<p>结果，年报的委托书从20页膨胀到100多页。</p>
<p>但好意没能带来好结果——反而适得其反。</p>
<p>我观察到的大多数情况是：公司A的CEO看了竞争对手B的薪水，暗示自己应更值钱。</p>
<p>他还顺带提高了董事薪酬，并精挑细选薪酬委员会成员。</p>
<p>新规则带来的不是节制，而是攀比。</p>
<p>财富螺旋自行运转。</p>
<p>真正困扰富裕CEO的——他们毕竟也是人——并不是自己赚得少，而是别人赚得更多。</p>
<p>嫉妒与贪婪总是携手而行。</p>
<p>从没见过哪家顾问建议大幅削减CEO或董事薪酬的。</p>
<p>整体而言，伯克希尔的业务组合比平均水平略优，由若干互不相关且极具价值的“宝石”支撑。</p>
<p>不过十年、二十年后，肯定会有许多公司表现超过伯克希尔——规模的代价无法避免。</p>
<p>伯克希尔几乎是我所知最不可能出现灾难性危机的公司。</p>
<p>它的管理层与董事会对股东的意识也比我所了解的绝大多数企业都更强。</p>
<p>此外，伯克希尔将永远以让自身成为美国资产的方式运营，而不会沦为依赖者。</p>
<p>随着时间推移，我们的经理们会变得富有——他们肩负重大责任——但他们无意建立王朝或炫耀财富。</p>
<p>我们的股价将继续波动——在我管理的六十年里，已三次下跌约50%。</p>
<p>不要绝望——美国总会复苏，伯克希尔的股票也会随之回升。</p>
<p>五、最后的思考</p>
<p>容我稍显自恋地说一句：我对人生后半段的感受，比前半段更好。</p>
<p>我的建议是：不要因为过去的错误责备自己——从中学点东西，然后继续前进。</p>
<p>永远不嫌晚去变得更好。找到正确的榜样，并模仿他们。可以从汤姆·墨菲（Tom Murphy）开始——他是最好的。</p>
<p>想想阿尔弗雷德·诺贝尔（Alfred Nobel）。据说，当他兄弟去世时，报纸误刊登了诺贝尔的讣告。读到世人如何评价自己后，他深受震动，从而改变了人生。</p>
<p>别等报社搞混才醒悟——</p>
<p>想想你希望自己讣告里写些什么，然后活出配得上那篇讣告的人生。</p>
<p>伟大并非来自财富、名气或权力。</p>
<p>当你以成千上万种方式帮助他人时，你就在让世界更好。</p>
<p>善意无价，却不需成本。</p>
<p>无论你是否宗教信徒，“黄金法则”（己所不欲，勿施于人）始终是行为的最佳准则。</p>
<p>我写下这些话时，深知自己也曾无数次欠思考、犯过错——但幸运的是，我从许多出色的朋友那里学会了如何更好地做人（虽然离完美还远）。</p>
<p>请永远记得：清洁工与董事长，都是同样的人。</p>
<p>我祝所有读到这封信的人感恩节快乐。</p>
<p>是的，哪怕那些“讨厌鬼”；改变永远不嫌晚。</p>
<p>请感谢美国——它让我们的机会最大化。</p>
<p>但也请记住，它的奖赏分配常常随意，甚至不公。</p>
<p>谨慎选择你的榜样，并努力仿效他们。</p>
<p>你不可能完美，但永远可以更好。</p>

<script>

function wxConvert(root, heroSrc, date, url){
  var C='#333333', B='#385EA1';
  var P='margin:0 0 22px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var H2='margin:44px 0 18px 0;font-size:20px;line-height:1.5;letter-spacing:1px;font-weight:700;color:'+B+';';
  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

(function(){
  var src=document.getElementById('src').content, box=document.getElementById('light'), btn=document.getElementById('copy');
  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
