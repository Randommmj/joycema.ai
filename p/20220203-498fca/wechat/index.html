<div class="phone"><div class="wxhead"><h1>关于《平如美棠》</h1><p>Joyce Ma<span>2022-02-03</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>今早想写写《平如美棠》，在书开头读了柴静作的序。深觉，想让大家了解这本书，我再写不出更感人和真切的内容了。不如干脆搬了序言原文，和大家分享。以下，enjoy：</p>
<p>赤白干净的骨头</p>
<p>《平如美棠》序言</p>
<p>文 | 柴静</p>
<p>我讲的话每句都是真的，</p>
<p>每个故事都是真的。</p>
<p>关于过去，</p>
<p>那些画面都在我脑海中。</p>
<p>饶平如摄于1945年时年24岁</p>
<p>饶平如摄于1945年时年24岁</p>
<p>01</p>
<p>认识美棠那一年，饶平如二十六岁，从黄埔军校毕业，在一百军六十三师一八八团迫击炮连二排，打湘西雪峰山外围战，差点丢了性命。</p>
<p>身边战友被打中肚腹，肠子流了出来，惨叫之声让他“多年无法忘记”。他被枪弹压得趴在山坡上，手紧紧抓着草茎，抬眼看青山之巅，深蓝天上，白云滚滚而过。</p>
<p>“这就是葬身之地了，也好。”他说，“那时候一个人，不怕，不知道怕，男孩子的心是粗的。”</p>
<p>战争结束，1946年夏天，饶平如的父亲来了一封信，希望他借着假期回家订亲。</p>
<p>“父亲即带我前往临川周家岭3号毛思翔伯父家……我们两家是世交。走至第三进厅堂时，我忽见左面正房窗门正开着，有个年约二十面容娇好的女子正在揽镜自照，涂抹口红——这是我第一次看见美棠的印象。”</p>
<p>“觉得美吗？”我问。</p>
<p>“那时觉得是女的都好看的。”老先生老实说。</p>
<p>两个人也没讲什么话，父亲走过去把戒指戴在姑娘指上，人生大事就这么定了。两个青年都觉得好笑，笑之余，去她房间坐，妹妹们绕床玩，美棠拿张报纸卷筒，唱歌，还拿相册给他看。</p>
<p>他觉得她大概是喜欢自己的，从相册中抽了几张带走。</p>
<p>回军营路上，他穿军装站在船头，看滚滚长江上波光，觉得自己的命从此轻慢不得，因为命里多了一个人。</p>
<p>内战开始之后，他不想打，请假回家成婚。</p>
<p>八十岁时，美棠去世，他今年九十岁，画十几本画册，叫做《我俩的故事》。把石榴下的黑白照片重新冲洗，涂一点唇红，底下写“此情可待成追忆，只是当时已惘然”。</p>
<p>一笔一笔，从她童年画起，幼年时如何在课室里羡慕小丫鬟在外打秋千，如何与好朋友卷发旗袍去舞场跳舞……都按她当年所讲画来。</p>
<p>两人婚礼的照片在“WG”中烧了，他靠记忆，把当时的建筑、场景、人都画进去。画的时候并没什么用意，只是觉得全景的角度可以把大家都画进去，一个不少。</p>
<p>看的人不免觉得，这个角度像是对两个人的背影隔了岁月的凝视。</p>
<p>02</p>
<p>婚后时局动荡，饶平如带着美棠，在贵州当雇员，为了躲劫匪，首饰藏在车轮子里头。又在南昌经商，他画下那个年代里的细节，写“开面店生意不佳、上夜校学会计、面试粮食局、投简历给测量队、卖干辣椒搞不清楚秤——美棠嘲笑我根本不像个生意人，我自思也的确如此，至今还未弄明白称盘秤要扣除盘重是怎么一回事”。</p>
<p>居然这一段回忆最快乐，他画年轻人无事打“梭哈”——我根本不知这是什么纸牌法，他兴味地向我解释半天，我也不解。只看他画五人，座次都标得清楚，还像小孩子一样标上每个人的身份“老吴”“定姐”……还有“平如”和“美棠”在板凳上紧靠着，相视而笑。</p>
<p>两夫妇住的房子只是一个亭子加了四面板改成的房间。</p>
<p>“那个时候真的不觉得苦，好玩，为什么？一到那个下雨，狂风大作，那窗噼里啪啦地响，又打雷，风呼呼吹，山雨欲来风满楼，这个诗意，水泥房子领略不到这种山间的野趣。”</p>
<p>“中国人爱说贫贱夫妻百事哀，你为什么觉得有诗意？”</p>
<p>“我想跟那个心境有关系。不管什么时候，什么地域，什么人生，有些诗意的人，他看什么都是有诗意的。”</p>
<p>03</p>
<p>到了1949年，饶平如本来要随众去台湾，又想：“岳父把他女儿嫁给我，是希望总要有个依靠，我要走就不负责任。”就留下来，觉得总有地方容下个寒素的家庭。</p>
<p>1958年，他被劳动教养。没人告诉他原委，也没有手续，直接从单位带走。单位找他妻子：“这个人你要划清界限。”</p>
<p>关口上，美棠说的话透出一股脆利劲儿：“他要是搞什么婚外情，我就马上跟他离婚，但是我现在看他第一不是汉奸卖国贼，第二不是贪污腐败，第三不是偷拿卡要，我知道这个人是怎么一个人，我怎么能跟他离婚。”</p>
<p>饶平如去了安徽一个厂子劳动改造，直到1979年。他每年只能回来一次，二十二年，一直如此。</p>
<p>这二十多年里，夫妻二人，他写回来的信件都没有保留，妻子写的信他大多留着，全贴在画册里。这些信里几乎没有情感的字样，都是艰辛的生活：怎么搞点吃的，怎么让他弄点鸡蛋回来，怎么让孩子参加工作，怎么能够给他们找一个对象……</p>
<p>他依日期贴好，信件有日久残缺的地方，他用笔填补好。</p>
<p>十几本画册沉又大，放在桌上，都不好铺开。我就趴在床上看，一边摘些字句，看到有的地方失笑——美棠是个小暴脾气，信里有时写“我很气你，我很生气，我越写越气”，笔一扔，后边不写了，要过一两个月才又有新的信。</p>
<p>“你看了是什么感觉？”我问饶先生。</p>
<p>“我同情她。</p>
<p>我没想到：“同情？”</p>
<p>“她平时对我很好，她说这样的话了，一定是心里受了很大的刺激。”</p>
<p>他常念及一个女人带几个孩子，工资不够，需要背二十斤一包的水泥挣点钱，从孩子口中省下糖块寄半包给丈夫，他拿手绢包着放枕头下，吃半个月吃完。</p>
<p>她过世后，他现在每经上海自然博物馆，都停一停：“这个台阶里面，我也不知道哪一块是她抬的水泥，但是我知道，她为了孩子，为了生活，她背啊，她的腰、肾脏受损了，恐怕也就是这样引起的。”</p>
<p>04</p>
<p>“你什么也不会做！”——这是美棠一生对他讲得最多的话，“不管做什么，都被说‘你什么都不会做’，比如炒菜炒得不好，抽屉没有关上，给孙女买的书是错误的等等。”他嘻嘻笑。</p>
<p>有时子女也觉得母亲苛刻些，老先生赶紧摆摆手，意思是“人家教育自己老公，跟你们什么相干”。</p>
<p>他说：“她其实一直在埋怨我，一直在笑我。但这个笑当中，不是讥笑，也不是讽刺，就是好像好玩儿：你看你连这个都搞不清楚。”</p>
<p>“有的男人可能会觉得，会不会对自己有点太挑剔，觉得面子上下不来。”</p>
<p>“根本没这个事儿。什么面子？没有。”</p>
<p>这么些年，妻子买菜他都跟着，怕她拎着重。</p>
<p>“我拿着篮子，跟在后边培训培训，她教教，带徒弟，‘这个菜怎么样，那个菜怎么样’。我说：‘你不买你问他干什么？’她说：‘你傻，多问几个地方，心里有数，再去买不是有比较了嘛。’她就嫌我脑子太简单。东挑西挑。”</p>
<p>“一般男人都会说‘我不去了，你去买’吧？”</p>
<p>“我从来不欺骗她。我对她不讲什么谎话。”</p>
<p>05</p>
<p>1992年，美棠肾病加重，饶平如当时还在政协工作，推掉了所有工作，全身心照顾妻子。</p>
<p>从那以后，他都是五点起床，给她梳头、洗脸、烧饭、做腹部透析，每天四次，消毒、口罩、接管、接倒腹水，还要打胰岛素、做记录。他不放心别人帮。</p>
<p>“您心里有烦燥的时候？”</p>
<p>“没有，没有，这个一点没有，这个是我的希望。”</p>
<p>她病痛中渐渐不再配合，不时动手拔身上的管子。耳朵不好，看字也不清楚了，他就画画劝她不要拉管子，但画也不管用，只能晚上不睡，一整夜看着她，毕竟岁数大了，不能每天如此，还是只能绑住她的手。“她叫‘别绑我’，我听到很难过，怎么办……很痛苦。”</p>
<p>美棠犯糊涂越来越严重，有一天称丈夫将自己的孙女藏了起来，不让她见。饶老怎么说她都不信，他已经八十多岁，坐在地上，嚎啕大哭。</p>
<p>她看着他哭，像看不见一样。</p>
<p>他说：“唉，不得了，恐怕是不行了。像杨绛写的这句话，‘我们一生坎坷，到了暮年才有一个安定的居所，但是老病相催，我们已经到了生命的尽头。’”</p>
<p>饶先生的孙女说奶奶那以后很少清醒：“所有人都只当她是说胡话的时候，只有老爷爷还一直拿她的话当真。她从来就是挑剔品质的人，她要什么，老爷爷还是会骑车很远去买哪个字号的糕点哪个店铺的熟食。等他买了回来她早就忘记自己说的什么，也不会再要吃了。劝不听，奶奶说她那件并不存在的黑底子红花的衣裳到哪里去了，老爷爷会荒谬地说要去找裁缝做一件。”</p>
<p>我问饶先生：“小辈的人劝你，说这个没有任何意义了？”</p>
<p>“不这样做，我心就不安，理就不得，就这么一句话，明知其不可而为之。做了，我心里没有什么愧疚，不做，倒是一个永远的谴责，那一辈子，就不会好过的，拷问自己，人生当中，你可以做的事情为什么不去做。”</p>
<p>我听到这儿，有所触动，心里一塌，几乎失去再继续问下去的勇气。</p>
<p>06</p>
<p>“2008年3月19号下午，她去世，4：23分，我一进去，远远地看见她睡床上，她已经……她的生命已经没有力量了，已经耗尽了，她理智还有一点。她看见我了，流了一滴泪，只有这一点力气，看见我了，但是她讲不出，她不能动，她的生命就是这么一点点。”</p>
<p>“您当时说什么了吗？”</p>
<p>“没有说什么，她已经不能讲话，我摸摸她的手，还有一点点温。后来我意识到真的是冰凉了，我就拿剪刀把她一缕头发剪下来，用红丝线扎一扎，放在家里……这是她唯一剩下的东西，那就作个纪念。一个戒指，很小的戒指，她平常戴的。我平常不戴，我今天戴着来了。”</p>
<p>他小指上细细一圈金戒指。当年父亲赠给新人的那个，家境后来贫寒，她已经变卖了，晚年他买了另一只送妻子。</p>
<p>采访的灯，罩了层柔光纸，打在老先生脸上。老人穿白衬衣，外面是深色格子外衣。白发细密如缕，戒指一点微微的金光，四周都是黑暗。</p>
<p>07</p>
<p>采访中有段话，没有编辑进片子，我一直记得。</p>
<p>饶先生说，上个月有天在院中看到二十公分长一个黑的东西，是有人丢的骨头，几百只蚂蚁围住啃。他说：</p>
<p>“像我从前，扫掉倒了算了，这次觉得，我的力量比它大，我要扫就扫，不扫就不扫，它对我也没妨碍，何必？我不去动它，我进屋，不动它。”</p>
<p>我当时听，不知道他要说什么。</p>
<p>“第二天，我再到院子一看，这个骨头变成白色的了。原来蚂蚁把它外面的这些肉隙都吃得干干净净，就剩下骨头，蚂蚁也没有了，这个是我想不到的。”</p>
<p>我问他：“这给你一个什么印象？”</p>
<p>“它是生命，我也是生命。为什么我有能力，我有权，我要它死？我一踩，它就死了，但又何必呢？它对我没有影响。它也是生命，它也要生活。”</p>
<p>这个采访已经过去了几个月，我记得这些话，但没细想过，有天看书看到黄永玉说，“美比好看好，但好，比美好”。</p>
<p>我看到这儿，想起那根赤白干净的骨头，这就是好。</p>
<p>08</p>
<p>前阵子，编导王瑾（外号“蚂蚁”）拿来一封信，老先生给摄像、编导每人画了一张肖像，还注明，“给小王的裤子上画了八个洞，为了时尚起见”。</p>
<p>送我的是这张画：一对男女靠窗对书而坐，上面写“推窗时有蝶飞来”。</p>
<p>这期节目，每个参与的人，蚂蚁、小余、天舒、老范、李伦、邹根涛、沈超、陈曦……对画册都珍视宝爱。蚂蚁把画册从上海运到北京，再运回去。我平时马虎，这次也怕掉了哪怕一个纸片，看完一本本摞好，放在小茶几上。夜半三点一声巨响，小几塌了一半，还好没损失画册。装在大纸箱里封好，挪到楼下，蚂蚁和天舒嘻嘻哈哈把它们抬走了。</p>
<p>这一期不过是寻常巷陌的情理，也没什么传奇可言，就是一个世纪来一对普通男女的生活，我们也明知收视不会太好，但还是要做这一期。老先生的孙女舒舒在信中写过“时代是不一样的了，像他的画册里有一页‘相思始觉海非深’那么严重的句子，可能不是每个人都有幸和有勇气可以引到自己身上的”，策划小余回信说：“换了我，我也会问自己，会不会不遗余力长久做一些无望的事。但我想，因为喜欢，所以情愿。时光可以让一个人面目全非，也让另外一些人愈加清晰。”</p>
<p>我问过饶先生：“这画册中写了很多的内容，你最希望后代能够记住什么？”</p>
<p>“一个人做人要忠厚。忠厚的人总归是可以持久的。”</p>
<p>这二字他践行一生，像一点润如酥的雨，落下无形无迹，远看才草色青青，无际无涯。</p>
<p>读完序又找了柴静的视频和《看见》来重读。 仍会热泪盈眶，我都不知道自己哭什么。 </p>
<p>也许是《看见》向我展示的，记者这份职业中，对生命的追问、对公正的坚持、对他人贯穿始终的悲悯；</p>
<p>也许是对过去的怀念，是离开记者这个岗位后，一直淡淡萦绕在心头的不舍与遗憾。 </p>
<p>愿我常常看见自己的矇昧，永远热泪盈眶。</p></div></template>

  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

(function(){
  var src=document.getElementById('src').content, box=document.getElementById('light'), btn=document.getElementById('copy');
  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
