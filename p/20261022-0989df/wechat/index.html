<div class="phone"><div class="wxhead"><h1>哈佛预习｜全球市场：Equity Group —— 企业能承担多少公共责任</h1><p>Joyce Ma<span>2026-10-22</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><figure class="hero"><img src="/img/4d435e4b5dd8c651.jpg" alt=""></figure><div class="prose"><p>Unit 3，Carrie Elkins 教授 Global Markets，
“A Marshall Plan for Africa”: James Mwangi and Equity Group Holdings。</p>
<p>一家银行从替农民保管少量积蓄开始，最后站到了东非区域发展的讨论桌前。它一路积累的能力，让这个愿望有了依据；愿望扩大的速度，也把责任推到了更远的地方。</p>
<p>以下，enjoy：</p>
<h2 id="案例梗概">案例梗概</h2>
<p><strong>故事最初，是一个藏在香蕉树旁的铁罐。</strong> James Mwangi 的母亲没有银行账户。她把积蓄放在床垫下，觉得不安全时，就装进铁罐埋起来。Mwangi 在肯尼亚农村长大，父亲在独立斗争中去世，母亲独自抚养七个孩子。他卖过柴火和蔬菜，依靠奖学金继续求学，后来成为会计师和银行高管。他很早就知道，收入微薄的人，也在认真安排每一天的钱。</p>
<p>肯尼亚于 1963 年独立。殖民时期形成的土地与就业不平等，并未随独立消失。早期政府支持市场发展，GDP 曾保持较快增长，也投入教育，但人口增长与收入集中，使繁荣没有均匀地抵达家庭。后来，政治与经济环境进一步恶化。案例所引的贫困率，从 1992 年的 45% 上升到 2000 年的 57%。这些历史数字提醒人们，经济制度如何分配机会，会进入很具体的日常生活。</p>
<p>1993 年，Equity Building Society 的创始人 Peter Munga 找到 Mwangi。那时，这家机构已被认定为技术性资不抵债，不良贷款占比 56%，客户约 12,000 人。Mwangi 接受降薪 94%，并再次抵押房屋投入资金。他要解决的，是一家濒危机构怎样为此前不被银行认真对待的人提供服务。</p>
<p>他从储蓄开始。取消最低余额等门槛，改善取款和服务体验，训练员工，也到农村集市教人们理解金融。团队回忆，他们当时的竞争对手是：</p>
<blockquote>
<p>“We were competing with the mattress.”</p>
</blockquote>
<p><strong>银行必须先胜过床垫，才能进入一个家庭的信任。</strong> 小额、高频、收入不稳定，成为产品设计的现实条件。随后，自动化把办理时间从约 30 分钟缩短到 5 分钟；客户先建立储蓄记录，银行再提供信贷。法律负责人 Mary Wangari Wamae 推动牌照与合规工作，Equity 在 2004 年转为商业银行，2006 年上市，2007 年获得 Helios 约 1.787 亿美元投资。</p>
<p>资本让渠道扩张成为可能。代理网点、基础手机银行和数字系统逐步连接起来。Equity 与 Safaricom 经历合作、竞争和再合作，也把经营扩展到周边国家。到 2021 年，集团在六国拥有 1,620 万客户、337 家分行和 61,061 个代理网点。同期集团税前利润约为 518.8 亿肯尼亚先令，服务小客户已经形成了有规模的商业模式。</p>
<p>Equity Group Foundation 则借助同一套网络，实施教育、医疗、创业培训、农业和社会保障项目。案例附表报告了约 4.7 万份奖学金、约 39.2 万家小微企业培训。这些是机构报告的项目产出，仍需与长期生活改善分开判断。疫情中，Mwangi 组织本土生产个人防护用品；这段经历让他进一步相信，企业可以协调更多社会能力。</p>
<p>2022 年，Equity 推出 Africa Recovery and Resilience Plan，并与东非共同体签署合作备忘录。计划把农业与采掘、制造与物流、贸易投资、小微企业、社会与环境、技术六个支柱连接起来，提出 60 亿美元融资框架。案例附表写下了到 2025 年覆盖 1 亿线上客户、500 万借款企业，以及创造 5,000 万个直接和间接岗位的目标。<strong>这些数字是计划承诺，并非已经完成的成绩。</strong></p>
<p>Mwangi 面前的选择，因此比“要不要增长”更复杂：</p>
<ol>
<li>从 1,620 万集团客户走向 1 亿线上客户，渠道扩张能否得到相应的服务与风险管理能力支持？</li>
<li>60 亿美元融资框架之中，谁实际出资，谁承担信用、期限与跨境风险？</li>
<li>5,000 万个岗位如何产生、如何核验，又由谁决定哪些人和哪些行业优先获得机会？</li>
</ol>
<h2 id="我的思考">我的思考</h2>
<h3 id="减贫需要让增长抵达具体的人">减贫，需要让增长抵达具体的人</h3>
<p>上一篇 India 的预习，讨论的是国家的发展能力如何转化为多数人的生活。在 Equity 这里，这个问题进入了一家银行的柜台。</p>
<p>肯尼亚独立后的早期增长并不慢。案例同时指出，在 Kenyatta 执政后期，最穷的 40% 家庭取得约 9% 总收入，最富的 10% 取得近一半。数字放在一起，能看见增长与分配之间的距离。</p>
<p><strong>一个人能否读书、储蓄、经营、应对疾病，决定了他能否参与增长。</strong> 政府奖学金帮助 Mwangi 离开贫困，也说明公共部门曾提供真实的机会。监管开放、公共教育和私人创新之间，需要连接，而不能相互抹去。</p>
<p>阿马蒂亚·森在《以自由看待发展》中，把人的实际选择与行动能力放在发展讨论的中心。对这个案例而言，这个视角很具体：一个家庭能不能在突发支出之外，开始安排稍远一点的未来。</p>
<p>我自己的理解是，减贫政策需要追问增长经过了哪些路径。学校、工作、账户和市场，每一处都可能让机会继续向前，也可能让它停下来。</p>
<h3 id="储蓄让一个家庭慢慢拥有明天">储蓄，让一个家庭慢慢拥有明天</h3>
<p><img alt="" src="/img/20e98c55508a56e2.jpg"></p>
<p>Mwangi 对母亲的理解，进入了 Equity 的服务次序：先让钱有安全、便利的去处，再逐步建立信用关系。</p>
<p>案例描述，客户需要展示六个月的储蓄记录，银行才提供相应贷款。这个过程既让银行积累判断依据，也帮助客户建立一点缓冲。对每天买燃料、每天支付交通费的人，余额很小，资金安排却很精细。</p>
<p><strong>储蓄给家庭留下余地，信贷则需要未来收入来承接。</strong> 两者都可能有价值，顺序和使用条件会改变结果。没有订单、没有稳定生产条件时，一笔贷款也可能只增加下一次必须支付的账单。</p>
<p>这套模式也有自身的边界。连少量结余都做不到的人，可能首先需要社会保障、健康支持或基础服务。金融机构应看见他们的处境，而不能因为不能授信，就把他们从发展讨论中删去。</p>
<p>我自己的倾向是，把能否扩大一个人的选择作为检验标准。铁罐里保存的不多，却可能是一个家庭第一次为明天留出的空间。</p>
<h3 id="同理心进入成本结构才能服务更多人">同理心进入成本结构，才能服务更多人</h3>
<p>理解客户，只是起点。Equity 的故事之所以成立，还因为团队持续改造了服务成本。</p>
<p>办理时间从 30 分钟缩短到 5 分钟，意味着客户少排队，也意味着同一套资源能处理更多交易。代理网点和手机渠道，把许多小额业务带到距离客户更近的地方。高量低利模式需要这些具体动作来支撑。</p>
<p><strong>一家机构的善意，最终要经过流程、人才和资金才能交付。</strong> Warui 参与客户教育，Wamae 推动法律与组织转型，投资者提供资本，监管制度允许新的渠道出现。Mwangi 能够把这些能力聚合起来，是他的领导力中值得学习的部分。</p>
<p>他也没有把一种竞争关系固定下来。Safaricom 可以是伙伴，也可以是对手；客户关系发生冲突时，Equity 寻找其他路径，后来又重新合作。使命提供方向，具体方法仍然接受现实检验。</p>
<p>我自己的理解是，同理心只有进入成本结构，才可能跨过创始人亲自服务的范围，让更多人真正得到同样的待遇。</p>
<h3 id="社会项目的成果需要走到家庭里核验">社会项目的成果，需要走到家庭里核验</h3>
<p>Equity 把教育、医疗和企业培训接进商业网络，这个设计有吸引力。客户有技能、有健康条件、有买家，金融服务才更容易产生价值；商业网络又能帮助社会项目减少重复建设。</p>
<p>但同一个数字，可以承担不同含义。培训了多少企业，是交付记录；企业后来是否存活、利润是否改善、家庭是否减少了危险负债，是另一层结果。</p>
<p><strong>服务覆盖面扩大之后，还要看生活是否变得更稳。</strong> 案例所引的肯尼亚贫困率，在 2009 至 2021 年间下降，但这不能单独证明 Equity 的贡献大小。政府、其他金融机构、移动支付和家庭自身的努力，也在其中。</p>
<p>肯尼亚央行等机构的 2021 FinAccess 调查，将正规金融可得性与银行服务使用率分开统计，分别为成年人中的 83.7% 和 44.1%。这也提醒我们，接入金融服务、使用银行账户和摆脱贫困，需要分别衡量。</p>
<p>我会同时看两组结果：银行的风险与经营是否稳健，客户的经营和生活是否改善。当其中一组很好看，另一组长期沉默时，就需要进一步追问。</p>
<h3 id="公共责任扩大时问责必须一起扩大">公共责任扩大时，问责必须一起扩大</h3>
<p><img alt="" src="/img/ca55f2b4e8f46f62.jpg"></p>
<p>我支持区域计划的方向。农业需要加工，加工需要物流，企业需要订单、技能和资金。把这些条件一起组织起来，有机会解除单笔贷款无法解决的约束。</p>
<p>但我会投票批准一个分阶段版本。1 亿线上客户与 5,000 万个岗位，已经把任务推向跨国协调。现有银行的成功，为新计划提供起点；下一步仍需要验证新的能力。</p>
<p><strong>企业获得更多公共影响力时，也需要接受更明确的公共问责。</strong> 谁决定资源流向，谁能提出异议，谁承担失败的损失，都不能只依赖对一位领导者的信任。</p>
<p>我会从少数有明确买家和可靠伙伴的价值链开始，写清融资期限、币种和损失分担，由专业机构执行具体项目，并让董事会和公共伙伴保留独立审查权。对于公共性服务，也应考虑如何让银行客户之外的人获得机会。</p>
<p>这会牺牲一些速度，增加协调成本，甚至要求放弃部分短期回报。但存款人、借款人和纳税人的承受能力，是计划能够持续的条件。流动性充裕，也不等于有同样充裕的资本来吸收损失。</p>
<p>一座桥延伸得更远，需要更多可靠的支点。Equity 适合做重要的建设者，而公共责任的分担，需要从第一段就设计进去。</p>
<h2 id="对-arcus42-的借鉴">对 Arcus42 的借鉴</h2>
<p>这个案例带来的，是几条关于服务与信任的方法提醒。</p>
<p><strong>第一，先理解客户真正要作出的决定。</strong> Equity 从家庭怎样储蓄和付款出发。对家族服务的启发，是把具体的人、责任与约束放在前面，再讨论需要什么工具。</p>
<p><strong>第二，让技术改善交付，让人承担判断。</strong> 自动化可以减少重复工作、降低服务成本。解释不确定性、理解不同家庭的处境，以及对重要判断负责，仍然需要清晰的人与责任。</p>
<p><strong>第三，协调能力时，把分工写清楚。</strong> 一个复杂问题往往需要多种专业力量。谁提出建议、谁执行、谁核验，应该可以被理解；涉及专业或持牌工作，应由相应合资格专业方承担。</p>
<p><strong>第四，衡量客户是否更有能力行动。</strong> 文档与会议数量不能独自证明价值。约定是否被理解、行动是否完成、问题是否及时显露，更接近服务带来的实际改变。</p>
<p><strong>第五，让信任逐步成为组织的能力。</strong> 理由、承诺与利益冲突需要被记录，也需要有独立复核和表达异议的路径。个人关系建立的信任，可以借助这些日常安排被更长久地保存。</p>
<h2 id="写在课前">写在课前</h2>
<p>课前的我，投给分阶段推进的一票。Equity 已有足够值得信任的起点，也需要为更大的公共影响建立新的约束。</p>
<p><strong>我最认同的是：企业承担多少公共责任，就需要建立相应的问责能力。</strong></p>
<hr>

      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

(function(){
  var src=document.getElementById('src').content, box=document.getElementById('light'), btn=document.getElementById('copy');
  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
