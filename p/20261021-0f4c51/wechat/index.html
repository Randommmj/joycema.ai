<div class="phone"><div class="wxhead"><h1>哈佛预习｜领导力：Lisa Su and AMD —— 危机中的聚焦与兑现</h1><p>Joyce Ma<span>2026-10-21</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><figure class="hero"><img src="/img/d2be70b50dbe54a8.jpg" alt=""></figure><div class="prose"><p>Unit 3，Leadership，
Lisa Su and AMD。</p>
<p>一家曾经做出优秀产品的公司，为什么会陷入困境？接手它的人，又怎样把仍然存在的能力，重新组织成一条走得通的路？</p>
<p>以下，enjoy：</p>
<h2 id="案例梗概">案例梗概</h2>
<p>AMD 早期的机会，来自客户对第二供应来源的需要。IBM 不希望关键处理器只有一个可信来源，AMD 因而获得进入 PC 产业的重要入口。它能为客户提供选择，也能沿用已经存在的软件生态。〔1〕</p>
<p>但 AMD 的历史里，也有主动定义产品的时刻。1999 年开始出货的 Athlon，以及后来达到 1 GHz 的产品，证明了它的工程实力。2003 年推出的 Opteron，则让客户能够向 64 位计算升级，同时继续运行原有的 32 位软件。<strong>兼容性保护了客户过去的投入，也为新技术打开了入口。</strong>〔2〕〔3〕〔4〕</p>
<p>机会伴随着更大的投入。2006 年，AMD 完成 ATI 收购，公告交易价值约 54 亿美元，并为交易取得 25 亿美元定期贷款。图形能力被带进公司，现金与债务压力也随之增加。2009 年，AMD 拆分晶圆制造业务，成立 GLOBALFOUNDRIES，开始改变自己承担制造投入的方式。〔5〕〔6〕</p>
<p>与此同时，产品竞争力也遇到问题。2011 年 FX-8150 的同期实测显示，单线程表现拖累了部分应用与游戏体验。拥有更多技术构想，并不自动意味着客户能得到更好的结果。〔7〕</p>
<p>到 Lisa Su 于 2014 年 10 月接任 CEO 时，公司已经有一些值得保留的基础：CPU 团队在重建，游戏机半定制业务已有客户，制造业务拆分也早已完成。Keller 是 2012 年回归的，Sony 和 Microsoft 的新一代游戏机采用 AMD 芯片，也在 2013 年公布。<strong>她接手的是一组需要重新配置的能力与承诺。</strong>〔8〕〔9〕〔10〕</p>
<p>接任附近的季度快照是：现金、现金等价物及有价证券约 9.38 亿美元，总债务约 22 亿美元。传统计算与图形部门承压，而企业、嵌入式与半定制部门盈利。债务并非全部立即到期，这些数字也不能直接换算成“还能活几个月”；它们提示的是，资源配置的空间已经有限。〔11〕</p>
<p>把时间停在这里，我会把她面前的选择整理成三道题：</p>
<ol>
<li>在有限现金支持下，先停止哪些支出，又保护哪些能力？</li>
<li>CPU、GPU 与已有客户业务之间，怎样确定投入顺序？</li>
<li>如何让员工、客户与董事会共同接受一个需要多年才能验证的计划？</li>
</ol>
<h2 id="我的思考">我的思考</h2>
<h3 id="曾经领先的技术需要持续兑现的组织">曾经领先的技术，需要持续兑现的组织</h3>
<p>AMD 的早期历史说明，技术能力可以改变一家公司的位置。客户愿意认真考虑一个挑战者，是因为它提供了具体价值——性能、兼容性、供货选择，或者合理的成本。</p>
<p>但一次领先会过去。下一代产品能否按期出来，软件是否准备好，供应商能否配合，客户是否愿意再次采用，都需要组织持续完成。</p>
<p><strong>我自己的理解是，技术突破要被一整套交付能力接住。</strong> 技术负责打开可能性，组织负责让这种可能性在下一次、再下一次仍然成立。</p>
<h3 id="现金为长期技术争取时间">现金为长期技术争取时间</h3>
<p><img alt="" src="/img/daf0fc3478a939e9.jpg"></p>
<p>如果把自己放在 2014 年，我会先看现金流、付款承诺和研发节点。新的处理器不会因为换了一位 CEO，就突然缩短研发周期。</p>
<p>停止一些工作，也许能让费用下降。但如果被停掉的正是下一代产品所需的关键能力，公司只是变得更小，并没有获得新的竞争理由。</p>
<p><strong>我的选择是，把短期现金计划和长期技术计划放在同一张桌上。</strong> 今天能够贡献资源的业务，要评估它能为明天争取多少时间；明天寄予厚望的技术，也要给出今天可以检查的进展。</p>
<p>沙漏里的时间有限。领导者要决定，哪些事情值得让它慢慢流完。</p>
<h3 id="聚焦需要一份真正的停止清单">聚焦需要一份真正的停止清单</h3>
<p>CPU、GPU、嵌入式、游戏机，每个方向都能讲出机会。问题在于，每一项机会都会占用工程师、管理注意力和客户支持能力。</p>
<p>如果我是 Lisa Su，我会把高性能计算放在主要方向上，审查已经启动的核心研发，维护有价值的现有客户业务。偏离主线的项目，需要更强的客户证据、更小的投入边界，以及明确的停止条件。</p>
<p><strong>聚焦最终体现在资源分配上。</strong> 谁得到最好的团队，谁得到持续预算，谁必须停止，才是战略真正发生的地方。</p>
<p>我自己的倾向是，少做几个方向，接受一部分机会成本。这个选择也有风险：押注变得集中，因此更需要阶段性验证。</p>
<h3 id="承认前任的积累才能把资源用对地方">承认前任的积累，才能把资源用对地方</h3>
<p>回看成功案例，很容易围绕一个人重新排列全部历史。制造模式的改变、关键人才的回归、重要客户的获得，都仿佛在新领导者到来后才发生。</p>
<p>AMD 的时间线提醒我，接任者首先需要判断手里已有的东西。哪些真正有价值，哪些需要继续投入，哪些虽然花过很多钱，也应该停止。</p>
<p><strong>准确承认组织的积累，有助于让真正做事的人继续留下来。</strong> CEO 可以带来新的决断，也需要尊重那些使决断成为可能的人与工作。</p>
<p>我的理解是，领导力的一部分，就在于把散落在不同团队里的积累，组织成大家愿意共同承担的方向。</p>
<h3 id="信任要在一轮轮交付中重新建立">信任要在一轮轮交付中重新建立</h3>
<p>战略宣布后，真正细碎的工作才开始：性能没有达到目标，验证出现问题，客户要求变化，供应链需要协调。</p>
<p>我会给每项重大产品一个明确负责人，让研发、销售与运营共同面对同一份事实。出现问题时，先让真实情况进入会议，再讨论责任和补救。报坏消息的时间越早，团队能够做的选择越多。</p>
<p><strong>我的前三步会落在这里：摸清事实与现金，集中资源，再让承诺逐项兑现。</strong> 三件事交叉推进，前 90 天就应该看见计划、责任与验证方式的变化。</p>
<p>长期方向值得耐心，具体项目需要检验。把这两件事同时做好，员工才有理由继续投入，客户才有理由再次给出机会。</p>
<h2 id="对-arcus42-的借鉴">对 Arcus42 的借鉴</h2>
<p>这篇带给我的，是几条关于如何建设组织的方法提醒。</p>
<p><strong>第一，明确值得长期积累的核心能力。</strong> 一项服务能带来眼前收入，也要看它是否改善判断、交付质量与客户信任。新的机会进入之前，先检查它与这项能力的关系。</p>
<p><strong>第二，让试验有预算，也有结束条件。</strong> 给新想法留空间，同时约定何时复核、用什么证据继续。团队的注意力同样需要被认真分配。</p>
<p><strong>第三，保护那些短期报表尚不能完整体现的工作。</strong> 知识整理、质量复核、人才培养，都需要时间。保护它们，也意味着说明它们如何改善交付，并持续检查进展。</p>
<p><strong>第四，把客户承诺变成共同的工作标准。</strong> 由谁负责、何时完成、如何验收，都要足够清楚。让问题提早出现，通常比事后解释更有价值。</p>
<h2 id="写在最后">写在最后</h2>
<p>课前的我，投给这句话：<strong>危机中的领导力，是让有限资源支持一条能够持续兑现的路。</strong></p>
<hr>
<p>资料说明：本文依据公开历史资料完成。老师提到的《The Legacy of AMD》指定版本尚未核实；文中“我的选择”为课前分析，不代表教授或指定材料的结论。财务快照来自截至 2014 年 9 月 27 日、同年 10 月 16 日公布的季度业绩。本文讨论企业管理，不构成投资建议。</p>
