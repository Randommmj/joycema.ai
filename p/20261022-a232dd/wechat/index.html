<div class="phone"><div class="wxhead"><h1>哈佛预习｜领导力：Unspeakable —— 把难谈的事说清楚</h1><p>Joyce Ma<span>2026-10-22</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><figure class="hero"><img src="/img/4489244dbf6659d8.jpg" alt=""></figure><div class="prose"><p>Unit 3，Christina Wing 老师 Unspeakable，
Unspeakable: The Taboo Topics We Avoid and How to Talk About Them，与 Note on Difficult Conversations in the Family Enterprise。</p>
<p>有些安排，在写下来的那一天十分合理。很多年后，它们仍然留在文件里，人们的生活却已经走到了别处。</p>
<p>这次的两份阅读材料，讨论的是这些变化该怎样被看见，又该怎样被说出来。</p>
<p>以下，enjoy：</p>
<h2 id="案例梗概">案例梗概</h2>
<p>《Unspeakable》的导论，从一封葬礼后的邮件开始。</p>
<p>Luis Garcia 创办了一家成功的干洗企业，让家人过上了优裕的生活。他在很多事情上考虑周到，也以公平待人自许。但有几类话题，他一直不愿意谈：钱、接班，以及自己终有一天会离开。当孩子们试图问起，他总说还有时间，让他们以后自己弄明白。</p>
<p>葬礼结束几天后，三个孩子收到一位陌生律师发来的邮件。附件公布了父亲的安排：企业控制权给大女儿，家庭住宅给儿子和儿媳，其余资产进入一个惠及三个孩子、但限制较多的信托。每个人都感到意外，也都认为自己理解父亲的真实意图。只是，他们找不到一场大家共同参与过的谈话，能够说明这些决定为什么如此。</p>
<p>这份遗嘱是在二十年前写下的。当时，大女儿住在父亲附近，适合接手企业；儿子刚进入教育行业，收入有限，需要一处住宅带来的稳定；小女儿经济状况不稳，父亲希望通过限制保护她。放回那个时间点，安排有它的理由。</p>
<p>但二十年过去，大女儿搬到了外州，儿子也离开当地，成为事业有成的教授。最初让父亲担心的小女儿，反而留在企业工作，住在家中照顾日渐年迈的父亲。<strong>生活已经改变，安排却一直停在过去。</strong> 原先的考虑没有被重新讨论，父亲也没有和孩子们共同确认，如今什么才算公平。</p>
<p>按照 Wing 的叙述，不到一年，三个孩子就不再彼此说话。她在书中注明，部分人物姓名经过了匿名化处理。这个故事里的问题有着明确的时间跨度：当初合理的决定，在二十年没有更新的现实中，变得难以理解。</p>
<p>配套的 HBS note 把这个主题落到具体方法上：提前告知谈话主题，建立共同理解，保持客观，并在结束时约定下一步。它提供了接班、继承和家族婚前协议三个对话示例，也列出了家族新一代可以提出的问题。</p>
<p>老师留给我们的准备题很直接：想一段自己一直没有进行的对话，写下要和谁谈、为什么没有谈，以及等待正在带来什么代价。</p>
<h2 id="我的思考">我的思考</h2>
<h3 id="沉默会让决定失去更新的机会">沉默会让决定失去更新的机会</h3>
<p><img alt="" src="/img/24f1bfcdfd35bf56.jpg"></p>
<p>Garcia 家的三个孩子，对同一份安排有不同理解，是因为他们手里的现实已经不同了。谁留在企业，谁承担照顾，谁需要支持，二十年前和二十年后都不是同一幅图景。</p>
<p>如果这些变化从未被放到桌面上讨论，一份文件就会同时承载几个人互不相容的期待。<strong>决定需要理由，也需要重新检查理由是否仍然成立。</strong> 这件事同样适用于企业里的接班计划、合伙分工和关键岗位安排。</p>
<p>我自己的理解是，维护一个安排，需要有人持续追问它的前提。一个人是否仍然想做那份工作？原来承担风险的人，是否还在承担同样的风险？当事实变了，大家是否知道应该在哪里提出调整？</p>
<p>纸张能够保存决定。理解需要在人与人之间继续发生。</p>
<h3 id="体谅需要给对方选择的机会">体谅需要给对方选择的机会</h3>
<p>导论里的 Maya 是一家咨询公司的优秀员工。经理认为她不可或缺，客户常常点名要她。一个更重要的职位出现时，大家都以为她会获得晋升。</p>
<p>但她结束育儿假回到工作岗位才六个月。宝宝经常哭闹，她看起来很疲惫。经理觉得此时增加责任会让她更辛苦，也认为家庭事务太私人，不便询问，于是没有和她讨论，就把机会给了别人。</p>
<p>Maya 后来问起，经理说，以为她现在不想承担这样一个角色。她承认，自己确实可能拒绝。但她很震惊，自己根本没有被问过。</p>
<p><strong>一份出于好意的判断，也可能拿走对方作决定的机会。</strong> 这里值得谈清楚的，是岗位要求、本人意愿，以及她希望获得哪些支持。对方愿意分享多少私人情况，可以由对方自己决定。</p>
<p>我自己的理解是，体谅里应当保留询问。我们可以有观察和猜测，也要给对方修正这些猜测的空间。</p>
<h3 id="愿意直面问题也要为未知留出位置">愿意直面问题，也要为未知留出位置</h3>
<p>这堂课有一个值得追问的前提：并非每一段尚未发生的对话，都因为当事人害怕开口。有时，我们愿意面对已经看见的问题，却还不知道另一个问题存在。</p>
<p>HBS note 里的 Steve 就处在这样的情形。他 29 岁，做过私募股权投资，即将进入商学院。他一直以为自己将来会接班。母亲却认为，他喜欢外面的工作，不愿加入家族企业。她当年曾被父亲要求进入公司，因此希望给儿子更多自由。</p>
<p>母亲心里还有另一个接班人选：已经在公司销售团队工作的 John。但她也没有问过 John，是否愿意接班。于是，三个人的未来，部分建立在尚未被确认的理解之上。</p>
<p><strong>愿意谈自己知道的事，还需要配合一种能力：发现自己不知道什么。</strong> 例如，“我一直以为你希望继续留任，这个理解准确吗？”或者，“这件事里，有没有我还没想到、但你很在意的部分？”</p>
<p>我自己的理解是，坦诚也包含对自己判断的不确定。说出立场之后，仍然愿意给新的信息留一个位置，谈话才有可能改变原来的认识。</p>
<h3 id="提过以后要约定谁来做下一步">提过以后，要约定谁来做下一步</h3>
<p><img alt="" src="/img/d2afaf8fb35bf3dd.jpg"></p>
<p>Steve 和母亲的对话，并没有当场确定谁来接班。它取得的进展更加具体：两周后，把第三代成员约到一起，了解他们各自的意愿；Steve 起草邀请邮件，母亲发送，并让助理预订会议室。</p>
<p>这部分很值得留意。许多重要议题，已经被提过，也得到过“应该找时间好好谈”的回应。但谁来组织，需要哪些信息，什么时候继续，仍然没有答案。</p>
<p><strong>开口之后，还需要让问题进入一个能够继续推进的过程。</strong> HBS note 的三个步骤，正好对应这一点。</p>
<p>第一，建立共同理解。说明为什么谈、希望弄清什么，也明确自己愿意听对方的看法。材料建议，理想情况下至少提前 24 小时告知，让对方有准备。</p>
<p>第二，保持客观。围绕可以确认的事实，避免把猜测说成对方的动机。情绪太激烈时，可以暂停，给双方重新整理的时间。</p>
<p>第三，就下一步达成一致。复述各自听到了什么，哪些问题已有答案，哪些仍然需要信息，后续由谁来做、何时再谈。</p>
<p>我自己的倾向是，第一次谈话可以只争取一个足够小、但双方都认可的进展。代价是接受这次未必能得到最终答案，也要为后续投入时间。它让一个庞大的难题，开始有了可以着手的地方。</p>
<h3 id="把规则提前说明能减少个人化的误解">把规则提前说明，能减少个人化的误解</h3>
<p>HBS note 的另一个示例里，Crystal 即将结婚。父亲突然让她到办公室，递来一叠需要她和未婚夫签署的婚前协议。她首先感受到的，是父亲不信任自己的伴侣。</p>
<p>对话继续后，她才知道，这是家族统一的安排，而她只是这一代第一个结婚的人。父亲谈的是家族规则，女儿听到的却是对具体关系的评价。这个信息差，让谈话从一开始就带上了防御。</p>
<p><strong>规则越晚被解释，越容易被理解成对某个人的临时判断。</strong> 家族成员如何进入企业、报酬依据什么、表现不佳时如何调整，也会遇到类似问题。</p>
<p>提前说明规则，并不意味着规则本身就必然合理。规则仍然需要解释、讨论，也需要容纳不同意见。只是，当讨论发生在具体的人被要求接受某个结果之前，大家更有机会认真理解它的目的和代价。</p>
<h2 id="对-arcus42-的借鉴">对 Arcus42 的借鉴</h2>
<p><strong>把尚未问清的问题也纳入工作。</strong> 一份整理完整的资料，仍可能没有回答某个家庭成员真正关心的事。讨论时，可以区分已经确认的事实、各方的理解，以及仍待澄清的问题，让后续工作有明确的入口。</p>
<p><strong>让受到影响的人有表达的机会。</strong> 一个人替其他人作出的善意解释，需要留出被本人补充或修正的空间。谁参与哪一轮讨论，也应与议题和各方意愿相匹配。</p>
<p><strong>让工具帮助跟进，让人承担沟通。</strong> 在 AI-native 的工作方式里，技术可以帮助整理获准记录的信息、提示待办和追踪进度。敏感议题的切入、情绪的理解，以及最终决定，仍需要当事人与合适的专业人士参与。</p>
<p><strong>记录下一步时，也记录仍未解决的分歧。</strong> 一次会议结束，不代表每个人已经形成相同意见。把哪些地方一致、哪些地方尚未一致写清楚，能够让下一次谈话从真实的位置继续。</p>
<p><strong>随着生活变化，重新检查安排的前提。</strong> 家庭成员的意愿、职责和生活状况会改变。建立定期讨论的机会，有助于让既有安排跟上现实；涉及具体法律、税务或投资事项，则需要相应专业人士参与判断。</p>
<h2 id="写在课前">写在课前</h2>
<p>这堂课，我想继续追问两个问题：怎样发现那些自己尚未意识到的问题？当一个议题已经被提出，却还没有形成安排，怎样让各方愿意共同推进？</p>
<p><strong>我的课前票投给一个具体标准：谈话结束时，我们对下一步的理解，应当比开始时更清楚。</strong></p>
<hr>

    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
