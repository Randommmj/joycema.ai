<div class="phone"><div class="wxhead"><h1>哈佛预习｜全球市场：The Atlantic and OpenAI —— 内容该不该卖给模型</h1><p>Joyce Ma<span>2026-10-18</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><figure class="hero"><img src="/img/e16ccc3e8d3e0622.jpg" alt=""></figure><div class="prose"><p>Unit 3，Carrie Elkins 教授 Global Markets，
The Atlantic and OpenAI。</p>
<p>上一篇问的是，硅盾是保护还是软肋。这一篇把镜头从晶圆转到一本杂志。被拿去训练的，不是产能，是句子。</p>
<p>以下，enjoy：</p>
<h2 id="案例梗概">案例梗概</h2>
<p><strong>2024 年 3 月，《大西洋月刊》宣布与 OpenAI 达成两年合作。</strong> 对方获授权，用杂志内容训练模型、回答提问；杂志拿到授权费、优先使用技术的资格，以及在这个科技巨头内部的“优质新闻来源”位置。CEO Nicholas Thompson 看重的不只是钱，更是一个潜在的流量入口，以及“帮助塑造 AI 的未来”。新闻室炸了。记者给 Thompson 和总编 Jeffrey Goldberg 写公开信：AI 不能取代记者，任何还想配得上这份杂志一个半世纪标准的出品方，都不能允许这件事发生。编辑 Damon Beres 在本刊写成“魔鬼的交易”。The Information 创始人 Jessica Lessin 也借这块版面写：这些交易等于不起诉就和解，拿辛苦挣来的信誉换一点现金，而对方一边低估你，一边在造明显要替代你的产品。</p>
<p><strong>这份杂志从第一天起就更像一份美国观念，而不是一门好生意。</strong> 1857 年，爱默生、朗费罗、霍姆斯这批废奴派知识分子在波士顿创办它，要谈奴隶制，也要谈把国家推向内战的那些张力。它后来登过海明威、爱因斯坦，也发表过马克·吐温和亨利·詹姆斯的早期作品。前编辑 Cullen Murphy 的说法是：推动某种可称为“美国理想”的东西。文化上它不可或缺，账上很少赢。1990 年代年亏可到 50 万美元。1999 年，David Bradley 用 1000 万美元买下它，其后据说又砸进超过 1 亿美元。杂志仍年亏 400 万到 800 万美元。直到他把它当创业公司来跑——数字广告从 9% 升到 45%，业务扩到活动和咨询——2010 年才转盈 180 万美元。子女不要这本杂志。他开始找出口。</p>
<p><strong>2017 年，Steve Jobs 的遗孀 Laurene Powell Jobs 通过 Emerson Collective 买下 70%，代价超过 1 亿美元。</strong> 当时她的身家约 182 亿美元。Bradley 对员工说，她一直排在首选名单最上头：Emerson 已经开始为新闻本身投资严肃新闻。她把杂志写成关键时刻的关键使命——平等，美国观念，美国文化，以及这场美妙又常常凌乱的民主实验。集体以爱默生命名。组织本身却是硅谷的：LLC 而不是传统基金会，风投、行动主义和慈善放在同一张桌子上。她承诺不碰编辑，同时大举加人：编制加了约 30%，上付费墙，重做字体，并推动全公司更深地用技术。Bradley 当时说，大西洋的看家本领不是在技术前沿运转。她说：应当是。扩张很贵。利润从入主之初的约每年 1000 万美元再变亏。2020 年 3 月，订阅上涨，杂志仍裁掉 17% 的人。</p>
<p><strong>2020 年末，前《连线》总编 Nick Thompson 接任 CEO。</strong> 任务是：挖出坑，做成能自己养活自己的生意。他接手时赤字 2000 万美元。订阅价立刻提高 50%，并上线按转化概率打中读者的动态付费墙。Goldberg 把杂志从日常新闻挪向更少、调查更深的稿件。到 2024 年，杂志重新盈利，订阅超过 100 万，收入达到 1 亿美元，其中近三分之二来自订阅——此前不到一半。Thompson 任内拿下三个普利策。2024 年 10 月那期几乎没有标题的封面，拿下次年的 ASME 最佳封面。一篇报道促成当时 CNN 负责人辞职，一篇封面故事帮一名被错判的人洗清罪名。Goldberg 的原话：</p>
<blockquote>
<p>我们几乎把它当成一种意识形态和理想主义——我们做的东西值得买。</p>
</blockquote>
<p><strong>同一段时间，OpenAI 把科技行业掀翻了。</strong> 2022 年 ChatGPT 上线，两个月用户超过 3000 万。微软投入至 140 亿美元。模型需要海量文本。AI 公司相信规模直接换性能，于是试探版权边界，把互联网整段吞下。一项研究里，ChatGPT-4 的幻觉率接近 30%。2023 年 12 月，《纽约时报》起诉 OpenAI 和微软：Common Crawl 这一份“互联网副本”里，仅时报内容就有 1600 万条。GPT-3 到 GPT-4 据估在 45 TB 数据上训练，约等于一份 37 亿页的 Word 文档。时报要求销毁模型，并主张最高每篇 15 万美元的法定赔偿——这类稿通常授权约 10 美元。OpenAI 以合理使用抗辩，并说任何单一来源对训练都没有实质性贡献。到 2025 年 5 月，待决版权案约 40 起。判例是裂开的：一位法官说用对方的判例摘要训练竞争性产品，不具转换性；另一位说法官说 Anthropic 使用 700 万本书具有转换性。Anthropic 仍在 2025 年 9 月以 15 亿美元和解，约每本书 3000 美元。这是美国版权史最大的一笔和解。</p>
<p><strong>Thompson 选择了一条和时报不同的路。</strong> 他承认大模型显然未经许可就抓取了，然后算的是：被付费的方式有一整把，把对方给的好处，和起诉的成本、可能拿到的赔偿放在同一架天平上。确切条款未披露。OpenAI 当时在密集签约，行业估计的年费从数百万到 5000 万美元——News Corp 五年 2.5 亿，Financial Times 一年 500 到 1000 万，Axel Springer 三年 2500 到 3000 万。到 2025 年 4 月，OpenAI 已与 20 家新闻出版商合作，覆盖 160 多个出品方；出版商与 AI 公司之间，合计大约 72 单许可。Thompson 说，杂志不会过度依赖 AI 流量，会继续用最好的方式写故事，然后拼命去分发。他也说：如果大西洋这类内容进入这些模型，世界会是一个更好的地方。</p>
<p><strong>Powell Jobs 没有公开谈这笔交易。</strong> 她守住了不干预编辑的承诺。Goldberg 被误加进讨论作战计划的机密 Signal 群后，她站在总编一边。可她对 AI 的兴趣是公开的。Emerson 投了多家 AI 创业公司，并在 OpenAI 与乔布斯家族长期友人 Jony Ive 约 64 亿美元的硬件合作里扮演关键角色。2025 年她和 Ive 罕见同场。Ive 说，创新会有未曾预见的后果，有些美妙，有些有害，他仍觉得有责任。她接了一句——我们现在毫不含糊地知道，某些技术有黑暗用途，但那是侧向的结果。</p>
<p><strong>案例停在续约前的那张桌子上。</strong> Google 的 AI 摘要已使站外点击下降超过 34%；聊天机器人已替代超过 25% 美国人的搜索。新闻业在为“搜索为零”做预案。大西洋却在进人：2025 年上半年招了 30 名编辑，开出 20 到 30 万美元的薪水。多数同行在减人。这只是少数还能养活自己的出品方在按旧逻辑进人，还是她看见了另一层——开发模型的人需要写作者？若只拿合成数据训练，模型可能崩溃。写作者与 AI 公司的合伙，是两边经济上还能活下去的钥匙，还是在加速新闻被替代、把创造力往更平的方向推？</p>
<p><strong>Carrie Elkins 面前的四道题：</strong></p>
<ol>
<li>什么是思想经济？它怎样改写商业领袖所处的世界？</li>
<li>Laurene Powell Jobs 和 Emerson Collective 为什么要买下《大西洋月刊》？</li>
<li>大西洋该不该与 OpenAI 合作？</li>
<li>继续合作，对杂志的新闻，以及对更宽的思想图景，会有什么影响？</li>
</ol>
<h2 id="我的思考">我的思考</h2>
<h3 id="思想经济是给一句原创标上价格">思想经济，是给一句原创标上价格</h3>
<p><img alt="" src="/img/2a85bd0f0a57e75b.jpg"></p>
<p>思想经济不是一个新行业。它是生产、分发、并给原创思想定价的市场。新闻、文学、科学、论辩，以及一个社会用来判断何为真、何为值得付钱、何为被允许的那些东西，都在里面。</p>
<p>它有三层。生产是稀缺的人的工作：一份办了 168 年的杂志，一本写了三十年的小说，一篇能让人辞职、也能让被错判的人回家的调查。分发曾经是印刷，然后是开放网络，然后是搜索框。现在也是一个不必把读者送回原站就能回答的聊天机器人。捕获是谁拿到钱。大西洋生命里的大部分时间，捕获是弱的。2024 年利润表终于站住——收入 1 亿，近三分之二来自 100 万付费订户——恰好在这时出现了一个新的买方：把档案当燃料的模型训练方。</p>
<p>商业领袖已经活在这个市场里。监管、人才、客户、以及准不准继续做，都在别人的句子下游。用模型的顾问整体胜过不用的人，但好处主要落在低基线者，团队产出的方差被压平。案例里 2025 年 MIT 的研究：ChatGPT 用户脑参与最低，后期滑向复制粘贴。把模型当免费实习生用的人，是在悄悄削薄自己的判断。</p>
<p>我自己的理解是，<strong>全球市场这一课真正新的，不是杂志和实验室签了一单。</strong> 是思想过境的方式变了。它曾经以印刷品和毕业生过境。现在也以一次训练里的 token 过境。谁给这些 token 定价——授权、诉讼、还是合理使用标成零——谁就在写下未来十年知识工作的贸易规则。</p>
<h3 id="她买下的是一份美国观念不是一份利润表">她买下的是一份美国观念，不是一份利润表</h3>
<p>2017 年的收购，不能用 2010 年的 180 万利润来解释，也不能用后来的 2000 万窟窿来否定。</p>
<p>Bradley 1999 年付 1000 万，其后砸进超过 1 亿，在做成那 180 万之前仍年亏 400 万到 800 万。一个当时身家约 182 亿的人，用超过 1 亿买 70%，是一张托管支票。她当时的词是：关键时刻的关键使命。集体以爱默生命名。案例第一页就是爱默生本人——诗人与发明家解开我们的锁链。买下爱默生那一圈人创办的杂志，是给这句话拨款最字面的方式。</p>
<p>她做了两件不容易放在同一间屋里的事。她承诺不碰编辑，并且做到了。她同时把 Emerson 当创业公司来跑，让各板块去颠覆自己的领域，并在 Bradley 说大西洋不是技术公司之后回答：应当是。2020 年她给 Thompson 的命令又换了：挖出坑，做成能自己养活自己的公司。</p>
<p>没有持续经营的使命是补贴。没有使命的持续经营，只是又一个网站。她一直想两头都抓住。OpenAI 这笔交易，是这两个愿望不再能分房住的地方。</p>
<p>我自己的理解是，<strong>她买的从来不是 IRR。</strong> 她买的是在观念那一层有声音的权利。续约问的不是这单赚不赚钱。问的是：声音还在不在，以及它被什么样的价格卖掉。</p>
<h3 id="该签但不该按同一份合同续">该签，但不该按同一份合同续</h3>
<p>第一笔交易是定价，不是婚姻。</p>
<p>Thompson 的句子是对的框架。模型显然未经许可就抓取了。被付费的方式有一整把。把对方给的，和起诉的成本、可能拿到的东西放在一起称。档案已经进了 GPT-3 之后，这是唯一成年的算术。</p>
<p>签字的财务理由比公开信承认的更清楚。大西洋刚从 2000 万的坑里爬出来。Exhibit 3 里看起来像它的那一簇——FT 一年 500 到 1000 万，Axel Springer 三年 2500 到 3000 万——是年收入的 5% 到 10%。够付 2025 年那轮进人的大部分。诉讼不是免费的。时报第一年花了 1080 万，判决还没有。一本刚盈利、100 万订户的杂志，不该去当资助十年证据开示的那个试验品。</p>
<p>“不该签”这一侧也是真的。近 30% 的幻觉可以污到一个刚刚做成“值得买”的品牌。便宜的授权可能在资助那个让读者永远不必抵达的产品。Google 摘要已经拿走超过 34% 的推荐点击。更刺的是所有者自己的位置：Emerson 的 AI 组合和 Ive 的硬件，意味着她必须能证明，续约条款是按她桌上没有另一枚筹码来谈的。</p>
<p>我自己的选择是：续，按卖方写的条款续。训练和检索分开卖。禁止原样反刍，只要能点开的引用。时报或下一笔大和解若抬高地板，这单重谈。绝不让 AI 推荐成为重要的获客通道。继续告不付钱的——他们后来起诉 Cohere，说明已经分得清谁是对手方、谁在白用。把所有者的其他赌注从条款里拿开。</p>
<p>盲目续约的代价，是 Lessin 已经写在大西洋上、写给大西洋的那一句。走开的代价，是按时报的方式花钱，却没有时报的资产负债表。</p>
<h3 id="卖掉过去才能养得起下一篇调查">卖掉过去，才能养得起下一篇调查</h3>
<p><img alt="" src="/img/c508c8f0339f25e1.jpg"></p>
<p>Goldberg 其实已经顺手把战略做出来了。他们离开日常新闻，改做更少、更深的稿。日常新闻是聊天机器人最先替代的东西。能让人辞职、能让被错判的人回家的调查，是模型起源不了、订户仍愿意买的东西。</p>
<p>把档案授权出去，同时把新闻室加厚，是自洽的。卖掉过去，抬高下一篇原创的价格。2025 年上半年 30 个编辑，薪水 20 到 30 万，不是一种心情上的亿万富翁仁慈。这是在赌：人写的报道是稀缺投入。案例结尾那问，和这一赌是同一句——实验室是否需要写作者，好避免模型崩溃。</p>
<p>中期的风险也写在同一页。若模型用一段光滑的转述加一条死链来回答，订户就不会来。杂志内部的激励会悄悄偏向被模型引用：更短的解释稿，更少要花一年的调查。进人潮就会变成家具更好的内容农场。一条幻觉出来的“大西洋”声称，不是流量问题，是穿着本刊字体的名誉问题。</p>
<p>我自己的倾向是，<strong>钱必须回到写作者，这单才配得上她买杂志的理由。</strong> 给模型一条安静的、永久的饲料，不配。</p>
<h3 id="模型会把观念市场推平除非有人能说不">模型会把观念市场推平，除非有人能说不</h3>
<p>到 2025 年 4 月，OpenAI 已有 20 家出版商、覆盖 160 多个出品方。全行业大约 72 单许可。这听起来像一个市场。它只对请得起 Thompson 的人是市场。</p>
<p>案例里小说家 Min Jin Lee 的那一段，是另一半。她花了三十年写书，放下法律生涯，然后发现模型偷走了她的故事。若行价是给刊头一张七位数支票，给其余所有人零，下一本要写三十年的书，只会更少。Adobe 给作品加上可验证的署名，对归因有用。它不创造一份生活费。</p>
<p>创造力研究是商业领袖即使不买杂志也会感觉到的一层。AI 在发散思维上超过除最顶尖以外的人。用它写的故事，对弱的写作者更有用，作为一组却彼此更像。顾问一起变好，也一起变像。ChatGPT 用户变懒。四 C 模型把日常小创意和蒸汽机那种大创意分开。前者会被自动化、被同质化。后者会更值钱，也更难被养活——如果分发层不再把读者或版税送回来。</p>
<p>我自己的理解是，<strong>Powell Jobs 不欠实验室一份便宜语料。</strong> 她欠下一个爱默生一个世界：新的思想仍然有付款人。不带条款地续，对不起这句话。走开、让合理使用对所有小于时报的人继续标成零，也对不起这句话。同时坐在两个房间里的人，必须标出一个其他房间能够抄的价。</p>
<h2 id="对-arcus42-的借鉴">对 Arcus42 的借鉴</h2>
<p>读这个案例，想到的不是一份杂志的续约，是任何一家把判断写进系统的公司：档案已经在模型够得着的地方，定价规则却还没有。</p>
<p><strong>第一，知识一旦进了系统，活着的问题就是授权，不是纯洁。</strong>
会议纪要、家族档案、方案底稿，都会变成可训练的文本。训练、检索、生成给客户看的句子，是三件事，不要写成一个勾选。</p>
<p><strong>第二，人负责判断，模型负责其余——其余不能直接面对客户。</strong>
大西洋用付费墙保住了那 100 万订户。家办要保住的是房间里的那一层。模型可以起草。家族买的仍是一个人愿意签名的判断。</p>
<p><strong>第三，不要第二次把分发给平台。</strong>
出版商先把读者交给搜索，再看着摘要拿走三成以上的点击。内部系统可以查询。它不能成为客户“发现自己有问题”的那个地方。</p>
<p><strong>第四，同时坐在两边的人，欠较弱的一侧一个程序。</strong>
所有者可以爱技术，也可以爱一份观念机构。两样都在同一本支票簿里的时候，续约不能靠气氛。回避、披露、独立的人看条款，比事后解释更便宜。</p>
<p><strong>第五，新买方的钱，必须回到稀缺的人。</strong>
大西洋把合作费活成一轮高薪编辑，这单才站得住。若平台为流程知识付钱，费用应回到判断的质量，而不是更瘦的团队。</p>
<h2 id="写在最后">写在最后</h2>
<p>课前的我，最认同的是那句“该签，该续；不该按同一份合同续”。</p></div></template>
<script>

function wxConvert(root, heroSrc, date, url){
  var C='#333333', B='#385EA1';
  var P='margin:0 0 22px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var H2='margin:44px 0 18px 0;font-size:20px;line-height:1.5;letter-spacing:1px;font-weight:700;color:'+B+';';
  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

(function(){
  var src=document.getElementById('src').content, box=document.getElementById('light'), btn=document.getElementById('copy');
  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
</body></html>
