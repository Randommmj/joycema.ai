<template id="src"><div class="prose"><p>Das教授的课，我大概率都很喜欢。</p>
<p>这个案例的内容，商业上我还不算碰到 —— 如何Scale Up，如何从创始人交接给职业经理人 —— 但以后一定会碰到的。</p>
<p>对目前的商业，也非常有启发。</p>
<p>We create the possibility of greatness in people because it makes us great. Mediocrity undermines greatness. </p>
<p>—— Lululemon Core Value</p>
<p>故事梗概2008 年 5 月Christine Day 即将接任 Lululemon CEO。她之前在星巴克工作 20 年，最后负责亚太业务。Lululemon 背景成立于 1998 年，主营“瑜伽风格运动服”（yoga-inspired athletic apparel）。2005 年还是一家 4000 万美元的创业公司，20 家店；2008 年已是 3.5 亿美元上市公司，接近 100 家店，员工 3000 人。董事会目标继续开店，冲击 10 亿美元销售额，同时上线电商。挑战美国新店选址不佳、施工成本高；库存系统混乱；跨部门协作差，组织效率下降。企业文化要求所有员工（包括高管）每月在店里工作 8 小时，保持贴近顾客。增长表现2007 年销售额 2.75 亿美元，同比增长 85%；利润 3100 万美元，同比增长 300%；IPO 融资 3.44 亿美元；店铺销售额每平方英尺 1710 美元，远超 Abercrombie &amp; Fitch、J.Crew。市场挑战库存短缺导致额外空运成本；美国消费者购买力减弱，股价从 60 美元跌到 31 美元。品牌故事创始人 Chip Wilson 因不满传统运动服，设计了快干透气的瑜伽裤，并通过瑜伽老师作为“品牌大使”（ambassador）推广。新任 CEO 的任务拓展到跑步、游泳、自行车等新运动品类；解决库存、选址与协作问题；保持文化与客户连接；避免“潮牌速朽”的命运。</p>
<p>LEADERSHIP 课堂笔记1. ADVICE TO Christine Day — she needs a 90 days plan!Go to StoreFrontlineCustomersThere are the secret SauseSupply ChainIssues — Can be ACTIONS — quick wins, performance gapBob’s Team — Hire / Fire them            Build your TeamManage expectation</p>

</li>
<li>

<p>CULTURE 课堂笔记</p>

<p>The answer is Customer Satisfaction！</p>
<p>Anything in our business that create CUSTOMER DELIGHT (SATISFACTION) should not be touched!</p>
<ol start="2">
<li>
<p>Trust your gut，you are the guard, you are the core of your business.The first professionals will do is the mess with the core, when they come in to scale up.Do NOT mess with it yourself.if it is a successful business, your gut is rightif it is a sinking business? you may be wrongIt is does not pass your test — it is wrong.</p>

<p>Customer loyalty1. Before you open, people are already welcoming! WHY?When CD comes, she do REAL ESTATE / STORE OPENINGBefore you open, people are already welcoming! WHY?They believe that Lululemon will make the community betterThey want the service even before the company is ready to serveThey do not do AdvertisementThey want the Volume as well as the ambassadors金字塔：mike customer gives image — Volume</p>

<p>Store Managers as EntrepreneursThey allow 20% mistakesis this right or wrong?this is dangerousHow you make control? Make people not repeat again?TRAIN!!!</p>

<li>
<p>Have to build a leading management team.Send them to HBS, so that business school can train them</p>
</li>
<li>
<p>Bring ALIGNMENT with the team这一条太重要了，用加大字体！They get ownershipYou dont want someone say “I told you, I knew it would not work”Spend a lot of time to bring people together！ Your voice gonna be heard.BUT HOW?How to bring ALIGNMENT? ？？Das说之后的课会讲……</p>
</li>
<li>
<p>Christine on working with Chip(the founder)When you have a lot of ideas, put it in the case and come back every on year to see what is the prioritymeet three times a week for at least half an hourcan be something very small or big</p>

<p>For the new CEO : if the founder can not get the information he wants, he goes to people he trust, who are the ones being with him for a long time.</p>
<p>For the founder : go to your old team? if you do so, you CUT your CEO, it is the WORST thing you can do! You got this person in, you act like you give up.The other one can also be a coachCEO can coach the founder to execution</p>
<ol start="6">
<li>
<p>Accept and assume people are smarter than you.</p>
</li>
<li>
<p>Do Less But Mean More又一条极其重要的 —— 做在那些最重要的事情上！</p>
</li>
<li>
<p>You want good people? —— Then build a system that can adapt peopleYou will never find people who are like you, they could be slower or faster.</p>
</li>
<li>
<p>What delight the customer —— it is all in your gut, don’t let the consultant mess with you.</p>
</li>
<li>
<p>Create situation that people are eager on Monday that they want to workBecause they love youThey love the thing the company doesLooking forward to giving you their best</p>
</li>
<li>
<p>Learning is taking risk, learning is ugly, learning is risky.give people credit if they take risk and learn!</p>
</li>
</ol>
<p>Give the training and coaching and still maintain the high bar.</p>
<ol start="12">
<li>
<p>My Organization and I become what I measure.Measure your people on learning!</p>
</li>
<li>
<p>Trusting is so importantI do not have the experience to understand.—— admit it in front of people!Moving from ego CEO to a trusting and deligating people.</p>
</li>
</ol>
<p>总结一下，SPCEmployee Management SystemHireTrainStrongMentoring — different from supervisionGood Performance evaluation systemCompensation - not just moneyExtIntCORE to Excellence</p>
<p>Quality of the service provider🟰Quality of the service provide.</p>
<p>then you have Customer Delight</p>
<p>then you have Customer Loyalty</p>
<p>then Revenue up Cost down</p>
<p>The power is in EXECUTIONyou need every part of it</p></div></template>

function wxConvert(root, heroSrc, date, url){
  var C='#333333', B='#385EA1';
  var P='margin:0 0 22px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var H2='margin:44px 0 18px 0;font-size:20px;line-height:1.5;letter-spacing:1px;font-weight:700;color:'+B+';';
  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
