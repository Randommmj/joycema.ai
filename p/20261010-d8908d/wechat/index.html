<div class="phone"><div class="wxhead"><h1>哈佛笔记｜市场营销案例：Olay —— 一个 20 亿美元的品牌，是怎么腰斩的？</h1><p>Joyce Ma<span>2026-10-10</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><figure class="hero"><img src="/img/2e1adfc7c96355ac.jpg" alt=""></figure><div class="prose"><p>Unit 3 开课，Das Narayandas 教授的 Market-Facing Functions，第一个案例是玉兰油：Facelift at Olay (A)。</p>
<p>这不是一个"老品牌被新品牌打败"的故事。这是一个品牌，自己把自己拆散了的故事。</p>
<p>这篇是课前写的。先把判断放在这里，上完课再回来对照。</p>
<p>以下，enjoy：</p>
<h2 id="案例梗概">案例梗概</h2>
<p><strong>2017 年 10 月 4 日</strong>，宝洁北美护肤总经理 Chris Heiert 收到高层一封邮件：Olay 7–9 月销售同比 -12%，在本已很低的预期下还大幅缺口。你答应的全年增长，还算数吗？</p>
<p><strong>Olay 的来路</strong>：1952 年诞生于南非，一瓶粉色"美容液"。1985 年随 Richardson-Vicks 进入宝洁，当时只有 5 个 SKU，年销 1.65 亿美元。</p>
<p><strong>黄金十年（2000–2009）</strong>：
- 2000 年去掉 "Oil of"，改名 Olay；推出 Total Effects，19.99 美元，"对抗七大衰老迹象"，定位是"兰蔻、雅诗兰黛的功效，一半的价格"。
- 2003 年推出 Regenerist，五胜肽，"无需手术"。一位皮肤科医生在早间电视上背书之后，货架被买空。
- 2007 年推出"红罐"金纯面霜。
- 宝洁把这个打法叫 masstige（mass + prestige）：百货公司的功效，放在沃尔玛卖。2008 年 Olay 拿到美国面部护理 16.7% 的份额，2009 年全球零售额突破 20 亿美元。</p>
<p><strong>下坡（2010–2017）</strong>：
- 货架上同时有 5 个子品牌，沃尔玛一家最多 140 个 SKU，功效说法互相重叠。消费者看了广告进店，记不住是哪一罐，于是空手走出去。
- 每年推 30–40 个新品。零售商的原话："Olay 没有兑现承诺，我们不再指望它带动品类增长。"
- 2013 年为了讨好大学生，推出 Fresh Effects 祛痘线。首年 800 万美元。
- 2008–2015 年换了三任总经理，每人一套战略。
- 千禧一代叫它 "Oil of Old Lady"。
- 2017 财年，零售额跌回 10 亿出头。腰斩。</p>
<p><strong>外面的世界</strong>：市场本身在涨——美国护肤 177 亿美元、年增 6.7%；中国 269 亿美元、年增 8.7%。涨的部分被别人拿走：Glossier 靠 Instagram 和"开箱"；Rodan + Fields 靠皮肤科医生加社交媒体直销，2017 年销售过 10 亿，超过了 Olay；韩妆靠面膜、精华和"十步护肤法"进了沃尔玛。而 Olay 80% 的广告预算还在电视上，数字渠道不到 5%。</p>
<p><strong>手里还剩什么</strong>：美国成年人认知度 90%。红罐是品类销冠，《好管家》实测打败贵 4 倍的面霜，电商评分 4.5–4.7 星。护肤毛利健康。但红罐的家庭渗透率，只有 2%。</p>
<p><strong>Heiert 面前的三道选择题</strong>：
1. 卖不卖？宝洁 2015 年刚把 43 个美妆品牌卖给了 Coty。
2. 聚焦 35 岁以上，还是去追 21–35 岁？
3. 扩充产品线、甚至 all in DTC，还是砍 SKU？</p>
<h2 id="我的思考">我的思考</h2>
<h3 id="不卖卖掉解决的是总部的不耐烦不是品牌的问题">不卖——卖掉解决的是总部的不耐烦，不是品牌的问题</h3>
<p>卖，是把一个还活着的资产在最低点出手。</p>
<p>90% 的认知度、品类销冠、4.5 星以上的口碑、健康的毛利、还在涨的品类——这不是一个该被清仓的品牌。宝洁 2015 年卖掉的是 CoverGirl 和伊卡璐，留下的是潘婷、海飞丝、Olay、SK-II。Olay 在支柱那一层。</p>
<p><strong>卖掉，解决的是总部的不耐烦，不是品牌的问题。</strong></p>
<h3 id="钱在-35-岁以上年轻人推动增长是零售商的焦虑">钱在 35 岁以上，"年轻人推动增长"是零售商的焦虑</h3>
<p>数据先说话。2017 年美国护肤品销售：55 岁以上占 40%，45–54 岁占 24%，35–44 岁占 20%，35 岁以下只有 16%——而且三年几乎没动。</p>
<p>"年轻人推动增长"，说的是新品牌的增速和零售商的焦虑，不是销售额在哪里。</p>
<p>Olay 赢过的位置，是 17–25 美元这一档，占品类 35%。价格带没错，错的是这一档里的产品让人分不清。</p>
<p>而"讨好年轻人"这个实验，Olay 已经做过一次了——Fresh Effects，800 万美元，顺便把"Olay 到底是什么"搅得更浑。年轻女性的入门产品是卸妆巾，那是露得清的地盘；天然成分是艾维诺；对话感是 Glossier。</p>
<p><strong>一个品牌，不可能同时对 19 岁的痘痘和 55 岁的皱纹说"我最懂你"。</strong></p>
<h3 id="140-个-sku-是衰落的果也是因">140 个 SKU 是衰落的果，也是因</h3>
<p><img alt="" src="/img/4fe68a6a90ac5225.jpg"></p>
<p>140 个 SKU、5 个子品牌，是 Olay 衰落的果，也是因。</p>
<p>每年 30–40 个新品，零售商已经不信了。这时候再加一条线，或者因为"没有 DTC 经验"就猛冲电商，是把已经稀薄的资源再摊薄一层。</p>
<p>红罐的家庭渗透率只有 2%。<strong>把这一罐卖清楚，空间比再造一个子品牌大得多。</strong></p>
<h3 id="olay-赢是靠变清楚不是靠变年轻">Olay 赢，是靠变清楚，不是靠变年轻</h3>
<p>回看 2000–2009 年的 Olay，公式其实很简单：一个承诺（看得见的年轻），一个价格逻辑（大众渠道里的高端），少数几个有真科学的英雄产品。</p>
<p>衰落，是这个公式被自己拆掉。五个子品牌抢同一句话，"创新"变成了上新速度，三任总经理三套战略。</p>
<p>品牌的意义，掉成了内部访谈里的那两句话：</p>
<blockquote>
<p>"Olay 是一条温暖的羊毛围巾。你需要它，但它不时髦。"
"如果 Olay 在一所高中里，受欢迎的女生排第 1 到第 8，她排第 9。离受欢迎很近，但进不了那个圈子。"</p>
</blockquote>
<h3 id="抗衰老这个词先于产品过时了">"抗衰老"这个词，先于产品过时了</h3>
<p>2016 年 Olay 在 11 国调查 6800 位女性：三分之二认为年龄已经不像母亲那一代那么重要，80% 认为以后更不重要。</p>
<p><strong>Olay 的科学没有过时，Olay 的语言过时了。</strong></p>
<p>所以答案不是"回到 2009 年的口号"，而是回到当年真正起作用的结构——少、清楚、功效被证明、零售商算得过账——然后换一句话说：从"对抗衰老"，换成团队已经摸到的那句"肌肤看起来年轻，所以不会泄露你的年龄"。</p>
<h3 id="olay-不缺战略七年里有过太多战略">Olay 不缺战略，七年里有过太多战略</h3>
<p>课程说明里有一句："没有好的战略能离开出色的执行而成功。"</p>
<p><strong>Olay 的问题恰恰不是没有战略，而是七年里有过太多战略。</strong></p>
<p>执行上最难的四件事：
- <strong>零售商不会因为你承诺变简单，就把货架还你。</strong> 你自己砍 SKU，空出来的位置他们会给露得清、韩妆、Drunk Elephant。所以这不是一次求情，而是一笔交换：主动让出死库存，条件是英雄产品的面位写进下一次陈列图。沃尔玛占宝洁 100 亿美元销售，这场谈判就是战略本身。
- <strong>砍单品的当季，数字会先难看。</strong> 对那封邮件要诚实——这个季度不会靠多上新把增长做回来。把增长承诺，换成一条有日期的路径。
- <strong>流失的顾客不好拉回来。</strong> Heiert 自己说：品牌给了她离开的理由，她离开了，发现了另一个牌子。认知还在，习惯不在。
- <strong>考核机制和战略对着干。</strong> 如果前线还是按"上了多少 SKU"考核，他们会把"砍产品线"读成"放弃增长"。战略和考核必须一起改——停掉上新配额，只看红罐动销、复购、零售商每英尺毛利、家庭渗透率四个数。</p>
<p>还有一条：对总部，先要一句话——24 个月不换战略、不换总经理。过去七年的失败模式，就是一年一换。</p>
<h2 id="对-arcus42-的借鉴">对 Arcus42 的借鉴</h2>
<p>读 Olay，我一直在想我们自己。</p>
<p>一个多家族办公室最容易犯的错，和 Olay 一模一样：什么都想做，什么都说"我们也有"，于是客户站在"货架"前分不清你到底是什么——然后空手离开。</p>
<p><strong>第一，先回答"我们为谁"，再回答"我们做什么"。</strong>
35+ 还是 21–35，不是一个市场细分问题，是一个"我们愿意放弃谁"的问题。家办也一样——愿意为所有人服务，等于没有为任何人服务。</p>
<p><strong>第二，英雄产品只能有一个。</strong>
红罐之于 Olay，相当于我们那一项"看得见效果、算得过账"的核心交付。其它都是桥。桥可以留，但预算、人力、注意力，先给已经证明有效的那一端。</p>
<p><strong>第三，信任的熵增，是从每年 30–40 个"新品"开始的。</strong>
零售商说"你们没有兑现承诺"的时候，Olay 还以为自己在创新。每一次兑现不了的承诺，都在悄悄降低下一次被相信的概率。对家族客户，这个账更不能欠。</p>
<p><strong>第四，语言会先于产品过时。</strong>
Olay 的科学没问题，"抗衰老"三个字过时了。我们对家族说的那些词——"传承"、"架构"、"配置"——哪些还在被听见，哪些已经变成了背景噪音？这个问题我没有答案，但值得每年问一次。</p>
<p><strong>第五，战略和考核要一起改，否则战略只是一份 PPT。</strong>
三任总经理都有战略。真正没变的，是"上新 = 增长"的考核。组织会做它被衡量的事，不会做它被告知的事。</p>
<h2 id="写在最后">写在最后</h2>
<p>课前的我，把票投给了"少而清楚"。</p>
<p>上完课，再看哪一条被推翻了，被什么推翻的。</p></div></template>

function wxConvert(root, heroSrc, date, url){

      if(c.nodeType===3){ h+=esc(c.textContent); return; }

      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
