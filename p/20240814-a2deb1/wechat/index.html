<div class="phone"><div class="wxhead"><h1>A glance at 博物学&amp;博物馆学</h1><p>Joyce Ma<span>2024-08-14</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>荷兰的几家博物馆，给我留下了深刻的印象。回国后，三星堆博物馆和景德镇的陶瓷博物馆中，人满为患的景象也令人极大震撼。</p>
<p>荷兰鹿特丹的Depot</p>
<p>这几年似乎逛博物馆、美术馆的人越来越多，我自己就是其中之一，也能逐渐感受到博物馆的立意不同、体系不同、运营方式不同所带来的「最终呈现不同」。</p>
<p>好的博物馆和策展，绝不是简单梳理和介绍，更不是门类的堆叠，而是一场有心流的沉浸式体验，让人看到历史、看到脉络、看到过去，也看到当下。</p>
<p>同上</p>
<p>因此，有兴趣把不同的馆拼配在一起，稍稍把头伸入这个领域，匆匆忙忙瞥一眼：</p>
<p>博物学是怎么开始的？博物学与科学的关系是什么？博物馆学又是什么？</p>
<p>先说说位于莱顿的布尔哈夫博物馆，它给我带来了非常不同的参观和学习体验。</p>
<p>荷兰｜莱顿的布尔哈夫博物馆</p>
<p>这家博物馆并不大，入口在一条很窄的街道中，十分不显眼，一不留神就会错过，馆外墙上，大黑板上写着爱因斯坦的引力场方程。</p>
<p>但是，这里有非常棒的科学史收藏与呈现，真正让我看到博物学与实验科学，如何推动了近代科学的科学化和专业化。</p>
<p>我们的参观，先从一个"历史遗迹"开始：一个古老解剖台，被从某个教堂搬到了这里。</p>
<p>当年的学生们就是这样站在这里，学习「人体解剖学」——是的，真正的人体解剖。</p>
<p>周围的骨骼，都是当年教学所用的真正的骨骼标本。</p>
<p>最初，一个简单的人体模型摆在中间，一个古老的建筑，普普通通的天花板和墙面。 </p>
<p>然后，投影仪照在上面，当年解剖课的过程被徐徐展开。</p>
<p>从完整的人体、到骨骼、血液……‍‍‍‍‍‍‍‍</p>
<p>接着，墙壁、天花板也被用作幕布，幻化出不同历史时期，科学发展给人类心灵带来的震撼 —— 时而是人体奥秘的揭晓、时而是显微镜的演进、时而是仰望星空的探索。</p>
<p>站在这里，让我想起庄严的《希波克拉底誓言》、让我想起一代又一代天文学家孤独的求索、让我想起科学历史上的那些错误是多么有价值。‍</p>
<p>不需要宏大建筑或铺陈浪费的材料，需要的是对科学哲思深厚的功底和科普表达的能力。</p>
<p>博物学之于科学</p>
<p>博物学是人类与大自然打交道的一门古老学问，是对动物、植物、矿物、生态系统等所做的宏观层面的观察、描述、分类等，博物学实际上囊括了当今意义上天文、地质、地理、生物学、气象学、人类学、生态学、自然文学、动物行为学、保护生物学等学科的许多内容。</p>
<p>博物学对应的英文为 natural history，在古代，history大致相当于研究、探究的意思，词组的字面意思是对大自然的探究。确实对应着Cohan教授在科学史中所说，在科学革命之前的「自然知识」。</p>
<p>在博物学的世界，古希腊时代的亚里士多德是绕不开的人物，他所描述过的植物多达500多种，被誉为古代博物学家第一人。</p>
<p>又是亚里士多德，他不仅是哲学家，或者说那个时候的哲学家也囊括了对世界的探索和思考。‍‍‍</p>
<p>欧洲古代世界的博物学传统到了近代则推动了科学的发展……</p>
<p>近代博物学的兴起</p>
<p>科学这条路，能走出来，真的是多方力量的共同推动。</p>
<p>推动博物学的不仅仅是纯粹的好奇心，也有社会的风潮，甚至人们的虚荣心。想象一下：在17世纪文化之都的巴黎，一位优雅的贵妇人在沙龙上拿出一封信，打开时"不经意"地抖落信纸间夹带的沙粒 —— 那是她支持的一位博物学家/探险家从世界另一头寄回的信。</p>
<p>这就是当时的风尚，这派头堪比"拿出了自家在波尔多酒庄的获奖红酒"，或者"自己设计酒标独立装瓶的麦凯伦30年"。</p>
<p>大航海时代与欧洲海外扩张网络的形成，为16-17世纪以后博物学的快速发展提供了便利条件。</p>
<p>欧洲各国海外探险活动中除了抢占殖民地和进行商业贸易活动外，还伴随着大量的科学探索活动，包括对各类动物、植物、地质、岩石等构造进行采集、观察和分析，尝试建构新的博物学分类体系，以便将全球自然界纳入其中，构筑具有普遍性的科学知识。</p>
<p>认识自然也具有宗教意义，宗教人士一直是博物学发展的重要推动力量，他们以博物学为研究乐趣，深信由此可以发现并颂扬上帝。</p>
<p>后来的科学仪器发展，更是把科学往前推动了一大步。‍‍‍‍‍</p>
<p>著名的神经科学家西德尼·布伦纳（Sdyney Brenner）有一句名言，我非常赞同：科学进步依赖于新技术、新发现和新思想，而且大概率是按这个顺序发生。</p>
<p>Progress in science depends on new techniques, new discoveries and new ideas, probably in that order‍‍</p>
<p>博物馆学</p>
<p>有了博物学，还需要加上一点想要传世、想要科普的大爱，才有了后面的博物馆。 就像开头所说，并不是简单堆叠就能成就一个博物馆的。 因此才有了博物馆学。</p>
<p>博物馆学是不是一门独立的学科？这是一个长期以来一直在广泛讨论的问题。只要“博物馆”的定义还没有完全确定下来，那么博物馆作为一门学科对象也就无法明确。</p>
<p>对博物馆认识和搭建是一个不断转变的过程。</p>
<p>博物馆的早期认识：以藏品为导向的机构</p>
<p>位于莱顿（Leiden）的荷兰国家古物博物馆（Rijksmuseum van Oudheden）是荷兰最古老的博物馆之一。</p>
<p>回顾历史，它拥有一批早期的考古收藏。1818年，荷兰国家古物博物馆作为一个国家级机构，既希望引领公众和新一代的艺术家，还希望让荷兰在智识层面和国家自豪感上能够和其他现代国家相抗衡。</p>
<p>国家古物博物馆，位于莱登的拉彭堡（荷兰），创立于1818年</p>
<p>同一时期，荷兰这个新生的王国在收藏和研究的基础上建立一个国家级的博物馆体系。除了古物博物馆，还有自然史博物馆、国家历史博物馆、艺术史博物馆。稍后，国家人类学博物馆作为一个独立机构也加入了进来。荷兰国家古物博物馆的馆藏包括5个部分，埃及藏品（世界十大之一）、古代近东、古希腊古罗马时期的藏品、大量荷兰考古收藏分为史前时期、罗马时期和中世纪。</p>
<p>埃及展厅：国家古物博物馆的埃及展厅，莱登（荷兰）</p>
<p>荷兰考古展厅：国家古物博物馆中的低地国家考古展厅，莱登（荷兰）</p>
<p>对于外国部分的收藏，荷兰国家古物博物馆仅仅起到一个收藏机构的功能，而针对荷兰本土的收藏，完全称得上是一个本土化的博物馆。当整个国家形成了一个全面讲述国家考古故事的“遗址”，博物馆便寄望于成为这个遗址的“游客中心”。</p>
<p>20世纪90年代，博物馆的运营和创办者开始思考这些问题：</p>
<ul>
<li>
<p>博物馆究竟是一个考古学机构，还是一个碰巧拥有考古收藏的博物馆？</p>
</li>
<li>
<p>博物馆是只关乎于物，还是一个独特的媒介？内容还是容器？</p>
</li>
<li>
<p>博物馆在学术上是属于考古学界还是别的领域？</p>
</li>
<li>
<p>是否应该和文化遗产管理部门合作？</p>
</li>
<li>
<p>应该邀请谁来参加开幕式？</p>
</li>
<li>
<p>聘请的员工应该具备哪一些专业背景？</p>
</li>
</ul>
<p>在彼时的荷兰国家博物馆，大部分策展人／研究员（curator）和教育人员认可的博物馆学习模型倾向于将观众当作是小小考古学家，这种倾向在欧洲史前史的策展人中尤为流行。</p>
<p>这虽然算不上一个理论问题，但在各种实践中，也让很多事情变得不一样。</p>
<p>新博物馆学的传播：功能导向的博物馆构架在考虑博物馆主题是身份还是手段这个看似肤浅的矛盾关系之下，还潜藏着一个问题。总体来说，在20世纪70年代及之后的时间，大部分西方博物馆因为第二次博物馆革命消失了。</p>
<p>在60年代的学生运动之后，为了应对重大的社会转折，博物馆开始重新审视自己的价值观，他们开始用不同的方式参与到社会和观众中。长期以来，基于不同专业领域按等级来组织博物馆的方式也开始转向以社区为导向的服务。法国是这场运动中的先驱，尽管伴随着显著的本地或区域特性，新博物馆学（nouvelle muséologie）开始迅速向全球传播。到这个时期，构架博物馆的总体原则是基于功能的，而不是根据藏品和相支撑的学科。</p>
<p>1970年代“第二次博物馆革命”（根据van Mensch, 2004）</p>
<p>原本在馆长直接控制下的博物馆员工传播活动，现在和策展功能并置了。这些活动也被称为公众服务和呈现（public service and presentations），包括教育、展览策划、观众服务（导览员、讲解员）。在这种组织结构里，名词“curator”也被活用为动词（收藏、传播）。现在看来curator的主要工作是研究，他们许多人之前的工作代表的是专业化的典藏人员、档案保管员、注册人员。尽管curator仍然在展览制作中有着重要的作用，但是他们不再处于领导的位置。最重要的是，博物馆面向观众的展览和活动不再直接反映幕后的博物馆工作。跨学科的故事主题和叙事决定了陈列什么藏品。各典藏部门（例如绘画、纸质文物、纺织品、应用艺术等）并不拥有各自的展厅。博物馆学：博物馆化和文化遗产化过程的研究</p>
<p>至此，博物馆的核心功能已经成功互相关联，同时也实现了可持续性的平衡。</p>
<p>在荷兰阿姆斯特丹大学的瑞华德学院（Reinwardt Academy），博物馆学是研究生项目的正式名字，它是关于博物馆化和文化遗产化过程的研究。博物馆以及其他的组织实体，是其研究对象。在这种视角下，博物馆是一种有意义的重要的社会表达方式，是一个文化遗产产生的场域。它需要将不同的知识和学科结合起来，包括：历史、伦理学、民族学、社会人类学、社会学、藏品保护、藏品管理、意义建构与传播、文化领导力。如果将它们安排在一个逻辑框架中整理归纳，将可以把博物馆功能改写为遗产能力。</p>
<p>将博物馆功能重新定义为文化遗产能力</p>
<p>如今，博物馆越来越被看作是一个意义建构的合作者。博物馆在社会参与方面是有影响力的，在英国，博物馆甚至改变了生活。</p>
<p>为了保持有效性，文化遗产处理工作流程应该设定为一个环形，而不是线性。博物馆和文化遗产机构的传播目的是为了得到反馈，这样才能共同建构意义。假设博物馆真的对观众的回应感兴趣，其对观众、使用者和共同拥有者的影响，将在后续阶段中体现。这需要博物馆参与、反应、采纳并适应整个过程，甚至在藏品收藏方面，选择或者增加或者减少都可以成为共同建构意义过程的反应。</p>
<p>越来越多的人认为，这才是当今博物馆应该做的事情。</p>
<p>本文关于博物馆学的大部分内容改编自《内容还是容器？作为学科的博物馆学》，原文刊载于《博物院》杂志2017年第3期。</p>
<p>作者：里默·R·克努普 阿姆斯特丹艺术大学瑞华徳学院 。</p>
<p>译者：许捷 浙江大学人文学院</p>

<p>总而言之，‍‍‍‍‍‍‍‍</p>
<p>博物馆学从最初承载着博物学成果和收藏考古成果的机构，慢慢转变为一个跨学科的，帮助人们理解文化遗产化的潜在过程。</p>
<p>它不断从实践出发，并且一直保持对社会和学科的批判与思考。它的转变也正是人们对于历史、文物，以及「自我叙事」的转变。</p></div></template>

        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

(function(){
  var src=document.getElementById('src').content, box=document.getElementById('light'), btn=document.getElementById('copy');
  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
