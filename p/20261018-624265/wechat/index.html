<div class="phone"><div class="wxhead"><h1>哈佛预习｜战略：KLog.co —— 增长该先做深还是先铺开</h1><p>Joyce Ma<span>2026-10-18</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><figure class="hero"><img src="/img/7651879fe27bb271.jpg" alt=""></figure><div class="prose"><p>Unit 3，Juan Alcacer 教授 Strategy，
KLog.co – Charting the Course of its Future。</p>
<p>上一篇 Axel Springer 是老公司卖掉自己有感情的报纸，去买新世界。这一篇反过来：一家智利货代把旧生意留着当现金牛，把新世界做成一把锁，然后问——下一笔钱，该先加深这把锁，还是先去铺五面旗。</p>
<p>以下，enjoy：</p>
<h2 id="案例梗概">案例梗概</h2>
<p><strong>2023 年 12 月，Santiago。</strong> Janan Knust 端着一杯意式浓缩，盯着总部入口的壁画。壁画画的是 KLog 的十一年，员工以它为荣。他希望上面还能看见下一个十一年。</p>
<p>公司已经不像 2012 年那天席间的冲动。当时他父亲做鱼类出口物流，请他见 Kerry Logistics 的人。父亲拒了中方的提案，他插话：我来代表你们进拉美。KLog 起步时，只是 Kerry 在智利的经纪。到 2023 年，它给拉美 1,500 多家进出口商同时提供货运和软件：货代一年走完 13,834 票，自研 SaaS 上线一年出头做到 50 万美元年经常性收入，始终盈利，从未对外融过资。桌上已经有多份 term sheet。他问自己的，是同一组问题：继续用自己的现金长，还是接第一笔外面的钱？货代和软件之间，资源怎么切？每一个决定，会不会伤到让 KLog 之所以是 KLog 的那一层？</p>
<p><strong>Knust 的来路不像货代。</strong> 他生于以色列，有阅读障碍和 ADHD，17 岁从足球队被裁，去瑞士读酒店管理，从洗碗做到全球高端酒店的餐饮负责人。他把酒店业对服务的执念，带进了一个不以客户为中心的行业。前三年，品牌和关系都在，账没有。欠 Kerry 的债堆到破产边缘，他飞去中国要到一条授信。他后来说：好关系在低毛利、高度商品化的行业里不够；新的原则必须是"我们是谁"，不是"我们做什么"。</p>
<p><strong>货代这行，结构上就不好看。</strong> 全球物流大约 10.7 万亿美元；货代本身大约 1,760 亿，往后五年大约 4.1% 的年复合。DHL 占 6%，Kuehne + Nagel 占 4%，小玩家合计 60%。Knust 的原话是：进入壁垒基本为零，谁都能做。客户不同航线用不同货代，选最便宜的。行业平均销售成本 82%，EBIT 5%。单证几乎还是纸。疫情把这一点变成事故：提单传不过去，货就停在那里。运价则把所有人的收入变成过山车——行业 2021 年 +30%，2023 年 -11%；KLog 自己的客均票从 7,819 美元砸到 2,764 美元。</p>
<p><strong>他决定不按这行的样子做。</strong> 2017 年留下被投公司的 CTO Álvaro Serrano，从零做平台，先给内部用：采购订单、即时报价、船期、轨迹、单证。2020 年末 Serrano 说做不下去了——六个开发，几乎都是第一份工作，没有产品、设计和市场。他们写了一份"让技术成为主价值主张"的计划，留住他。客户开始用脚投票。一家拉美大家居零售的采购经理说：换到 KLog，是因为平台能迁就我们的作业，别人改一次要一辈子。一家智利体育分销商的 CEO 说：除了货运，我们喜欢的是能追踪、存单证、看历史成本、比价，还能跟客户经理说话。</p>
<p>平台有一处，比功能清单更重要：<strong>客户可以把别家货代走的货也加进来。</strong> 单证集中，哪怕箱子不是 KLog 搬的。为了让人先住进来，他们做了 K4All——一个窗口期内走一票 KLog，平台免费。只买软件的客户按柜量计价。平台还带全透明报价和三键 Book &amp; Pay，销售可以被绕开。传统货代吃饭的那层信息不对称，被自己拆了。</p>
<p><strong>疫情是一次意外的验证。</strong> 运价暴涨，进口商常常不知道货在哪。技术投资在混乱里被证明是对的，收入被抬到约 8,000 万美元。Flexport 一度值 80 亿美元，Nowports 值 11 亿。Knust 知道潮水会退。他补了班子，办公室开到秘鲁、玻利维亚、墨西哥，从 Rappi 请来墨西哥 CEO。融资见过，term sheet 拿过，最后决定继续用现金滚。他后来说，这种滚法让他们对成本更清醒。</p>
<p><strong>到 2023 年，成绩单是撕裂的。</strong> 收入从高峰 7,810 万落到 3,880 万，2024 年预算 5,000 万。箱子还在长：整柜从 5,256 TEU 到 14,718，三年复合 41%；交易笔数在票价腰斩的那一年还增长了 35%。整体客户流失从 2017 年约 55% 降到约 40%——仍像这行。可一旦上了平台，留存走到另一条曲线：大约 80% 以上，第七年回到 100%；不上平台的，第一年就掉到 51%，五到七年大约留下 20%。2023 年中，活跃客户里平台用户只占 26%。货代客均毛利约 22%、营业利润率约 11%；SaaS 是 90% 和 35%——而年经常性收入只有 50 万美元。</p>
<p>文化被写成 AFIRE：乐、聚焦、不舒服、韧性、学习。Knust 说，文化是迄今最重要的成功因素。招聘故意不从货代行业里找人；与此同时，多数高管他三岁就认识。办公室有午睡区、上门按摩和生啤。</p>
<p><strong>面前四件事，两年现金 1,500 万美元。</strong> 地理扩张——巴西、哥伦比亚、巴拿马，外加中国和迈阿密——约 2,000 万；数字平台加 SaaS 销售团队，约 1,200 万；贸易信贷、库存融资、支付、保险，约 1,100 万；补 CMO、CRO、参谋长，约 200 万。合计约 4,500 万。示例条款是 5,000 万、投前 2 亿，1.5 倍优先清算，第七年可以赎回或强制启动出售，董事会一席对审计和薪酬有否决。</p>
<p>Knust 坐在桌前，要回答：</p>
<ol>
<li>货代这行好看吗？</li>
<li>KLog 的模式，最新的是什么？它在不在解决这行的问题？</li>
<li>竞争优势是什么，守得住吗？</li>
<li>这条增长曲线，强在哪，弱在哪？</li>
<li>接下来该先做深，还是先铺开？</li>
<li>该不该用外面的钱来付这张账单？</li>
</ol>
<h2 id="我的思考">我的思考</h2>
<h3 id="货代行业不好看这正是这个案例的起点">货代行业不好看，这正是这个案例的起点</h3>
<p><img alt="" src="/img/26a5f76c8b256969.jpg"></p>
<p>Alcacer 的战略课，第一问几乎总是行业本身。这一问如果答成"货代在长，所以好看"，后面五问都会偏。</p>
<p>进入壁垒为零，转换成本为零，价格就是产品，平均 EBIT 5%，前两名加起来只有 10%。大企业已经直接跟船公司谈。决定收入的往往不是本事，是运价——KLog 自己的客均票，一年里可以腰斩。</p>
<p><strong>难看，不是待在外面的理由，是不要按原样去放大这个行业的理由。</strong></p>
<p>我自己的理解是，这类行业里的战略，不是"我们比别人更会搬家"，而是"我们让客户离开时会痛"。痛感不在更低的运价里。运价是所有人都能抄的。</p>
<h3 id="最狠的一招是把自己吃饭的信息不对称拆掉">最狠的一招，是把自己吃饭的信息不对称拆掉</h3>
<p>传统货代靠三件事活：关系、谈判、客户看不清。KLog 把报价摊在桌上，再加一个三键下单，自己的销售可以被绕开。</p>
<p>这不是一个产品经理的功能。这是一个创始人选择交出去的旧优势。短期像在拆自己的中介；长期换的是信任，以及那张留存分叉图。</p>
<p>同一思路还有一处，更容易被当成"开明"而看轻：平台允许客户把别家走的货也放进来。一家货代做成自己的下单工具，是在争按钮；做成客户的单证和历史住的地方，是在争记忆。</p>
<blockquote>
<p>"客户会留下继续让 KLog 搬家，因为竞争者还在用纸和笔搬家。"</p>
</blockquote>
<p>Knust 这句话把两件事说在一起：搬走箱子的，仍是货代；让人不想换的，是系统。</p>
<p>我自己的理解是，<strong>旧的信息租金一旦变成搁浅资产，越早交出去越便宜。</strong> 交晚了，会有别人替你交，然后把记忆拿走。</p>
<h3 id="护城河不在软件在软件和货代长在同一套系统里">护城河不在软件，在软件和货代长在同一套系统里</h3>
<p>Serrano 留下，不是因为技术本身。他自己说：只有技术不够。平台是和作业团队一起长的，员工用的就是客户用的。所以客户会说，别人的工具又薄又硬，改一次要一辈子。</p>
<p>文化被写成和软件并列的一层。AFIRE 里我最在意的是两个词：不舒服，和学习。前者禁止公司在事情开始变容易时放松，后者禁止靠聪明临时发挥。再加上一条招聘纪律：故意不从货代行业里找人。</p>
<p>这三件套——活的作业、同一套系统、还在筛选的文化——抄功能清单抄不走。单独抄一块屏幕，大货代已经在做；Flexport 用高得多的估值演过。</p>
<p>它也还没做完。活跃客户里只有 26% 住在平台上。50 万美元年经常性收入，按案例给的客均软件收入倒推，付费户大约二十来家。K4All 的免费层在抬留存，软件公司还没有出生。</p>
<p>我自己的倾向是，<strong>先把"住进来"当成战略指标，而不是把 ARR 当成战略指标。</strong> 二十六变成六十，货代账本的性质会变；五十万变成五百万，如果二十六还在，性质不变。</p>
<h3 id="收入腰斩箱子还在长是成绩单也是警告">收入腰斩、箱子还在长，是成绩单也是警告</h3>
<p>只读收入，KLog 像在缩：7,810 万到 3,880 万。只读 2021 年，它像一家该值 2 亿美元的科技公司。两张读法都是错的。</p>
<p>箱子在长，客户在长，票价在塌。2023 年交易笔数 +35%，客均票 -60%。这是一家在难看的行业里拿份额的公司，被一张运价图撕开了利润表。2024 年预算 5,000 万美元、15,000 票，是恢复，不是登月。</p>
<p>警告在另一侧。综合流失仍约 40%。四种文化还没完全长到一起——Serrano 2020 年差点走，技术在替代手工，Knust 已经能看见"若不指数增长，员工会没活干"。多数高管他三岁就认识：二百人时是速度，要补市场营销、收入负责人和一套信贷职能时，是盲区。地理仍薄，智利为重。AFIRE 和生啤，不能当成工具箱出口。</p>
<h3 id="先把平台做到足够黏再去铺巴西">先把平台做到足够黏，再去铺巴西</h3>
<p><img alt="" src="/img/a2e0cdc1d3332bf0.jpg"></p>
<p>四年菜单加起来约 4,500 万美元，两年现金 1,500 万。平台加班子是 1,400 万，装得进自己的口袋。巴西、哥伦比亚、巴拿马、中国、迈阿密是 2,000 万，Fintech 是 1,100 万，装不进。</p>
<p>我会把现金花在前两件上。地理后置，而且以后也先带软件进去，不要先带仓库进去。Fintech 先搁下——贸易信贷是第三门生意，他们刚刚活过客均票跌 60%，没有理由在这个时点去放贷。</p>
<p><strong>增长菜单不是四件平等的事。排序就是资本结构。</strong></p>
<p>代价很清楚：在圣保罗，会有一段时间看起来比融了资的对手小。另一条路的代价更贵：在二十六还没变成六十之前，先把自己做成一家更体面的区域货代，而且钟是别人的。</p>
<p>DHL 和 K+N 靠买当地优等生长大。KLog 在自己还没有那些优等生没有的东西之前，不该抄这条路。</p>
<h3 id="这张-term-sheet我不签">这张 term sheet，我不签</h3>
<p>5,000 万美元，投前 2 亿，稀释 20%。1.5 倍优先清算，第七年可以赎回或强制卖公司，一个董事席位卡住审计和薪酬。</p>
<p>按 2023 年收入，大约 5 倍。软件就算按十倍年经常性收入，也只值小几百万。投资人在承销一本刚腰斩的货代账，外加一个故事。案例自己写过：Flexport 那种希望，已经降温了。</p>
<p>融资有用的那一部分，他们已经拿过一次。过程让公司被看懂，关系留下了，钱没有拿。繁荣里这是对的。退潮之后，若增长只做平台和班子，仍然是对的。</p>
<p>我自己的理解是，外面的钱只为现金盖不住的护城河。KLog 这回合，护城河盖得住。条款改写的，恰恰是护城河——人怎么被付钱，什么被测量，第七年必须讲出一个怎样的故事。壁画下一格，不该是别人的笔迹。</p>
<h2 id="对-arcus42-的借鉴">对 Arcus42 的借鉴</h2>
<p>读这个案例，想到的不是集装箱，是任何一家同时卖"服务"和"系统"的公司：旧生意在付账，新系统在决定客户明天还在不在。</p>
<p><strong>第一，先问行业好不好看，再问自己要不要按它的样子长大。</strong>
壁垒低、价格战、客户随时走的行业，扩张地盘等于复制流失。战略的第一件事，是改离开的痛感，不是多开几扇门。</p>
<p><strong>第二，真正要争的是客户的记忆，不是下单按钮。</strong>
系统如果只能装自己卖掉的东西，它还是货代的网站。系统如果能装客户在别处发生的事，它才开始变成事实源。人走客户走，往往是因为记忆还住在某个人的脑子里。</p>
<p><strong>第三，旧的信息租金要主动交。</strong>
看不清，是很多中介行业的利润来源。把它摊开，短期像在拆自己的销售；不摊开，会有人替你摊开。黏性是新的利润，不透明是搁浅资产。</p>
<p><strong>第四，增长菜单要排序，排序就是资本结构。</strong>
四件看起来都正确的事，加总会逼出一张改写文化的条款。先做那件让客户离开时会痛的事。现金盖得住护城河，就先不要为旗子数去买别人的日历。</p>
<p><strong>第五，文化只在它还在筛选的时候，才是战略。</strong>
写在墙上的词，加上"我们不招这个行业里的老兵"，是过滤器。写在墙上的词，加上只从熟人里找下一个人，再加一个外面的薪酬委员会，是气氛。</p>
<p><strong>第六，融资的对错，不在融不融，在钱盖的是不是现金盖不住的那一层。</strong>
走完一轮、最后把条款放下，也可以是最有价值的一段。该融的时候融，不该融的时候，过程本身已经够用。</p>
<h2 id="写在最后">写在最后</h2>
<p>课前的我，最认同的是那句"增长菜单不是四件平等的事。排序就是资本结构"。</p>
<hr>
<p>这是课前读书笔记，依据哈佛案例课堂材料整理，不构成对任何公司或交易的投资建议。</p></div></template>

  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

(function(){
  var src=document.getElementById('src').content, box=document.getElementById('light'), btn=document.getElementById('copy');
  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
</body></html>
