<div class="phone"><div class="wxhead"><h1>哈佛笔记｜市场营销案例：Olay —— 承诺可以换，俯视不能留</h1><p>Joyce Ma<span>2026-10-12</span></p></div>

<template id="src"><figure class="hero"><img src="/img/59a15d0cce397a30.jpg" alt=""></figure><div class="prose"><p>Unit 3，Das Narayandas 教授 Market-Facing Functions，
Facelift at Olay (A)。</p>
<p>上课之前，我把票投给了「少而清楚」。不卖这个牌子。不追 19 岁的痘痘。砍掉货架上互相重叠的说法，把红罐讲明白。「抗衰老」，换成一句不吓人的话。</p>
<p>课上完，这张票还在。它被挪了一个位置，底下又露出一层我事先没写到的东西。</p>
<p>以下，enjoy：</p>
<h2 id="少红罐科学这三样还站着">少、红罐、科学，这三样还站着</h2>
<p>Olay 的问题，课上先落到三处。SKU 太多，顾客是困惑的，所以要砍，留下红罐。创新要有科学打底。还有一句：人在哪里，你就在哪里。别站在灯光下面。</p>
<p>上课之前，我写的是预算。案例里，广告开支大约 80% 还在电视上，数字渠道不到 5%。灯在电视上，是因为那里亮，组织也知道怎么在那里花钱。顾客已经不站在灯下。</p>
<p>定位若是一团雾，仗还是可以打赢。只是会贵得多。</p>
<p>产品线的动作，课上给的数字是从大约 150 个收到 80 个。红罐还是那个被留下来的英雄。科学没有被说成过时。</p>
<p><strong>少，和清楚，课上没有挪走。</strong></p>
<h2 id="两群人之间要的是一座桥">两群人之间，要的是一座桥</h2>
<p><img alt="" src="/img/977146167fd57393.jpg"></p>
<p>上课之前我写过一句硬话：一个品牌，没法同时对 19 岁的痘痘和 55 岁的皱纹说「我最懂你」。钱在 35 岁以上。Fresh Effects 那 800 万美元，是去讨好年轻人的一次失败。</p>
<p>19 岁的祛痘，仍然不是这扇门。</p>
<p>老师要的是另一件事。在原来的顾客和新的顾客之间搭一座桥，找到共同的地面。承诺可以换。原来的人不能丢。</p>
<p>老顾客是年长的女性，旧的承诺叫抗衰老。女儿不再愿意做母亲做过的事，这句故事就停了。世界是在我们眼前变的。</p>
<p>新顾客对护肤的理解深得多。互联网把信息的成本打到很低，品牌失去了对顾客的控制。我坐在那里写下的是：我们这一代在控制里长大，脑子像一块焊在控制机制上的硬件。新的一代不是这样长大的。韩国的牌子，从这条松开的缝里进来。</p>
<p>研究里的那个人，课上叫她 MI30，三十岁上下的千禧一代。她想被特别地对待。她仍然在大众渠道里买。</p>
<p>切分客户的方法，因此得换。皮肤上共同的那件事，把两个人留在同一句话里。</p>
<p><strong>承诺换掉，是为了原来的人还听得见，新的人也走得进来。</strong></p>
<p>我自己的理解是：放弃 19 岁，这件事站得住。把 30 岁也推出去，桥就断了。入口在她第一次认真看自己皮肤的那年。</p>
<h2 id="抗衰老底下是一种俯视">抗衰老底下，是一种俯视</h2>
<p>上课之前我写：科学没有过时，过时的是语言。我准备的那句替换是，「肌肤看起来年轻，所以不会泄露你的年龄」。</p>
<p>课上把语言揭开，底下是一种关系。</p>
<p>抗衰老这三个字，让人觉得自己正在变老。它唤起的是恐惧。更旧的一种口气是：我比你懂，可我关心你，所以我得帮你。主人，和被照拂的人。老师把它叫做 patronizing，一种居高临下的好意。</p>
<p>数字世界里长大的人，要的是对等。</p>
<p>品牌从前拥有消费者。这句所有权，顾客不再认。</p>
<p>课堂上讲到的做法，是把 anti-aging 这个词拿掉。那句话的潜台词是：我在变老，我身上有什么不对。</p>
<p>营销、产品、包装，得是同一种口气。知道客户，也不是核对一份数据。核对看的是数字。知道，是进到她的情绪和心态里。客户感觉到一丁点俯视，这件事就结束了。</p>
<p>笔记里还写着内隐偏见。男人和女人都有，过去不把女人的话当真的那种。我给自己留了一项作业：去看 Mahzarin Banaji 的测试，也看自己——有没有在听。</p>
<p>俯视，常常从没有听开始。</p>
<p><strong>关系若还是俯视，换过的那句口号，说话的仍是主人。</strong></p>
<h2 id="功能在左边忠诚在右边">功能在左边，忠诚在右边</h2>
<p>课堂上用的是 Kevin Lane Keller 的品牌金字塔，四问。</p>
<p>你是谁。这一层是 salience，被人想得起。</p>
<p>你是什么。可以有两种答法。性能，像宝马回答「我开起来怎样」。意象，回答「我和谁在一起」。</p>
<p>你怎么样。性能走到判断，意象走到感受。</p>
<p>你和我怎么样。顶上是 resonance，共鸣。关系还在不在，忠诚在不在，都在这一层。</p>
<p>左边是功能的、理性的，大众市场更多走这边。右边是情绪的，高端更多走这边。</p>
<p>两边最后都要走到。左边更容易：你确实比替代品好，功能上站得住，路就通。右边更难，也更留得住人。那种忠诚是安心，是夜里睡得着。买它的人，常常是买给孩子，买给孙子。</p>
<p>有人问，企业客户总该是功能的。老师的回答很短：那也是情绪的。要的是安全，是平静。</p>
<p>我自己的理解再往前半步：功能让人买下第一次。<strong>安心，才让人留下来，并愿意交给下一代。</strong></p>
<h2 id="罐子搜索和柜台说的是同一句">罐子、搜索和柜台，说的是同一句</h2>
<p>上课之前，文章停在选择题。课上补的是，承诺怎样变成摸得着的东西。</p>
<p>她在搜视黄醇。对手都在用。站出来的方式，是 Retinol 24：二十四小时都在起作用。罐子上这几个字，要印得和 OLAY 一样大。先知道她在找什么，再决定印什么。</p>
<p>质地也是承诺。霜是蓬松的，不油。组织里的人被带到顾客面前。</p>
<p>百货公司里原来有美容顾问。人散了以后，用 Olay Skin Advisor 接上：一张照片，一份问卷，回答「什么适合我」。它是网页，不是一个还要先下载的应用。在她准备好的时候遇见她。</p>
<p>搜索收回到自己手里。要和顾客有直接的接触。</p>
<p>数字的动作并没有铺开很多。老师要的是组织里的一种共同语言。透明度是现在的规则。从前藏得住的东西，现在藏不住。</p>
<p>一件事。把承诺许出去，然后守住。</p>
<p><strong>少，是罐子、搜索和柜台，都在说同一句。</strong></p>
<h2 id="品牌是你答应客户的那一句">品牌是你答应客户的那一句</h2>
<p><img alt="" src="/img/6dd606ea857a5c4e.jpg"></p>
<p>老师让旁边的人互相说一句：你的 brand promise 是什么。</p>
<p>我旁边的同学 Sam Vu 说：Make sure you win。员工要赢，伙伴要赢，财务上要赢，情绪上也要赢。</p>
<p>我问自己的是两句更近的。Arcus42 答应的是什么。我答应的是什么。</p>
<p>我早先用一个词描述和客户的关系：Reflective Ally，并肩的同盟。品牌也被放在一个很高的位置。这堂课把两件事分开了。高，可以是 Keller 右边的那种共鸣。高，也可以是「我比你懂」。客户分得清。</p>
<p>营销、交付、见面时的语气，得是同一种关系。</p>
<p><strong>客户感觉到一丁点俯视，再高的那句品牌，也作废了。</strong></p>
<h2 id="写在最后">写在最后</h2>
<p>「少而清楚」，这张票还在。</p>
<p>被挪开的，是只按年纪把人切开。</p>
<p>新看见的是关系。品牌不再拥有顾客。承诺可以换。俯视不能留。</p></div></template>

function wxConvert(root, heroSrc, date, url){
  var C='#333333', B='#385EA1';
  var P='margin:0 0 22px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var H2='margin:44px 0 18px 0;font-size:20px;line-height:1.5;letter-spacing:1px;font-weight:700;color:'+B+';';
  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

  });
