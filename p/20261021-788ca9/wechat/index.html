<div class="phone"><div class="wxhead"><h1>哈佛预习｜金融：Slater &amp; Gordon —— 增长需要怎样的资本</h1><p>Joyce Ma<span>2026-10-21</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><figure class="hero"><img src="/img/0828c9392765da42.jpg" alt=""></figure><div class="prose"><p>Unit 3，Martin Sinozich 教授 Finance，
Creating the First Public Law Firm: The IPO of Slater &amp; Gordon Limited。</p>
<p>一家律所可以先替客户承担费用，等案件成功再收费。但当它要把这样的服务提供给更多人，谁来承担等待的成本？</p>
<p>Slater &amp; Gordon 的上市计划，把专业服务里不太显眼的一件事摆到了台面上——时间也需要资本。</p>
<p>以下，enjoy：</p>
<h2 id="案例梗概">案例梗概</h2>
<p><strong>2007 年，一家澳大利亚律所准备成为全球首家上市律所。</strong> Slater &amp; Gordon，简称 S&amp;G，1935 年创立于墨尔本，从工会与劳动者的工伤赔偿业务起步。到案例时点，它已有近 400 名员工、超过 140 名律师，在六个州设有 21 个办公室。长期为个人提供法律服务，给它积累了品牌、转介网络和每年约 30,000 通电话咨询。</p>
<p>人身伤害诉讼贡献了约四分之三的核心收入。这个业务的重要承诺是：</p>
<blockquote>
<p>“No Win—No Fee”</p>
</blockquote>
<p>案件不成功，不收律师费。客户因此获得了原本可能负担不起的法律服务；律所则需要筛选案件、垫付支出，并承担无法收费的风险。案例中的普通案件通常持续 6–24 个月，典型律师费约为 15,000 澳元。近期已承接的人身伤害案件成功率约 95%，但这建立在过去的筛选与执行能力之上。</p>
<p><strong>账面收入与现金回收，沿着不同的时间表前进。</strong> 律所会根据工作进度、预期收费和胜诉概率，在案件结束前确认部分收入，形成在办案件资产 WIP。附表中的一宗成功案件，前三个期间各支出 4,250 澳元，到第四期才收到 17,250 澳元，其中包括代垫费用的回收。最终税前利润是 4,500 澳元，而此前累计垫付了 12,750 澳元。</p>
<p>S&amp;G 希望把这套能力用到更大的平台上。自 2002 年以来，公司已整合八家小律所；最近一年收购的四家共花费 930 万澳元，预计能为 2008 财年贡献超过 800 万澳元收入。小律所面对日益复杂的法律与管理要求，整合者则有机会共享品牌、获客、系统和专业资源。代价是，收购价之外，还要持续为新案件提供资金。</p>
<p>原股东继续投入的能力和意愿有限，债务融资受到现金流及担保条件约束，私募投资者提出的业务调整也未被接受。澳大利亚当时的制度变化，为外部持股打开了空间。S&amp;G 拟以每股 1 澳元发行，交易总额为 3,500 万澳元，其中约 1,730 万付给出售股份的原股东，230 万用于发行费用，剩余约 1,540 万用于减少净债务。上市能释放融资空间，却没有让全部发行款变成公司的新增现金。</p>
<p>面对这笔交易，案例中的基金经理 Gloria Rosen 要回答三道题：</p>
<ol>
<li>在约 95% 的历史成功率与漫长回款周期之间，这个商业模式究竟创造了多少价值？</li>
<li>并购和上市能否让专业能力持续复制，同时守住法院与客户优先的义务？</li>
<li>按 11% 的资本成本折现，这家公司值多少钱，每股 1 澳元是否值得参与？</li>
</ol>
<h2 id="我的思考">我的思考</h2>
<h3 id="利润确认了现金可能还在路上">利润确认了，现金可能还在路上</h3>
<p><img alt="" src="/img/a97a3b85f19326cf.jpg"></p>
<p>S&amp;G 的业务同时包含法律服务、案件选择和资金垫付。客户把收费风险的一部分交给律所，律所用判断力决定承接哪些案件，再用资本支持等待。</p>
<p><strong>成功案件的 4,500 澳元税前利润，不能直接当成今天创造的价值。</strong> 按课件单案模型，每期六个月、折现率 11%，一宗确定成功的案件净现值约为 1,408 澳元；如果用 95% 作为模型中的成功概率，并按模型处理败诉损失和税款，期望净现值约为 890 澳元。若每期拉长到九个月，成功案件的净现值就降至约 701 澳元。</p>
<p>时间经过，账上的利润没有因此消失，今天愿意为它支付的价格却变了。</p>
<p>我自己的理解是，看这种企业，要把三个问题一起问：案件有没有经济价值，收入确认是否可靠，现金何时能够回来。业务量增加会同时放大这三个问题。更快的增长，也可能意味着更深的资金缺口。</p>
<h3 id="并购的价值来自收购之后的经营">并购的价值来自收购之后的经营</h3>
<p>品牌可以带来案源，统一系统可以减少重复工作，更多案件可以分散部分单案风险。专业资源也可以共享，让原本独立的小团队获得更好的支持。这些都是整合可能创造价值的地方。</p>
<p>但收购一家有收入的律所，并不等于买到了免费的增长。买方付出了收购价，还要承接新增业务的营运资本需求；律师离开、地方客户关系流失，或者整合期间办案质量下降，都可能削弱预期收益。</p>
<p>课件基准模型假设，2009–2011 年每年花 1,000 万澳元收购，价格为被收购收入的 1.2 倍。我把未来收购支出改为零、保留其他假设，企业价值从约 1.510 亿降到约 1.442 亿澳元。<strong>这组未来收购在模型里创造的增量价值，约为 683 万澳元。</strong></p>
<p>模型支持整合战略，但没有给予它无限的容错空间。规模扩大以后，优质标的可能更贵，管理距离可能更远。每一笔交易仍然需要回答：支付价格之后，留下的经营改善，是否足以覆盖投入资本？</p>
<h3 id="上市的理由要落在资金周期上">上市的理由要落在资金周期上</h3>
<p>S&amp;G 的融资需求具有清楚的业务基础：它需要支付收购款，也需要承受案件从投入到回收之间的时间。股权资本没有固定到期还本要求，公开股份还能提供员工激励、股东流动性和未来交易工具。</p>
<p>相应的代价也很具体：发行与持续披露成本、原股东稀释、市场对短期业绩的要求，以及更多管理注意力被用于资本市场。股权资金也有回报要求，它的成本不会因为没有利息账单就消失。</p>
<p><strong>支持一家企业上市，需要先看清资金用途。</strong> 这笔 IPO 的 3,500 万澳元交易额中，接近一半用于原股东出售股份。让长期投入的股东获得流动性有其合理性，但投资人不能把整笔金额都算成未来增长的现金储备。</p>
<p>按课件模型，2009–2011 年自由现金流合计约为负 2,164 万澳元。减少净债务能腾出一定融资空间，后续增长仍须有可执行的资金安排。对创业企业而言，主动放慢增长也应当留在选项里。融资方式要能支持公司的经营节奏。</p>
<h3 id="专业判断的边界必须先于资本写清">专业判断的边界必须先于资本写清</h3>
<p>律所的客户购买服务时，往往难以独立判断专业质量，还必须交付敏感信息、信任律师的判断。股东追求回报与专业义务之间，因此会出现需要明确处理的冲突。</p>
<p>案例中的 S&amp;G 把顺序写进了招股安排：对法院的义务优先，其次是对客户的义务，再次是公司其他责任及股东利益。这是案例当时的安排，不能直接推成所有国家、所有专业服务机构都适用的规则。</p>
<p><strong>资本结构可以改变，职业判断的责任不能变得含糊。</strong> 如果案件是否承接、何时和解、是否继续投入，都被短期利润指标主导，股东最后买到的也可能是被侵蚀的客户信任。</p>
<p>我自己的倾向是，在规则允许的前提下，有条件支持专业服务公司公开持股。前提包括专业人员保留必要的判断权，董事会能处理利益冲突，披露让投资人理解业务质量，激励不只看短期收入。会计师事务所还要面对审计独立性等自身约束，不能直接照搬律所的答案。</p>
<h3 id="每股一元是否值得买取决于假设能否兑现">每股一元是否值得买，取决于假设能否兑现</h3>
<p>按老师指定的 11% 加权平均资本成本，使用课件模型的基准假设，企业价值约为 1.510 亿澳元。扣除发行后约 540 万澳元净债务，股权价值约为 1.456 亿澳元；除以约 1.0778 亿股，每股价值约为 1.35 澳元。</p>
<p>这个数字有吸引力，也有明显的依赖：<strong>终值现值占企业价值约 83%。</strong> 模型使用 24% 的 EBIT 利润率，而案例 2006 年历史利润率约为 17.8%，2008 年预测才达到约 24.2%。未来效率改善需要经营来兑现。</p>
<p>保持其他条件不变，利润率降到 20%，每股估值约为 0.96 澳元。如果同时把有机增长降到 5%、利润率降到 22%、收购倍数提高到 1.5 倍，每股估值约为 0.90 澳元。发行价低于基准估值，并不消除经营下行的可能。</p>
<p>如果把自己放在案例的 IPO 决策时点，我的课堂选择是：有条件、小规模参与。条件是确认 WIP 的质量、扩张期间的融资能力，以及专业义务在实际治理中的优先地位。承担的代价是，基准估值所显示的空间可能被利润率、回款时间或收购成本的变化消耗掉。</p>
<h2 id="对-arcus42-的借鉴">对 Arcus42 的借鉴</h2>
<p>读这个案例，我想到的是专业服务如何处理增长、现金与信任之间的关系。这里可以借鉴的，是几条经营原则。</p>
<p><strong>第一，把交付、收入确认与现金回收分开看。</strong></p>
<p>它们各自回答不同的问题。增长规划既要关注为客户完成了什么，也要看投入发生在何时、回款发生在何时，给等待留下足够余量。</p>
<p><strong>第二，把服务标准沉淀成可以复用的能力。</strong></p>
<p>规模扩大时，可以共享的是流程、知识和质量管理。专业判断仍需清晰的责任归属，不能用更多客户或更多收入代替交付质量的证据。</p>
<p><strong>第三，让资本的时间要求与服务周期相匹配。</strong></p>
<p>长期关系需要连续投入。选择融资方式或增长速度时，应把资本要求兑现的时间，与服务实际创造价值的时间放在同一张表里。</p>
<p><strong>第四，在利益冲突发生之前明确决策顺序。</strong></p>
<p>客户利益、专业责任和经营目标相遇时，组织需要知道谁来判断、依据什么判断、如何留下记录。边界越清楚，合作越能建立在可理解的预期上。</p>
<h2 id="写在最后">写在最后</h2>
<p>课前的我，把票投给这一句：<strong>增长需要的资本，要能够等到价值变成现金。</strong></p>
<hr>

  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

(function(){
  var src=document.getElementById('src').content, box=document.getElementById('light'), btn=document.getElementById('copy');
  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));
  var hero=d.querySelector('.hero img'); if(hero) hero.parentNode.parentNode.removeChild(hero.parentNode);
  var html=wxConvert(d.querySelector('.prose')||d, hero?hero.getAttribute('src'):'', btn.getAttribute('data-date'), btn.getAttribute('data-url'));
  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
