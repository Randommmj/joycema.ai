<div class="phone"><div class="wxhead"><h1>原来，我最近的状态叫「存在主义危机」</h1><p>Joyce Ma<span>2022-03-31</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>最近的状态是：一切都很好，但还是怀疑自己的人生没有价值。 一方面每天打着鸡血，了解瑞达利欧的大国周期、研究装修一座带花园的房子、被一块花砖所蕴含的人文历史所感动；另一方面，惶恐于“此夫过举蹞步而觉跌千里者夫”、对疫情下封不封城的价值观感到迷茫、对中美关系的未来感到惶恐不安、对人生追求的方向感到动摇。</p>
<p>但又不能停。很多问题，仅靠想，是得不出答案的。而且，那么多的幸运降临在我身上，好像不使出浑身解数的工作，就对不起这命运的馈赠；如果不能成长，就会被时代速速的抛弃。虽然知道过好这一生肯定没问题，但又怕虚度光阴如蝼蚁。可，在这浩瀚宇宙中，谁又不是蝼蚁呢？</p>
<p>今天冥想是时候「存在主义危机」这个词儿突然蹦进脑海，搜索了一下，感觉自己的症状，大体都对得上。姑且算是吧，这个词儿听上去就很高级，至少比「中年危机」好多了。</p>
<p>托尔斯泰曾经也陷入过存在主义危机，典型症状就是一直问「为什么」。</p>
<p>为什么要在意？无论这一生做了什么，无论完成了什么，迟早都会被遗忘；迟早，我和我所爱的人都会死去，“只会留下臭气和虫子”。既然一切都消失了，最后被彻底遗忘，挣扎还有什么意义呢？</p>
<p>但是，且而且，为什么在意？</p>
<p>为什么被永远记住是重要的？难道被记住和永生，就算是有意义了吗？为什么需要存在的意义？</p>
<p>哲学家爱比克泰德所说：“你必须提醒自己，你所爱的只是一个凡人，你所爱的没有任何东西是属于你自己的，它是暂时赐给你的，不是永远赐给你的，也不是分开赐给你的，乃是像无花果，或者一串葡萄，按一年的时间赐给你的。你若在冬天盼望，就是愚昧人。所以你们若想念儿子，或者朋友，既没有人给你们，你们就当知道是想念冬天的无花果。”</p>
<p>最近该认真读读哲学了。大学毕业后，研究生一直想读个哲学。因为我知道，那些超越生活，有关生死的问题，始终困扰着我。相信这个问题，哲学先贤们都思考过了。</p>
<p>话说回来，最近对意义感到迷茫，但乐趣倒是很多——来自设计装修的乐趣。</p>
<p>下一篇文章准备说说。</p></div></template>

function wxConvert(root, heroSrc, date, url){
  var C='#333333', B='#385EA1';
  var P='margin:0 0 22px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var H2='margin:44px 0 18px 0;font-size:20px;line-height:1.5;letter-spacing:1px;font-weight:700;color:'+B+';';
  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

  var d=document.createElement('div'); d.appendChild(src.cloneNode(true));

    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
