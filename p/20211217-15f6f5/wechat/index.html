<div class="phone"><div class="wxhead"><h1>世界，是我们选择的样子。</h1><p>Joyce Ma<span>2021-12-17</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>我们人类的出厂设置就是对负面消息格外关注，这在心理学上有个词叫"负面偏见"。 在漫长的演进中，对风险更敏感的人类更容易生存下来。这也让我们每天被焦虑信息围绕着，时时都在感觉世界的分崩离析。</p>
<p>所以，国外有个小哥做了一件很意义的事情，他建立了一个「快乐广播站」，专门收集世界各地的好消息。推荐大家去看看www.thehappybroadcast.com</p>
<p>以下是2021年发生的40件好事儿，enjoy：</p>
<ol>
<li>
<p>墨西哥禁止了化妆品动物实验！成为北美第一个禁止化妆品动物实验的国家。Mexico just banned animal testing for cosmetics! It's the first country in North America to outlaw the practice.</p>
</li>
<li>
<p>如何阻止非法捕鱼？用雕塑！一个意大利活动家将39个巨型大理石雕塑投入大海，这些雕塑不仅为非法网鱼造成巨大的物理障碍，还成为了水下生物的天堂。How to stop illegal net fishing? With sculptures! An Italian activist dropped 39 huge marble sculptures in the sea. The sculptures created both a physical barrier for nets and a heaven for underwater life.</p>
</li>
<li>
<p>葡萄牙工薪阶层在工作相关的精神健康领域取得重大胜利。新法律规定，老板在工作时间以外给员工打电话、发短信或发邮件都是违法行为。Portugal have been given a massive win in work-related mental health as a new law says it's illegal for your boss to phone, email or text you after work hours.</p>
</li>
<li>
<p>艾滋病疫苗通过了第一阶段的人体试验，在受试者中，成功率达到97%！里程碑式的重大突破！This is huge! Landmark HIV vaccine passes phase 1 of human trial and proves successful in 97% of the participants.</p>
</li>
<li>
<p>大堡礁迸发出新的生命力，几百万的珊瑚礁宝宝出生，在过去几年大堡礁出现3次大规模珊瑚白化后，这是一个令人振奋的消息。The Great Barrier Reef bursts with new life as millions of "coral babies" are born! A very happy coral reef news after three bleaching events in past years.</p>
</li>
<li>
<p>世界上已经有10个国家的电力97-100%来自可再生能源。Today's small victory is that there are already 10 countries in the world whose electricity comes from 97-100% renewable energy sources. Progress!</p>
</li>
<li>
<p>瑞士巴塞尔成为世界上第一个强制要求所有新建筑搭建绿色屋顶的城市，超过100万平方米的绿色面积被打造出来！Basel, Switzerland has become the first city in the work to make green roofs mandatory on new buildings. More than 1 million square meters of green spaces have been constructed.</p>
</li>
<li>
<p>肯尼亚传来的好消息！2020年没有犀牛死于非法狩猎。犀牛的数量从2019年的1441头，增加到1605头，增加了11%。Amazing news from Kenya! No rhinos were lost to poaching in 2020 and there was also an 11% increase in rhino numbers from 1,441 in 2019 to 1,605.</p>
</li>
<li>
<p>夏威夷成为美国第一个禁止销售含有伤害珊瑚化学物质的防晒霜的州，开启了珊瑚友好防晒霜时代。Hawaii is the first state in the US to ban the sale of sunscreen containing coral-harming chemicals, ushering in a new era of reef safe sunscreen.</p>
</li>
<li>
<p>为增进不同宗教信众之间的相互了解，德国柏林将新建一座名为“House of One”的混合教堂，里面有犹太教堂，基督教堂，还有清真寺，三个教堂由一个会见区连接。Berlin will soon be home to something unique. The "House of One", a place of worship and cooperation that brings a synagogue, a church, and a mosque under one roof, all linked by a meeting space.</p>
</li>
<li>
<p>大熊猫不再是濒危动物！感谢保护工作的开展，它们的数量在多年下降后终于出现了回升！Great news!Giant pandas are no longer an endangered species. Thanks to conservation efforts, their numbers are finally rebounding after years of decline.</p>
</li>
<li>
<p>智利正在由同等比例男女代表共同起草新宪法，属全球首例。Making history: Chile is creating the world's first constitution to be drafted by an equal number of women and men. A new global standard for gender equality.</p>
</li>
<li>
<p>一家初创公司用AI在超市动态调整价格，离过期日越近的产品，价格会越便宜。这种方式可以减少40%的食品浪费！A startup is using AI in the supermarkets to dinamically change prices. The closer a product is to its best before date, the cheaper it will be to buy. This could reduce food waste by 40%.</p>
</li>
<li>
<p>一家德国动物收容所用约会软件Tinder帮小动物找家。他们会为猫咪和狗狗创建一个“交友”简介，让合适的铲屎官更方便地跟它们配对。A German animal shelter is using dating app Tinder for a good cause. It created "dating" profiles of cats and dogs to match them with their forever human.</p>
</li>
<li>
<p>重大进展，南非终于要禁止为战利品狩猎和游客抚摸而圈养繁殖狮子的行为！In a major move, South Africa will finally ban the breeding of lions in captivity for trophy hunting or for tourists to pet.</p>
</li>
<li>
<p>非盈利机构“海洋清理”用一个长达半英里的巨大装置从太平洋捞出2万磅的塑料垃圾，证明海洋垃圾是可以清理的！A half-mile installation by nonprofit The Ocean Cleanup just took 20,000 pounds of plastic out of the Pacific, proof that ocean garbage can be cleaned.</p>
</li>
<li>
<p>1979年，16岁的Jadav Payeng开始在印度当地每天种一棵树苗，他坚持了40年，如今，创造了一个比中央公园还大的森林。In 1979 at 16 years of age, Jadav Payeng started planting a tree sapling a day in his region in India. He did that for 40 years, creating a forest larger than Central Park.</p>
</li>
<li>
<p>在撒哈拉以南的非洲地区，疟疾是造成儿童生病死亡的最大因素，但是就在今年，世界上首款疟疾疫苗已被批准！数十亿人有望得到接种。Groundbreaking vaccine for malaria, the biggest cause of childhood illness and death in sub-Saharan Africa, is approved and could be rolled out to billions.</p>
</li>
<li>
<p>实验室培育的钻石也是永恒的。世界上最大的珠宝制造商将不再使用开采的钻石，而是专注于更可持续的实验室培育钻石。Lab-grown diamonds are forever. The world's largest jewelry maker will no longer use mined diamonds and focus on more sustainable, lab-grown gems.</p>
</li>
<li>
<p>每一次威尔士有一个新生儿出生，他们就会种下两棵树，一棵种在自己家，另一棵种在乌干达，目前已经种了1500万棵树！In an unlikely partnership, every time a new child arrives in Wales, two trees are planted, one at home and one in Uganda. So for 15 millions trees have been planted.</p>
</li>
<li>
<p>为回应140万欧盟民众签名的请愿，欧盟议会以压倒性投票宣布，将逐步淘汰笼养动物的农场。（这个图哪里怪怪的🤨）European Parliament overwhelmingly voted in favor of phasing out caged animal farming in response to a petition signed by 1.4 million EU citizens.</p>
</li>
<li>
<p>重大研究发现，地球臭氧层正在愈合，大概2050年能得到彻底修复！Major study finds that the Ozone layer is healing and it's on pace for a full recovery by 2050.</p>
</li>
<li>
<p>欧洲第一家大象退休之家在法国开门，专门收留那些从动物园，马戏团退休的大象，52岁的大象Gandhi是他们第一个住户。The first "retirement home" in Europe for elephants from zoos or circuses has opened its doors in France. 52 year old elephant Gandhi is their first resident.</p>
</li>
<li>
<p>尽管面临历史性挑战，但由于现在读者们的求知欲和对逃避现实的渴望，图书业正在迎来销售热潮。去支持你们当地的书店吧！In spite of historic challenges, the book industry is seeing a boom in sales as readers seek escapsion and education. Support your local bookstore!</p>
</li>
<li>
<p>为了减少塑料污染，西班牙计划将在2023年之前禁止包裹蔬菜和水果的一次性塑料。Spain has announced plans to ban single-use plastic wrap for fruit and vegetables as of 2023 in an effort to reduce waste and plastic pollution.</p>
</li>
<li>
<p>英国城市莱斯特，正在安装一批新的的“蜜蜂公交站”，30个公交站屋顶被铺上了野花，鼓励蜜蜂授粉。The UK city of Leicester is installing a new network of "bee bus stops", 30 bus stops that have been topped with a mix of wildflowers to encourage pollination.</p>
</li>
<li>
<p>因为成功晋级世界杯，塞尔维亚足球队获得100万欧元的奖励。但球员们最后决定把这笔钱全部捐给帮助救治患病儿童的慈善机构。Serbia's Football team earned one million euros for qualifying for the World Cup. The players decided to donate it all to charities that help treat sick children's in their country.</p>
</li>
<li>
<p>加拿大一家公司计划用无人机播种10亿棵树，无人机将飞到遭受滥砍滥伐的偏远地区，往地上射下种子。A Canadian company aims to plant 1 billion trees using drones that can shoot seed pods into the ground in remote areas that have suffered from deforestation.</p>
</li>
<li>
<p>为了打击容貌压力，挪威新法律规定，网红明星的美颜照片都要打上特殊Logo水印，p图、滤镜，全都要标注。In an efforts to combat beauty and appearance pressures, Norway's new law mandates that social media influencers disclose when they've retouched or added a filter to a photo</p>
</li>
<li>
<p>生活在野外的南部居留虎鲸只有73只了，但科学家刚刚发现，其中3只怀孕了！有一只马上要生了！Only 73 southern resident orcas exist in the wild. Scientists just discovered that 3 of them are pregnant, and one is close to giving birth.</p>
</li>
<li>
<p>喀麦隆的大猩猩守护俱乐部将盗猎者变成了守护者。现在村民们不需要通过非法狩猎维持生计，而是依靠保护猩猩来赚钱。The Gorilla Guardian Club in Cameroon converts poachers into protectors. Instead of earning a living through poaching, the villagers get paid to monitor primates.</p>
</li>
<li>
<p>足球季时，罗马尼亚足球联盟跟狗狗收容所合作，每场比赛之前，球员们都会抱着一直救助的狗狗来推广收养。The Romanian football federation teamed up the dog shelters for the soccer season. Before each match, players hold rescue dogs in their arms to promote adoptions.</p>
</li>
<li>
<p>在一项重大突破中，血液检测被发现可以有效检测出抑郁症，躁郁症，并将病人和适合的药物配对。In a major breakthrough, a blood test proved to be effective in detecting depression and bipolar disorder and match people to the right medications.</p>
</li>
<li>
<p>英国马上将成为第一个完全禁止进口和出口鱼翅，以及任何包含它们的产品的国家！The UK will soon be the first country to comprehensively ban the import and export of shark fins and any products containing them.</p>
</li>
<li>
<p>80%曾依靠有毒杀虫剂的加州酿酒厂正在用谷仓猫头鹰替代杀虫剂来保护葡萄树，消除害虫。80% of Californian Winemakers who used to rely on toxic pesticides are using barn owls as a pesticide-free alternative to protect vines and eliminate pests.</p>
</li>
<li>
<p>在芬兰，一批强悍的奶奶们组成一个叫“活动家奶奶”的团队，致力于控制气候变化，确保他们的子孙能有一个更可持续的未来。In Finland there's a community of badass grandmothers helping to curb climate change called Aktivistimummot (Activist Grannies). Their goal: to ensure their grandchildren have a sustainable future.</p>
</li>
<li>
<p>在一项创造历史的判决中，荷兰法庭判决要求壳牌石油公司减少45%的二氧化碳排放。为制约跨国公司创造了一个先例！In a historic ruling, a Dutch court has ordered oil company Shell to cut its CO2 emission by 45%. A precedent for cases against polluting multinationals.</p>
</li>
<li>
<p>伦敦的一家面料生产商，将菲律宾数吨菠萝肥料制成人工皮革，在时尚行业，0污染和不残忍是可能实现的！A textile maker in London is turning tons of pineapple waste from the Philippines into sustainable vegan leather. Zero waste &amp; cruelty free fashion is possible!</p>
</li>
<li>
<p>格拉斯哥一家酒吧正在试验一种创新的能量供给方式——将热舞中人们身体的热量转化成供俱乐部使用的电能。这可以在一年中减少70吨的二氧化碳排放。A Glasgow club is trialing an innovative method that uses the dancers' body heat to generate energy to power the venue. This will save 70 tonnes of CO2 per year!</p>
</li>
<li>
<p>重大进展！葡萄牙关停了它最后一个选煤厂，比预期提前九年成为一个无煤炭国家。Huge climate victory: after closing its last coal plant, Portugal is now coal gree. They have achieved the target 9 years ahead of schedule!</p>
</li>
</ol></div></template>
<script>

function wxConvert(root, heroSrc, date, url){
  var C='#333333', B='#385EA1';
  var P='margin:0 0 22px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var H2='margin:44px 0 18px 0;font-size:20px;line-height:1.5;letter-spacing:1px;font-weight:700;color:'+B+';';
  var H3='margin:32px 0 14px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';font-weight:700;';
  var LI='margin:0 0 10px 0;font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';';
  var TD='border:1px solid #e3e3e3;padding:6px 8px;font-size:14px;line-height:1.6;color:'+C+';text-align:left;vertical-align:top;';
  var HR='<section style="margin:36px 0;text-align:center;"><span style="display:inline-block;width:28px;height:1px;background-color:'+B+';vertical-align:middle;">&#8203;</span></section>';
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function abs(s){ try{ return new URL(s, location.href).href; }catch(_){ return s; } }
  function img(src){ return '<section style="margin:8px 0 22px 0;"><img src="'+abs(src)+'" alt="" style="display:block;width:100%;height:auto;"></section>'; }
  function inl(n){
    var h='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3){ h+=esc(c.textContent); return; }
      if(c.nodeType!==1) return;
      var t=c.tagName;
      if(t==='STRONG'||t==='B') h+='<strong style="font-weight:700;color:'+B+';">'+inl(c)+'</strong>';
      else if(t==='EM'||t==='I') h+='<em>'+inl(c)+'</em>';
      else if(t==='CODE') h+='<span style="font-family:Menlo,Consolas,monospace;font-size:14px;background-color:#f5f5f3;padding:0 3px;">'+inl(c)+'</span>';
      else if(t==='BR') h+='<br>';
      else if(t==='IMG') h+='<img src="'+abs(c.getAttribute('src'))+'" alt="" style="max-width:100%;height:auto;">';
      else h+=inl(c);   // 公众号不允许外链：链接只保留文字
    });
    return h;
  }
  function blocks(root, ps){
    var h='';
    root.childNodes.forEach(function(c){
      if(c.nodeType===3){ if(c.textContent.trim()) h+='<p style="'+ps+'">'+esc(c.textContent.trim())+'</p>'; return; }
      if(c.nodeType!==1) return;
      var t=c.tagName, imgs=c.querySelectorAll('img');
      if(t==='IMG'){ h+=img(c.getAttribute('src')); return; }
      if((t==='P'||t==='FIGURE') && imgs.length && !c.textContent.trim()){ imgs.forEach(function(i){ h+=img(i.getAttribute('src')); }); return; }
      if(t==='P') h+='<p style="'+ps+'">'+inl(c)+'</p>';
      else if(t==='H1'||t==='H2') h+='<p style="'+H2+'">'+inl(c)+'</p>';
      else if(/^H[3-6]$/.test(t)) h+='<p style="'+H3+'">'+inl(c)+'</p>';
      else if(t==='UL'||t==='OL'){
        var tg=t.toLowerCase(); h+='<'+tg+' style="margin:0 0 22px 0;padding-left:1.6em;">';
        Array.prototype.forEach.call(c.children,function(li){ h+='<li style="'+LI+'">'+inl(li)+'</li>'; });
        h+='</'+tg+'>';
      }
      else if(t==='BLOCKQUOTE') h+='<section style="margin:0 0 22px 0;padding:2px 0 2px 14px;border-left:3px solid '+B+';">'
          +blocks(c,'margin:0 0 12px 0;font-size:15px;line-height:1.9;letter-spacing:0.5px;color:#666666;')+'</section>';
      else if(t==='HR') h+=HR;
      else if(t==='TABLE'){
        h+='<table style="width:100%;border-collapse:collapse;margin:0 0 22px 0;">';
        c.querySelectorAll('tr').forEach(function(tr){
          h+='<tr>'; tr.querySelectorAll('th,td').forEach(function(td){
            h+='<td style="'+TD+(td.tagName==='TH'?'font-weight:700;background-color:#f7f7f5;':'')+'">'+inl(td)+'</td>'; });
          h+='</tr>'; });
        h+='</table>';
      }
      else if(t==='PRE') h+='<section style="margin:0 0 22px 0;padding:12px 14px;background-color:#f7f7f5;font-family:Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;color:'+C+';">'+esc(c.textContent)+'</section>';
      else h+=blocks(c,ps);
    });
    return h;
  }
  var h='<section style="font-size:16px;line-height:1.9;letter-spacing:0.5px;color:'+C+';">';
  if(heroSrc) h+='<section style="margin:0 0 28px 0;"><img src="'+abs(heroSrc)+'" alt="" style="display:block;width:100%;height:auto;"></section>';
  h+=blocks(root,P)+HR;
  h+='<p style="margin:0 0 10px 0;font-size:13px;line-height:1.8;letter-spacing:0.3px;color:#8a8f99;">本文首发于 joycema.ai · '+esc(date)+'<br>'+esc(url)+'</p>';
  return h+'</section>';
}

    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
