<div class="phone"><div class="wxhead"><h1>读《长寿真相》（3）</h1><p>Joyce Ma<span>2026-09-20</span></p></div>
<div class="article" id="light"></div></div>
<template id="src"><div class="prose"><p>前两篇笔记，都在结尾留了同一个问题：保健品。</p>
<p>这是第三篇，也是这本书的最后一部分。</p>
<p>第一篇里我提过，自己常年规律服用 NMN。读到"保健品可能没法帮你长命"那一句时，我停顿了一下。</p>
<p>这一篇，托波尔把那句话展开了。</p>
<p>问题很直接：医疗科学如此发达，总该存在某种对长寿有帮助的药物吧？它是不是就藏在市场上那些五花八门的补剂里？</p>
<p>以下，enjoy：</p>
<h2 id="1-鱼油两万五千人五年无效">1. 鱼油：两万五千人，五年，无效</h2>
<p>先说最老牌的——鱼油。</p>
<p>2019 年，一项名为 VITAL 的超大型临床试验公布了结果。25,871 名健康成年人，被追踪了五年多。</p>
<p>研究者只想弄清一件事：每天吃一克标准剂量的欧米茄-3 鱼油——就是超市里随处可买、含 EPA 和 DHA 混合物的那种——到底能不能像传说中那样，把心血管疾病和癌症挡在门外？</p>
<p>结果：无效。</p>
<p>无论是总体的心血管事件，还是癌症的发病率，吃鱼油的人与吃安慰剂的人相比，没有任何显著差异。</p>
<p>托波尔的比喻不太客气：你以为每天那一克鱼油是在给血管做深度清洁，实际上，更像房子着了火，你用一只白酒杯往火里泼了一口水。</p>
<p>更糟的是，长期过量摄入 DHA，还会降低免疫功能，影响血小板聚集。</p>
<p>一个吃了几十年的常识，被两万五千人的数据安静地放下了。</p>
<h2 id="2-换血一升一万美元的年轻">2. 换血：一升一万美元的年轻</h2>
<p>鱼油是老牌补剂。那么硅谷那些听起来更科幻的"黑科技"呢？</p>
<p>比如换血疗法。</p>
<p>你可能听过硅谷富豪布莱恩·约翰逊（Bryan Johnson）的故事——他曾与自己年轻的儿子换血，希望通过输入年轻血液来逆转衰老。</p>
<p>后来，约翰逊自己也承认，没有达到预期的效果。</p>
<p>托波尔说，现在确实有公司提供年轻血浆输注和血浆置换疗法，价格高达每升 1 万美元。但针对人体的换血研究很少，而且那几个研究基本没有发现疗效——比如一项针对 9 名阿尔茨海默病患者的小型随机试验，使用年轻人捐献的血浆治疗，结果没有效果。</p>
<p>他特别强调了一点：除了价格昂贵、缺乏证据之外，血浆输注与置换还存在严重的疾病传播风险。</p>
<p>花钱买一个没有证据的希望，同时接受一个确定存在的风险。</p>
<p>这不像医学，更像一场仪式。</p>
<h2 id="3-nad我停顿的那一段">3. NAD+：我停顿的那一段</h2>
<p>然后，就到了我自己的那一段。</p>
<p>NAD+ 是线粒体产生的一种代谢物，在能量代谢中发挥核心作用——促进基因修复，延缓细胞衰老。随着年龄增长，体内 NAD+ 的水平会下降。</p>
<p>于是很多公司开始销售号称能补回 NAD+ 的产品，最常见的是 NR 和 NMN。一个是维生素 B3 的一种形式，一个是有机小分子，进入人体后都会转化为 NAD+——算是一种有高科技加持的"吃啥补啥"。</p>
<p>托波尔的判断是：这些产品在被广泛销售之前，根本没有经过人体临床试验的证实。</p>
<p>NAD+ 在体内起效，离不开人体自身分泌的许多其他物质的配合。单纯从体外摄入人工合成的类似物，很可能徒劳无功。</p>
<p>更值得警惕的是，一部分研究机构和生物医药企业，还刻意淡化了它可能的副作用——比如，增加癌症的患病风险。</p>
<p>对一个常年服用 NMN 的人来说，这一段读得不太舒服。</p>
<p>但不舒服，往往是一本书在起作用的时刻。</p>
<p>我不打算立刻下结论。只是把它从"日常"移回了"待验证"——在有人类大型随机对照试验之前，它不该占据一个确定的位置。</p>
<p>我们对自己身体做的很多事，本质上是在为一个还没被证明的故事付费。</p>
<h2 id="4-那么到底有没有">4. 那么，到底有没有</h2>
<p>托波尔对"生物黑客"手段的总结只有一句：要么缺乏人类大型随机对照试验的临床获益证据，要么伴随巨大风险。</p>
<p>那到底有没有什么东西，是真的有效的？</p>
<p>他给了一个答案，而且是一个很多人没想到的答案：GLP-1 类药物——司美格鲁肽、替尔泊肽。</p>
<p>这类药物最初是用来治疗糖尿病和肥胖的。</p>
<p>治疗糖尿病和肥胖的药，怎么会和长寿有关？</p>
<p>要回答这个问题，需要先接受托波尔在书里最有颠覆性的一个观点。</p>
<h2 id="5-万病同源">5. 万病同源</h2>
<p>心脏病、癌症、老年痴呆——这三种看起来风马牛不相及、让人短寿的疾病，有着共同的底层机制：慢性炎症，与免疫系统的功能障碍。</p>
<p>先说心脏病。传统观念认为，动脉粥样硬化就是血管被油脂"堵住"了，像水管里的水垢。但它的本质，是血管壁的炎症——而所有炎症，归根结底都由免疫系统引发。</p>
<p>托波尔讲了一个证据。一项名为 CANTOS 的大型临床试验中，科学家给心脏病患者注射一种强效抗炎靶向药（卡纳单抗），专门抑制免疫系统导致的血管炎症。</p>
<p>结果，患者的心脏病发作率显著下降。</p>
<p>意外的是，致命性肺癌的发病率，也大幅降低了。</p>
<p>一石二鸟。心血管疾病和癌症，共享着同一个炎性开关。</p>
<p>再说癌症。癌症本身通常并不致命，真正致命的是转移。癌细胞要在体内游走、播种，前提是进化出极强的伪装能力，逃避免疫系统的追杀——而衰老的免疫系统，恰恰是最容易被骗过的。</p>
<p>托波尔说，只要免疫系统保持强悍，绝大多数情况下，癌细胞会被锁死在原发地。</p>
<p>最后是神经退行性疾病。过去医学界一直以为，大脑因为有血脑屏障保护，是一座不太受免疫系统影响的孤岛。现在我们知道，大脑里驻扎着一种叫"微胶质细胞"的巨噬细胞——它们是大脑的哨兵，也是垃圾清运工。</p>
<p>随着年龄增长，这些哨兵会耗竭，陷入"终末期炎症"状态：不再清理代谢垃圾，反而开始释放促炎因子，破坏神经突触，导致脑细胞死亡。</p>
<p>托波尔直言：如果没有大脑内部这场"炎性暴乱"，阿尔茨海默病和帕金森病，很难真正摧毁大脑。</p>
<p>三种病，一个源头。</p>
<h2 id="6-二十年的窗口">6. 二十年的窗口</h2>
<p>既然万病同源，都能追溯到免疫失控与慢性炎症，那就有了一个破局点。</p>
<p>托波尔说，这三大慢性杀手，通常需要二十年甚至更长的时间来潜伏和酝酿。这给了人类一个极其宽广的"早期拦截窗口"。</p>
<p>GLP-1 药物，就是目前拦截窗口里最有证据的一把工具。</p>
<p>一项涉及 17,600 名有心脏病史的肥胖患者的大型随机试验显示：使用司美格鲁肽三年后，治疗组的心脏病发作、中风和心血管死亡风险，下降了 20%。</p>
<p>更有意思的是发生的顺序。</p>
<p>在这些患者身上，先下降的是炎症水平和心血管风险——然后，才是体重。</p>
<p>这说明什么？说明 GLP-1 拯救生命的底层逻辑，不只是"减重让人更健康"。它率先、并且独立地降低了全身的慢性炎症，从而降低了心血管风险。</p>
<p>体重是我们看得见的结果。炎症，是我们一直看不见的原因。</p>
<h2 id="7-钥匙藏在肠道里">7. 钥匙藏在肠道里</h2>
<p>GLP-1 药物在神经退行性疾病上，也展现出了让人意外的潜力。</p>
<p>在针对早期帕金森病患者的临床试验中，使用 GLP-1 药物成功阻止了患者运动症状的恶化——而且这种保护作用，在停药后依然持续。</p>
<p>这在生物学上是一个谜。因为许多大分子 GLP-1 药物，根本无法大量、直接地穿透血脑屏障。</p>
<p>科学家推测，这群"肠道激素"动用了一种"远程遥控"的机制：通过"肠-脑轴"，直接向大脑皮层和下丘脑发送信号，在不突破物理屏障的情况下，关闭了大脑内部引发神经退化的炎症暴乱。</p>
<p>也就是说——治疗大脑绝症的钥匙，可能藏在肠道里。</p>
<p>第二篇里我们说过，决定血糖反应的不是食物，是肠道菌群。这一篇，肠道又一次出现在了答案里。</p>
<p>身体不是一堆各自为政的器官，而是一张我们至今没有完全读懂的网。</p>
<p>需要说明的是，GLP-1 是处方药，有它的适应症和副作用。托波尔写的是它在医学上打开的可能性，不是一份购物清单。这一点，我也一样。</p>
<h2 id="写在最后">写在最后</h2>
<p>三篇笔记，到这里写完了。</p>
<p>托波尔在书的结尾反复强调一个观点：我们这代人能做的、也唯一该做的，不是妄图逆转底层的生物学衰老，而是利用现有的科技，精准拦截那些正在悄悄酝酿的特定慢性病。</p>
<p>回头看这三篇，其实是同一句话的三次展开：</p>
<ol>
<li>长寿主要不靠基因——基因只解释 25-30%，剩下的在我们手里；</li>
<li>没有通用的完美食谱、通用的运动处方、通用的筛查年龄——只有属于你自己的那一套；</li>
<li>也没有一颗通用的长寿药——鱼油、换血、NAD+，大多是没有证据的希望；真正有证据的，反而来自一个原本用来治糖尿病的药，和它背后"万病同源"的洞见。</li>
</ol>
<p>托波尔说，长寿的真相其实很简单：它不是一场对抗衰老的战争，而是一场关于选择的革命。选择更适合你的食谱和吃法，选择更个性化的检测与药物，选择更多的运动，选择更紧密的社交联系，和更有意义的人生目标。</p>
<p>塞内加在《论生命之短暂》里写道：我们不是拥有的时间太少，而是浪费的太多。</p>
<p>两千年后，一位心脏病学家用一整本书的临床数据，说了差不多的话——</p>
<p>问题从来不在寿命的长度，而在健康的那一段，有多长。</p>
<p>真正的长寿不是活得更久，而是活得更好：身体有活力，心智清晰，情感丰富，生活有意义。</p>
<p>书读完了。</p>
<p>练习，才刚开始。</p></div></template>

  box.innerHTML=html;
  function done(ok){ btn.textContent=ok?'已复制 ✓ 去公众号编辑器粘贴':'复制失败，请再点一次'; btn.className=ok?'ok':'';
    setTimeout(function(){ btn.textContent='复制正文到公众号编辑器'; btn.className=''; }, 3000); }
  function viaSelection(){
    var r=document.createRange(); r.selectNodeContents(box);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    s.removeAllRanges(); return ok;
  }
  btn.addEventListener('click', function(){
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write && window.isSecureContext){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),
                                                    'text/plain':new Blob([box.innerText],{type:'text/plain'})})])
        .then(function(){ done(true); }, function(){ done(viaSelection()); });
    } else done(viaSelection());
  });
})();
</script>
</body></html>
